# SearXNG Settings — Internal Only
# Bound to 127.0.0.1:18888 via Docker Compose
# No public exposure, no paid APIs

use_default_settings: true

general:
  instance_name: "Trade AI Search (Internal)"
  debug: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: ""
  limiter: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: true
  infinite_scroll: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0

# ENGINE POOL, and why three are off.
#
# Measured 2026-09-05: of the engines enabled here, only `bing` was serving.
# brave, duckduckgo and startpage were all returning anti-bot refusals —
# "too many requests", "CAPTCHA", "Suspended: CAPTCHA" — contributing ZERO
# results while still costing a 6s request_timeout each on every search.
#
# These are SCRAPERS. SearXNG's `brave` engine has base_url
# "https://search.brave.com/" — the public website — and sends no subscription
# token. It is NOT the Brave Search API and cannot use an API key, so the paid
# Brave subscription this project holds does not and cannot affect it. That API
# is reached separately by scripts/brave_search.py through the budgeted lane and
# is unaffected by anything here.
#
# Leaving a permanently-blocked engine enabled has two costs: latency on every
# query, and an `engine_pool_impaired` alarm that is red forever and therefore
# means nothing. Re-enable any of these if the block lifts.
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true          # CAPTCHA, measured 2026-09-05

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true          # "Suspended: CAPTCHA", measured 2026-09-05

  - name: google
    engine: google
    shortcut: g
    # Measured 2026-09-05: `engines=google` returns 0 results on every query and
    # reports NO error, so it never appears in unresponsive_engines. Google
    # serves scrapers a consent/block page that parses to zero rather than
    # failing loudly. Same wall as brave/duckduckgo/startpage, but silent — it
    # looked like a working second engine for as long as nobody checked which
    # engine the results came from.
    disabled: true

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: true          # "too many requests" — anonymous scraper, not the
                            # paid API. See the note above the engine list.

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  # REMOVED 2026-09-05: `engine: yahoo_finance` does not exist in this image.
  # Every container start logged
  #   Cannot load engine "yahoo_finance"
  #   FileNotFoundError: /usr/local/searxng/searx/engines/yahoo_finance.py
  #   loading engine yahoo finance failed: set engine to inactive!
  # A declared engine that cannot load is worse than an absent one: it appears
  # in the config as coverage that does not exist.

  # ── ENGINES ADDED 2026-09-05, each verified by query before being listed ──
  #
  # Tested twelve candidates against "federal reserve interest rate" and then
  # ranked the survivors on "nvidia quarterly earnings", because returning
  # results is not the bar — bing returns results and answered "federal reserve
  # policy" with federalpremium.com, an ammunition retailer.
  #
  #   REJECTED, no results:   mojeek (silent, like google), crowdview
  #   REJECTED, hard failure: qwant/access denied, yahoo/HTTP protocol error,
  #                           presearch/timeout, searchmysite/access denied
  #   REJECTED, poor index:   mwmbl (top hits were 2017 United Airlines and
  #                           2019 Sony), wiby (olivebiodiesel.com)
  #
  # The three below returned investor.nvidia.com, CNBC, investing.com and
  # marketbeat — better finance results than the incumbent bing, which returned
  # the nvidia.com homepage and geforcenow.com.
  # ── Brave, through the PAID API rather than the blocked scraper ──
  #
  # The `brave` engine above is a scraper of search.brave.com and is rate-limited
  # to nothing. `braveapi` is a different engine shipping with SearXNG that calls
  # api.search.brave.com — the product this project already pays for, measured
  # 2026-09-05 at 50 req/sec with an unmetered monthly window.
  #
  # DISABLED HERE ON PURPOSE. It is mandatory-keyed, SearXNG performs no
  # environment substitution in settings.yml (checked: the loader only reads
  # SEARXNG_SETTINGS_PATH), and THIS REPOSITORY IS PUBLIC. A literal key here
  # would be a published credential.
  #
  # To enable, on the host only — never committed:
  #   1. sudo chmod 644 <this file>       (it is owned by the container user)
  #   2. set api_key to the value of BRAVE_SEARCH_API_KEY from the project .env
  #   3. set disabled: false
  #   4. sg docker -c 'docker restart searxng'
  #
  # The live file already diverges from this one — SearXNG injects `secret_key`
  # at startup — so it is instance config carrying secrets, and this file is the
  # template. That split is inherent, not drift.
  #
  # Budget note: this bypasses scripts/brave_search.py, so calls made here are
  # NOT counted by lib/search_budget. Enable it deliberately.
  # `inactive: false` is REQUIRED and is not the same as `disabled`.
  # SearXNG's defaults ship this engine with `inactive: true`, which means it is
  # never registered at all — not "registered but off". Setting only
  # `disabled: false` leaves inactive in place, and the engine is skipped
  # SILENTLY: it appears in no /config listing and logs nothing. Measured
  # 2026-09-06 — braveapi and `yahoo news` both installed cleanly, both absent
  # from the running config, with no error anywhere.
  - name: braveapi
    engine: braveapi
    shortcut: bapi
    api_key: ""
    results_per_page: 20
    inactive: false
    disabled: true

  # Measured 2026-09-06 after being installed enabled specifically to test it:
  #     engines=yahoo news -> 0 results, unresp=[['yahoo news', 'HTTP error']]
  # It fails LOUDLY, which is the one good thing about it — unlike google, it
  # lands in unresponsive_engines rather than pretending to work. Kept listed
  # and disabled so the measurement survives; an engine deleted outright gets
  # re-added by the next person who notices the pool is small.
  - name: yahoo news
    engine: yahoo_news
    shortcut: yhn
    inactive: false
    disabled: true

  - name: seznam
    engine: seznam
    shortcut: sz
    disabled: false

  - name: yep
    engine: yep
    shortcut: yp
    disabled: false

  # Yandex is Russian-operated. It returned the best finance results of the set
  # and is listed for that reason, but this is a data-sovereignty call the
  # operator may want to make differently: set disabled: true to drop it and the
  # pool still has seznam + yep + bing.
  - name: yandex
    engine: yandex
    shortcut: yd
    disabled: false
