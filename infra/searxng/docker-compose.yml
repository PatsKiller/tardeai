services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:18888:8080"
    volumes:
      # SEARXNG_CONFIG_DIR is the LIVE instance config, and it must live OUTSIDE
      # this repository.
      #
      # SearXNG rewrites this directory at startup (secret_key) and the installer
      # writes the Brave API key into it, so it is runtime state — but mounted here
      # it was also a TRACKED file that git owns. The container chowns the directory
      # to 977:977, which uid 1000 cannot then unlink, so `git checkout` does not
      # merely clobber the live config: it FAILS OUTRIGHT and blocks the whole
      # checkout. On 2026-09-06 this one file blocked 70 others from updating on the
      # executing tree — which is how eighteen commits of merged fixes ended up not
      # running.
      #
      # The default keeps in-repo behaviour for a fresh clone that has not set the
      # variable; this host sets it in infra/searxng/.env (untracked, gitignored).
      - ${SEARXNG_CONFIG_DIR:-./core-config}:/etc/searxng:rw
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
