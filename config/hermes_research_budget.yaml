# Hermes Research Budget Policy
# Same governance posture as config/llm_budget_policy.yaml + config/finviz_screener_cadence_policy.yaml:
# tier research by how strong its trigger is, cap each tier, keep broad-universe work OFF the LLM,
# free-OAuth preferred for deep cloud synthesis; DeepSeek Flash only on free-OAuth bottleneck
# (explicit rollover, cost-gated). Fail closed for unknown sources.
#
# Decisions: ALLOW | DEFER | METADATA_ONLY | BLOCK. Read by scripts/hermes_research_budget_guard.py.
# Advisory-only system: nothing here places trades, touches the broker, or bypasses any gate.

version: 1
fail_closed: true            # unknown trigger_source / unknown tier -> BLOCK
no_paid_fallback: false      # paid DeepSeek Flash allowed ONLY as free-OAuth bottleneck rollover (see cloud_unavailable.free_oauth_bottleneck_rollover); never for local-lane failure
default_research_ttl_hours: 24

# Hermes audit 2026-07-02: external OAuth lanes only for capital-exposed / actionable tiers.
external_cloud_tiers: ["T0", "T1"]
max_external_symbols_per_run: 50

# Local GPU policy MUST match docs/diligence/current/LOCAL_LLM_RUNTIME_POLICY.md.
market_hours:
  timezone: America/New_York
  window: "06:00-12:00"
  blocked_local_models: []
  allowed_local_models: ["nomic-embed-text"]

# Free-OAuth cloud lanes (no paid key). Paid models may only run when explicitly cost-gated, never
# as an automatic fallback.
lanes:
  free_oauth: ["grok", "chatgpt"]          # xAI :8645 + openai-codex :8646
  free_oauth_models: ["grok-3-mini", "gpt-5.4", "gpt-5-codex"]
  paid_models: ["claude-sonnet-4-6", "claude-opus-4-8", "gpt-4o"]
  local_models: []
  local_heavy_models: []

# Tiers — strongest trigger first. trigger_source values map to a tier in `trigger_source_tier`.
tiers:
  T0:
    name: "Held risk — holdings, open positions, open proposals"
    description: "Capital is actually exposed. Always research-eligible."
    llm_allowed: true
    cloud_allowed: true                     # free-OAuth deep synthesis allowed
    local_allowed: false
    max_symbols_per_run: 200
    max_llm_calls_per_day: 600
    research_ttl_hours: 12

  T1:
    name: "Actionable — GO candidates, approval queue, high-ranked watchlist"
    description: "Near-term decision pending. Capped to keep the lane fast."
    llm_allowed: true
    cloud_allowed: true
    local_allowed: false
    max_symbols_per_run: 50                  # the GO/high-rank cap
    max_llm_calls_per_day: 300
    research_ttl_hours: 12
    watchlist_min_score: 70                  # only high-rank watchlist counts as T1

  T2:
    name: "Themed — active directives, sector themes, WAIT candidates"
    description: "Requires an explicit active trigger (directive/theme/wait). No trigger -> drop a tier."
    llm_allowed: true
    cloud_allowed: true                      # free-OAuth deep synthesis allowed
    local_allowed: false
    requires_active_trigger: true
    max_symbols_per_run: 80
    max_llm_calls_per_day: 200
    research_ttl_hours: 24

  T3:
    name: "Broad discovery universe — metadata only, NO LLM"
    description: "Snapshot/screener/broad watchlist. Metadata enrichment only. LLM is never called here."
    llm_allowed: false                       # hard: broad universe never calls an LLM
    cloud_allowed: false
    local_allowed: false
    metadata_only: true
    max_symbols_per_run: 1000
    research_ttl_hours: 72

  T4:
    name: "Cold universe — no research"
    description: "No active trigger, not ranked, not held. No research at all."
    llm_allowed: false
    cloud_allowed: false
    local_allowed: false
    no_research: true

# trigger_source -> tier. Anything NOT listed here is unknown -> fail closed (BLOCK).
trigger_source_tier:
  holdings: T0
  open_position: T0
  open_positions: T0
  position_protection: T0
  open_proposal: T0
  open_proposals: T0
  proposal_review: T0
  approval_queue: T1
  go_candidate: T1
  momentum_scalp_go: T1
  high_rank_watchlist: T1
  watchlist_high_rank: T1
  active_directive: T2
  watch_directive: T2
  directive_hit: T2
  sector_theme: T2
  wait_candidate: T2
  watchlist_wait: T2
  topic_research: T2
  incubator: T2
  broad_universe: T3
  ticker_snapshot: T3
  ticker_snapshot_daily: T3
  finviz_broad: T3
  cold_watchlist: T3
  top20_curation: T3          # the 20k-row broad driver: metadata-only by default; promote per-symbol via tier
  cold_universe: T4
  unranked: T4
  # Existing producer trigger_reason values (mapped so known flows pass; unknown still fails closed).
  enh_position: T0
  enh_closed_trade: T0
  paper_postmortem: T0
  monthly_protection_meta_review: T0
  enh_proposal: T1
  enh_scalp: T1
  enh_report: T2
  enh_sector: T2
  research_scheduler: T2
  feedback-seed: T2
  feedback_seed: T2
  manual: T1                  # operator-initiated research is actionable by definition
  operator_telegram: T1

# Duplicate-suppression: same (symbol, research_type, lane) inside this window -> DEFER.
dedup:
  freshness_hours: 12
  decision_when_fresh: DEFER

# When free-OAuth (Grok/ChatGPT) is requested but bottlenecks (auth fail / cooldown /
# proxy down / zero lanes ok):
#   1) Prefer DEFER for bulk/non-escalation work (retry later).
#   2) Allow an EXPLICIT paid rollover to DeepSeek V4 Flash only (never Pro/PRO_*)
#      when the caller opts in and cost gates allow (reservation + global USD cap).
#   3) Never fall back to any local generative model.
#   4) Never use DeepSeek as a silent substitute for a *local* lane failure
#      (local still uses fallback=False). This is free-OAuth bottleneck only.
cloud_unavailable:
  decision: DEFER
  never_fallback_to_local_heavy: true
  # Paid rollover is opt-in and gated — not a blanket paid fallback.
  free_oauth_bottleneck_rollover:
    enabled: true
    provider: deepseek
    lane: deepseek-flash
    model: deepseek-v4-flash
    policy: FAST
    # Credential slot (Bitwarden / .env): deepseek_tradeai
    credential_slot: deepseek_tradeai
    # Only when free-OAuth was requested and produced zero successful lanes.
    triggers:
      - free_oauth_unavailable
      - free_oauth_zero_ok_lanes
      - free_oauth_proxy_down
    never_pro: true
    never_pro_think: true
    never_pro_max: true
    # Fail closed if global / process caps reject the reservation.
    require_reservation: true
    require_global_usd_cap: true
