# Pullback + approaching-MACD-cross screener — all thresholds config-driven (no hardcoded values).
pullback_macd_screener:
  enabled: true
  universe: sp500

  # --- signal thresholds (approved: 12-28% pullback band) ---
  pullback_min_pct: 12.0
  pullback_max_pct: 28.0
  pullback_target_pct: 20.0
  lookback_high_days: 252        # 52-week high window
  min_bars: 205

  sma_fast: 50
  sma_slow: 200
  require_sma50_rising: true
  sma50_rising_lookback: 5

  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  hist_rising_bars: 2            # histogram must rise this many consecutive bars (the inflection)
  macd_proximity_pct: 0.6       # |MACD-signal| / price (%) — imminence-to-cross (score input)
  macd_require_proximity: false  # false = trigger at the inflection (earliest); true = wait for near-cross

  # VWAP entry-timing confirmation: a TRIGGER requires BOTH the MACD approaching-cross AND price
  # holding above intraday session VWAP. MACD-approaching names below VWAP drop to watch.
  vwap_trigger: true            # set false to ignore VWAP and trigger on MACD alone

  # --- optional confirmations ---
  rsi_confirm: false
  rsi_period: 14
  rsi_max: 50                    # only when rsi_confirm true: require RSI below this (room to run)

  # --- proposal sizing / risk (advisory) ---
  atr_period: 14
  # Authoritative technical levels (passes broker_trade_plan_gate — no generic R:R geometry):
  swing_low_lookback: 10        # stop = recent N-bar swing low (support)
  target_retrace_frac: 1.0      # target = entry + frac*(52w_high - entry); 1.0 = full retrace to high
  stop_atr_mult: 1.5            # fallback stop only when price sits on a fresh low
  proposal_notional_usd: 5000   # advisory size; operator re-sizes at approval

  # --- outputs (approved: all three; proposals for trigger + watch) ---
  emit_proposals: true
  # Hard cap on proposals created per scan — each PENDING proposal triggers per-proposal local+cloud
  # LLM oversight, so a market-wide selloff producing many triggers at once could overload the box.
  # Highest-score candidates win the slots; the rest still appear on the tab + feed the pipeline.
  max_proposals_per_scan: 5
  # Only the trigger tier creates approval-queue proposals — watch-tier names still appear on the
  # Command Center tab and feed the candidate pipeline, but don't clutter the queue with
  # lower-conviction (cross-not-yet) items. Set to [trigger, watch] to also queue watch names.
  proposal_tiers: [trigger]
  proposal_expiry_hours: 48
  default_strategy_id: pullback_macd_reversal
  telegram_alerts: true
  feed_candidate_pipeline: true
  # Intraday monitor (--monitor, scheduled hourly): keep standing pullback proposals in sync with the
  # live setup — refresh those that still fit the plan, expire those that don't (dropped off the
  # trigger, or price hit/broke the stop/target).
  reconcile_proposals: true
