# ALPACA-OPTIONS Stage 1 — options underlying universe (operator spec Part A).
#
# Tiered universe for the paper-only options strategy scanner
# (scripts/options_strategy_scanner.py). Dynamic tiers carry NO symbol list —
# they are resolved at runtime (holdings.json / watchlist DB / Hermes discovery
# GAP_CANDIDATE rows) by scripts/lib/options_pipeline/universe.py. Static tiers
# are explicit seed lists reviewed by the operator.
#
# Dedupe precedence (first tier wins): holdings > watchlist_buy_strong_buy >
# liquid_options_core > sector_etfs > discovery_missing_exposure >
# strategy_specific > operator_added.
#
# SAFETY: this file only widens what the PAPER scanner may look at. It grants
# no execution surface — live gating lives in config/options_strategy_registry.yaml
# (all live_enabled: false, fail-closed at load).
version: 1
updated: "2026-07-05"

defaults:
  max_underlyings_per_run: 15      # scanner cap when --limit not given
  max_proposals_per_run: 5         # scanner winners cap when --top not given
  default_conviction: 0.60         # baseline conviction for tier entries with no
                                   # richer signal (must clear the 0.55 strategy floor)

tier_precedence:
  - holdings
  - watchlist_buy_strong_buy
  - liquid_options_core
  - sector_etfs
  - discovery_missing_exposure
  - strategy_specific
  - operator_added

tiers:
  holdings:
    dynamic: true                  # resolved at runtime — never listed here
    resolver: holdings_json        # data/portfolios/state/holdings.json (equity, non-cash)
    enabled: true
    max_scan_frequency: daily
    reason_included: "current equity holding — overlay/replacement candidates (covered calls, protective puts, stock replacement)"
    liquidity_expectation: variable
    strategy_allowlist: [deep_itm_call, covered_call, cash_secured_put, protective_put, credit_spread]

  watchlist_buy_strong_buy:
    dynamic: true
    resolver: watchlist_verdicts   # watchlist_items + research card / CIO synthesis buy|strong_buy
    enabled: true
    max_scan_frequency: daily
    reason_included: "watchlist buy/strong_buy conviction name — entry-structure candidates"
    liquidity_expectation: variable
    strategy_allowlist: [deep_itm_call, cash_secured_put, credit_spread]

