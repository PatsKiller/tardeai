    resolver: hermes_gap_candidates  # open GAP_CANDIDATE rows, meta_json.gap_type in
                                     # (MISSING_SECTOR, MISSING_COMPANY) carrying a VALIDATED ticker
    enabled: true
    max_scan_frequency: daily
    reason_included: "Hermes white-space discovery — validated ticker on an open MISSING_SECTOR/MISSING_COMPANY gap"
    liquidity_expectation: unknown   # discovery names carry no liquidity guarantee — gates decide
    strategy_allowlist: [deep_itm_call, cash_secured_put]

  strategy_specific:
    dynamic: false
    enabled: true
    max_scan_frequency: daily
    symbols: []                    # empty scaffold — per-strategy additions land here after operator review
    # example entry (documentation only — `example` is ignored by the loader):
    example:
      symbol: TLT
      reason_included: "example — rate-sensitive underlying added specifically for credit_spread research"
      liquidity_expectation: high
      strategy_allowlist: [credit_spread]
      enabled: true
      max_scan_frequency: daily

  operator_added:
    dynamic: false
    enabled: true
    max_scan_frequency: daily
    symbols: []                    # operator ad-hoc additions — same per-symbol fields as liquid_options_core
