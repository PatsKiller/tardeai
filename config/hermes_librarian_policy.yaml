# Hermes Librarian v2 — retention policy (Phase 3)
# Single source of truth for retention windows across all Hermes tables.
# Never delete live rows — lifecycle: live → hidden/flagged → archived → purge

hermes_research_intelligence:
  staged_max_days: 90      # archive staged rows after 90d
  promoted_max_days: 365   # keep promoted research for 1yr
  archived_purge_days: 180 # purge archived rows after 6mo

hermes_score_history:
  max_days: 21             # already handled by hermes_score_history_retention.py

hermes_discovery_candidates:
  cold_archive_days: 90    # ARCHIVED_COLD after 90d idle

content_embeddings:
  orphan_purge_days: 30    # purge embeddings whose source row is gone

hermes_embedding_queue:
  failed_purge_days: 14    # purge failed queue entries after 14d

# Entity graph
graph:
  edge_window_days: 30     # co-occurrence window
  edge_min_weight: 2       # minimum co-occurrence count
  edge_stale_days: 90      # prune edges not sighted in 90d

# Content taxonomy
taxonomy:
  backfill_batch_size: 200 # rows per deep pass
  min_text_length: 20      # skip rows with less text
  fallback_share_target: 0.15  # ≤15% fallback (keyword heuristic) target
  # RETIRED 2026-08-12: content_subject axis superseded by strategy_tags
  # (scripts/hermes_tag_engine.py). See docs/TAXONOMY_AUTHORITATIVE_CONTRACT.md.
  status: retired

# Flat-file retention (generated/artifact dirs only — never narrative runbooks)
# Supersedes scripts/docs_retention.sh + scripts/docs_hygiene.py keep-newest-N logic.
# Each target is either keep_newest (keep N newest files by mtime) or
# max_age_days (remove files older than N days). Dry-run by default.
flatfiles:
  targets:
    - path: docs/hermes/librarian_loop_dryruns
      keep_newest: 10
    - path: docs/hermes/phase3b_dryrun
      keep_newest: 10
    - path: docs/hermes/backlog_health
      keep_newest: 5
    - path: docs/hermes/observations
      pattern: "latest_*_summary.json"
      max_age_days: 14
