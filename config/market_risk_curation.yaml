# Market Risk Engine — LLM curation of the "why" sentence (DSN-20261031-market-risk-engine §5.10, P3-T3).
# Operator 2026-10-31: "you can have normalization and alerts curated by LLM." The deterministic card is built first and
# is always sendable; the model may only rephrase its one "Why:" sentence. Every number the model writes must already be
# in the card or the assessment, no behaviour wording is allowed, and a failure, refusal or timeout sends the
# deterministic card unchanged. scripts/lib/market_risk/curation.py reads this file; nothing here is hardcoded there.
schema: MarketRiskCuration@v1
as_of: 2026-10-31
enabled: true
# Off on purpose, with a due date (operator 2026-10-31: "there needs to be a reminder to switch it back on. We just
# don't want to leave it off; we got to get it working correctly."). scripts/check_disabled_features.py pages P2 once a
# day after review_by; the projection, the Risk payload and Ask-the-CIO show "curation: OFF — pending review, due …".
# The PR that re-enables curation removes this block.
disabled_until:
  name: market-risk alert curation
  reason: "LLM rewording of the alert 'why' sentence is off for every tier (skip_tiers) after review #2383 round 2 (B3): free-text curation let advice paraphrases and invented numbers through"
  disabled_at: 2026-10-31
  review_by: 2026-11-07
  owner: coordinator
  reenable_plan: "allowlist template passes independent adversarial review; enable BLUE/YELLOW/GREEN first"
process_id: market_risk_alert_curation   # config/llm_process_registry.json row (free OAuth lanes only)
lane: grok                               # first lane; llm_fallback walks grok -> chatgpt
allow_paid: false                        # never a metered lane for alert prose
why_prefix: "Why: "
max_why_chars: 280
max_tokens: 200
timeout_s:                               # wall-clock budget per tier; on expiry the deterministic card is sent
  RED: 6
  ORANGE: 10
  YELLOW: 15
  BLUE: 15
  GREEN: 15
  default: 10
# Every tier is skipped until an independent review passes the allow-list template below (review of #2383, B3).
# Turning curation back on for YELLOW/BLUE/GREEN is the one-line change `skip_tiers: [ORANGE, RED]`.
skip_tiers: [RED, ORANGE, YELLOW, BLUE, GREEN, NONE]
# The allow-list template (review of #2383, B3): the curated "why" may contain ONLY these words, words from the
# contributors' displayed names and headlines, the category names, and the displayed figures. Anything else rejects
# the curation. Round 3 removed direction, size and timing words (percent, fell, rose, down, up, high, low, less,
# more, now, today, only, open, yet, still):
# grounding checks values, not meaning, so "Index fell 50 percent" reused the score. In template mode these words
# can only arrive inside an engine-written headline, never from the model.
# the curation and the deterministic card is sent. No verbs of action, no forecast verbs, no number words.
why_vocabulary: [a, an, the, and, or, but, with, from, on, in, by, as, at, to, of, for, over, under, than, versus,
  vs, against, while, both, also, plus, not, no, recent, recently, is, are, was, were, has, have, been, be, it,
  its, this, that, these, those, their, own, risk, risks, score, scores, point, points, category, categories,
  confirm, confirms, confirming, confirmed, signal, signals, reading, readings, level, levels, picture, driven,
  driver, drivers, led, mainly, mostly, largely, elevated, stressed, stress, stretched, warning, warn, calm, quiet,
  steady, mixed, unusual, unusually, heavy, heavier, light, lighter, broad, broader, narrow, narrowing, weak,
  weaker, weakness, weakening, strong, stronger, strength, surge, surging, surged, jump, jumped, easing, eased,
  fading, building, persistent, sharp, sharply, above, below, near, most, median, normal, typical, history, times,
  x, market, markets, index, indexes, sector, sectors, volatility, flow, flows, options, put/call, ratio, interest,
  volume, demand, hedging, breadth, credit, rates, yields, technical, technicals, momentum, trend, leadership,
  semiconductor, semiconductors, chips, earnings, event, events, concentration, seasonal, extended, hours,
  overnight, session, data, measured, unmeasured, unknown, macro, cross-asset, asset, correlation, correlations,
  so, because, after, hit, reached, all, each]
# The allow-list TEMPLATE (review of #2383 round 2, B3; operator 2026-10-31 "we got to get it working correctly").
# The model never writes prose. It returns ONLY a JSON choice of phrase ids from this bank (and which contributors,
# by their 1-based position on the card, fill {c1}/{c2}); the sentence is rendered here from the engine's own names
# and displayed figures. Free text, unknown ids, extra keys or out-of-range contributors reject the curation and the
# deterministic card is sent. Every rendered sentence still passes the character, behaviour, grounding and
# vocabulary checks below. Slots: {c1} {c2} contributor names; {c1_points} {c2_points} their points; {c1_detail} the
# displayed headline; {score}; {confirming} {of}; {unmeasured_clause} ("1 category is" / "N categories are unmeasured").
why_template:
  max_phrases: 3
  pair_min_share: 0.5                    # 'pair' needs its two contributors to hold at least this share of the points
  phrase_bank:
    lead: "{c1} carries the largest share of the score at {c1_points} points."
    pair: "{c1} and {c2} carry most of the score."
    second: "{c2} adds {c2_points} points."
    detail: "{c1_detail}."
    score: "The risk score reads {score}, led by {c1}."
    confirm: "{confirming} of {of} categories confirm."
    calm_rest: "The other measured categories read calm."
    unmeasured: "{unmeasured_clause}."
  requires:                              # phrase preconditions (review #2383 round 3)
    calm_rest: {tiers: [BLUE, GREEN, NONE], others_calm: true}
# Sentence-initial verbs of command; a rendered sentence opening with one is refused (review #2383 round 3).
imperative_openers: [lower, raise, reduce, cut, trim, sell, buy, add, hedge, hedging, exit, close, open, hold, keep,
  stay, go, get, take, move, avoid, consider, protect, wait, stand, sit, watch, prepare, rotate, switch, lock, book,
  tighten, trail, set, place, put, use, load, accumulate, unwind, halve, dump, unload, lighten, less, more]
behaviour_patterns:                      # case-insensitive regexes on NFKC-normalised prose; any match rejects the curation
  - '\b(buy|sell|short|cover|trim|reduce|add to|scale (in|out)|exit|liquidate|hedge with)\b'
  - '\b(lighten|unload|dump|offload|shed|shrink|pare|cut|rotate|de-?risk)\b'
  - '\btake (some )?profits?\b'
  - '\b(raise|go to|move to|build|hold more) cash\b'
  - '\bget out\b|\bstep aside\b|\bhold off\b|\bavoid new\b|\bnew (entries|positions?)\b'
  - '\b(puts|calls|protective put|collars?|hedges?|hedged)\b'
  - '\b\d[\d,.]*\s*(shares?|contracts?|lots?|sh)\b'
  - '\b(one|two|three|four|five|ten|twenty|fifty|a|one )?hundred\s+(shares?|sh)\b|\bhalf\b'
  - '\bstops?\s+(at|to|of|near|under|below|above|level)\b|\bstop[- ]level\b'
  - '\b(limit|market|stop)[- ]orders?\b'
  - '\b(position[- ]?siz\w*|allocat\w*|weight(ing)? (to|of)|slice of|% of (the|your) (book|portfolio))\b'
  - '\b(should|ought to|consider|recommend\w*|suggest\w*|you (may|might|could) want|it is (wise|prudent))\b'
  - '\b(lower|raise|increase|decrease|reduce|trim|cut)\s+(your\s+)?(exposure|position|holdings?|stake)\b|\bexposure should\b'
  - '[$€£¥]\s?\d|\d\s?(usd|eur|dollars?|bucks)\b'
