# Hermes scope governor — Phase 1 of docs/design/HERMES_MATURITY_5_DESIGN.md (2026-07-02).
# The governor is the SOLE owner of watchlist_items.scope_tier. All values here are the
# rails; the governor is autonomous inside them. Advisory-only — never touches status,
# orders, gates, or 2FA.

tiers:
  # S0 pinned: capital exposed or operator-pinned — always scored, never demoted by TTL.
  # Membership: holdings, open paper positions, live proposals, operator ticker directives.
  s0:
    scored: every_run
  # S1 active: earned a live trigger. Demoted to S2 after ttl_days without a fresh trigger.
  s1:
    cap: 400
    ttl_days: 14
    entry:
      composite_min: 70          # hermes_composite_score >= this
      catalyst_hours: 48         # catalyst_events row newer than this
      directive_hit_hours: 48    # watch_directive_hits newer than this
    scored: market_hours
  # S2 warm: structured pools (incubator / strategy watchpool / capped directive names).
  # Demoted to S3 after ttl_days without a trigger.
  s2:
    cap: 320
    ttl_days: 30
    incubator_seen_days: 7       # incubator_universe.last_seen_at recency to qualify
    watchpool_eval_days: 7       # strategy_watchpool.last_evaluated_at recency to qualify
    scored: premarket_daily
  # S3 archived: never scored on the clock; event lane reactivates instantly to S1.
  s3:
    scored: on_event_only

# Hard invariants
total_cap: 800                   # |S0|+|S1|+|S2| must stay <= this; S2 then S1 tails truncate
directive_top_n: 5               # per active directive, ranked by composite score
directive_global_cap: 200        # total directive-sourced names across S1/S2

# ai_discovered names get this long to earn a trigger before archiving (roach-motel TTL)
ai_discovered_grace_days: 14

# Reactivation (S3 -> S1) triggers honored by governor + event feeder
reactivation:
  catalyst_hours: 48

# Event feeder scan windows (minutes) — 2x the cron cadence so nothing is missed;
# the one-pending-event-per-symbol unique index dedups overlap.
event_feeder:
  scan_minutes: 20
  sources: [catalyst, news, finviz, directive_hit, proposal]

# Outcome-aware edge scoring (v2 governor). Outcome yield outranks throughput yield.
# Hot = S0+S1, Warm = S2, Cold = S3. Hermes consumes data/runtime/hermes_governed_universe.json.
scoring:
  outcome_lookback_days: 90
  max_outcome_promotions: 25          # per-run cap on outcome-only S1 promotions
  weights:
    portfolio_relevance: 25          # holdings, scalps, proposals, operator pins
    outcome_yield: 30                # graded ledger hit-rate + realized R (highest weight)
    social_conviction: 15            # intelligence_entities social_score + freshness
    technical_edge: 15               # hermes_composite + RVOL
    event_boost: 10                  # catalyst / directive / pending score events
    liquidity: 5                     # avg volume + ATR guardrails
  thresholds:
    hot_min_score: 65                # outcome-aware S1 promotion when no rule trigger
    warm_min_score: 40
  liquidity_filters:
    min_avg_volume: 200000
    max_atr_pct: 12.0
  outcome_gates:                     # graft-gate safeguards — do not overreact to one outcome
    min_graded_samples: 3
    promote_hit_rate: 0.50
    promote_min_avg_r: 0.25
    demote_miss_rate: 0.60
    pause_miss_rate: 0.75
    demote_score_penalty: 20
    promote_score_boost: 8

# Outcome-bus reaction rules — conservative, one-run overrides (reversible via enabled: false)
bus_reactions:
  enabled: true
  trend_window_days: 14
  efficiency_tighten_threshold: 0.50
  efficiency_consecutive_days: 3
  hot_min_score_bump: 10
  demotion_pressure_multiplier: 1.25
  stop_hot_advantage_pp: 0.12
  hot_research_priority_boost: 1.08
  tag_poor_outcomes_days: 7
  tag_multiplier_reduction: 0.85
  tag_multiplier_floor: 0.45
  scope_creep_promotion_cap_reduction: 5
  stop_quality_reactions:
    enabled: true
    divergence_delta_pp: 0.13              # Hot vs Cold trail delta below this triggers tighten
    divergence_consecutive_days: 4
    warm_cold_hot_min_bump: 5              # extra hot_min_score for warm/cold promotion path
    warm_cold_edge_penalty: 5.0            # light edge penalty on S2/S3 symbols
    divergence_hot_research_boost: 1.10    # research priority boost for Hot tier
    strong_advantage_pp: 0.20              # widen above this → relax hot promotion pressure
    strong_advantage_hot_min_relax: 5
    strong_advantage_hot_edge_boost: 5.0

# Optional LLM review for ambiguous tier changes (off by default — rules-first)
llm_ambiguous_review:
  enabled: false
  min_edge_spread: 8                 # only when score within this band of tier threshold
  lane: grok
