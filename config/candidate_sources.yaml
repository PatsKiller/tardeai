  # ── Finviz Tax Loss ──
  finviz_tax:
    source_type: finviz
    strategies: [tax_loss_harvest]
    screener_ids: []
    schedule: quarterly
    status: SHADOW
    notes: "Tax loss harvesting is operator-triggered, not screener-driven."

  # ── Non-Finviz: Earnings Calendar (REPAIRED 2026-07-20) ──
  earnings_calendar:
    source_type: earnings_calendar
    strategies: [earnings_pre_buildup, earnings_post_momentum]
    provider: symbol_profiles_yfinance
    schedule: daily_0635_weekdays_plus_on_demand
    status: ACTIVE
    human_review_only: true
    notes: >-
      REPAIRED 2026-07-20. History: the previous provider (FMP v3
      earning_calendar) returns HTTP 403 — "Legacy Endpoint ... only for legacy
      users with valid subscriptions prior August 31, 2025" — and the key is
      additionally quota-exhausted (429 on every FMP endpoint). The failure was
      SILENT (`if not resp.ok: return {}` plus a bare except), so every symbol
      looked like "no scheduled earnings" and the blackout gate FAILED OPEN for
      covered_call, cash_secured_put, credit_spread and long_call.
      Now: scripts/earnings_provider.py is the source of record. Primary =
      symbol_profiles.next_earnings_date, written daily 06:35 weekdays by
      scripts/earnings_enrich.py from yfinance (held stocks + Hermes top-N
      watchlist; 2079 profiles / 649 future-dated). Secondary = on-demand
      yfinance for symbols outside that coverage, so the desk can price names
      beyond the enriched set. Three-state contract: SCHEDULED /
      NONE_SCHEDULED / UNKNOWN — UNKNOWN fails CLOSED with refusal_code
      EARNINGS_TIMESTAMP_UNKNOWN and is never collapsed into "no earnings".
      A profile row older than EARNINGS_PROFILE_TRUST_DAYS (7) is UNKNOWN, not
      "none scheduled". Verified live: NOC blocked (earnings 2026-07-21),
      RTX blocked (2026-07-23), SCHD cleared (ETF, no issuer earnings).
      FMP_API_KEY is now unused by this path and may be retired.

  # ── Non-Finviz: Options Chain (LIVE — corrected 2026-07-20 Phase 0) ──
  options_chain:
    source_type: options_chain
    strategies: [covered_call_income]
    provider: schwab_readonly_chain
    schedule: market_hours
    status: ACTIVE
    human_review_only: true
    notes: >-
      CORRECTED 2026-07-20: was provider=NOT_CONFIGURED /
      BLOCKED_PROVIDER_MISSING, which had been stale since the Schwab chain went
      live. Verified by probe: options_lifecycle_engine.quote_leg() returned an
      exact-match SPY contract quote. Schwab is AUTHORITATIVE for contracts,
      strikes, expirations, bid/ask/mid, greeks, OI and contract volume at the
      execution decision timestamp. Finviz supplies NO options-chain data in
      this project and must never silently substitute for a failed Schwab chain.

  # ── Non-Finviz: Technical Pattern (internal) ──
  technical_pattern:
    source_type: technical_pattern
    strategies: [fib_retracement_bounce, swing_trade]
    provider: internal_ohlcv
    schedule: evening_and_premarket
    status: SHADOW
    human_review_only: true
    notes: "Uses OHLC cache + RSI/Fibonacci calculations. Already partially implemented via trade_backtest_engine.py technicals."
