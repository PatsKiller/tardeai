# Trade-AI 5-min scalp lane (scripts/run_trade_ai_scalp_live.py; lane trade-ai-scalp-live).
# Operator 2026-10-09: "these are scalps should be every 5 minutes at least". The cron/executor timeout is 295 s,
# so catalyst lookups stop after enrich_budget_s and the rest score on today's last cached lookup.
schema: TradeAIScalpLane@v1
enrich_budget_s: 150
# Catalysts are read in bulk (scripts/scalp_catalyst_bulk.py, 2026-10-09): one news_articles query through the data
# broker plus the Finviz Elite news export for finviz_batch_size tickers per request (measured 2026-10-09: 76 names,
# 8 requests, 17.7 s, 64 covered), replacing ~2 throttled Finviz page requests per ticker. Up to
# per_ticker_fallback_max uncovered names still get the old per-ticker lookup inside enrich_budget_s.
catalysts:
  bulk_enabled: true
  source_order: [data_broker_news, finviz_elite_news_bulk]
  fill_gaps_only: false
  db_news_max_age_hours: 72
  db_news_per_symbol: 6
  finviz_news_url: https://elite.finviz.com/news_export.ashx
  finviz_news_view: 3
  finviz_batch_size: 10
  finviz_per_symbol: 10
  finviz_timezone: America/New_York
  per_ticker_fallback_max: 8
