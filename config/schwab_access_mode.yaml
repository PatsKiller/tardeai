# Schwab access mode — the operator's pause switch for every Schwab READ caller and status surface.
# Read by scripts/lib/schwab_access_mode.py. Values:
#   normal     — Schwab reads proceed as usual (the default when this file is absent)
#   read_only  — reads proceed; surfaces show the mode (write paths are governed elsewhere, not by this file)
#   forbidden  — the Schwab developer app is deactivated: readers SKIP Schwab with one INFO line, report
#                "Schwab paused", and never treat cached data as live or a Schwab error as "all clear"
# Operator deactivated the Schwab developer app ~15:00 ET 2026-10-14 (SPCX incident); reactivated 2026-10-16,
# token probe live_ok and full read-only sync verified 18:02 ET. Operator: "go read_only" (2026-10-16).
# Order/stop paths stay blocked by the trading lock and the global kill switch; this file governs reads only.
mode: read_only
since: "2026-10-16T18:30:00-04:00"
reason: "Schwab app reactivated by operator 2026-10-16; reads only (trading lock + global kill switch still engaged)"
# Re-alert cadence while Schwab is unavailable (read by stop_health_check / account sync / health agent).
alerts:
  stop_data_unavailable_realert_hours: 4   # P1 "Schwab stop data unavailable" page, repeated at most this often
