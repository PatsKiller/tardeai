# OPS-HYGIENE-1: Operator Alert Policy
# Controls what reaches Telegram vs dashboard/digest/log
# No secrets, tokens, or chat IDs in this file.

telegram_mode: actionable_only

levels:
  P0_INTERRUPT:
    description: "Telegram immediately — operator action needed"
    examples:
      - proposal ready for approve/reject/rebuild
      - market-hours confirmed stop needing decision
      - execution failure
      - approval-ready GO candidate
      - urgent portfolio risk
      - SIEM P0/P1 with trading impact
      - health remediation ineffective
  P1_DIGEST:
    description: "Summarized digest — not repeated alerts"
    examples:
      - Aegis morning brief (max 1)
      - pre-open top setups
      - end-of-day closed trade lessons
      - watchpool maturity summary
      - morning command bundle (1× daily)
      - portfolio intelligence (1× open)
  P2_DASHBOARD_ONLY:
    description: "Dashboard/page only — never Telegram"
    examples:
      - WAIT/AVOID/RVOL-only
      - generic critique counts
      - Iris Library/content gaps
      - raw catalyst/source feed
      - repeated unchanged stop trigger
      - lifecycle/catalog status
      - Hermes rank-only shifts
      - Health Agent unchanged score
      - Trade AI LIVE per-ticker GO below scalp score floor (Critic DOWNGRADE/BLOCK still Telegram when scalp_send_on_critic_* true)
      - escalation investigation start
      - Incubator promoter stats
  P3_LOG_ONLY:
    description: "Logs/Drive/docs only"
    examples:
      - cron success
      - Drive sync success
      - DB wrapper success
      - debug confirmations

rules:
  suppress_wait: true
  suppress_avoid: true
  suppress_rvol_only: true
  # Telegram normalization containment defaults (2026-07-28): real-time scalp
  # candidates are Command Center/digest material until reviewed policy is deployed.
  scalp_realtime_enabled: false
  scalp_realtime_min_score: 45
  scalp_send_on_critic_downgrade: false
  scalp_send_on_critic_block: false
  scalp_score_jump_telegram: false
  suppress_raw_catalyst_dump: true
  suppress_generic_critique_summary: true
  suppress_iris_content_gap_telegram: true
  suppress_cron_success_telegram: true
  suppress_drive_sync_success_telegram: true
  suppress_hermes_telegram: true
  suppress_escalation_investigating: true
  suppress_incubator_promoter: true
  suppress_topic_curator: true
  stop_trigger_dedupe_minutes: 390
  go_signal_dedupe_minutes: 120
  max_trade_ai_live_alerts_per_hour: 10
  max_stop_alerts_per_symbol_per_day: 2
  require_trade_plan_for_go_telegram: true
  require_action_for_telegram: true
  suppress_health_repeat_minutes: 240
  max_health_telegram_per_day: 2
  health_telegram_min_delta: 5
  health_telegram_max_score: 80
  options_position_dedupe_minutes: 60
  portfolio_intelligence_dedupe_minutes: 360
  bundle_morning_window_minutes: 15
  hermes_telegram_min_score_delta: 15
  hermes_telegram_max_rank: 100

destinations:
  critical_operations: "CRITICAL_OPERATIONS"
  approvals_only: "APPROVALS_ONLY"
  proposals: "/v3/trading"
  trade_ai_scanner: "/v3/trading"
  risk: "/v3/risk"
  recovery: "/v3/risk"
  paper_governance: "/v3/trading"
  journal: "/v3/journal"
  system_health: "/v3/health"
  iris_library: "/v3/intelligence"
  watchpool: "/v3/watch"
  hermes: "/v3/watch"
  reports: "/v3/reports"
  options_positions: "/v3/trading?tab=Options"

telegram_normalization:
  policy_version: operator-alert-policy-v2-2026-07-28
  # OFF | SHADOW | ACTIVE  (default OFF; see scripts/alert_runtime_mode.py)
  #   OFF    pre-normalization behaviour; requires no new table
  #   SHADOW legacy delivery unchanged, normalized decisions persisted alongside
  #   ACTIVE normalized outbox owns routing and delivery
  # Override for one process with TELEGRAM_NORMALIZATION_MODE.
  # ACTIVE additionally requires the outbox migration to be applied.
  # Quoted deliberately: YAML 1.1 parses bare OFF/ON/YES/NO as booleans, so an
  # unquoted OFF arrives as False and never matches a mode name.
  runtime_mode: "OFF"
  # Deprecated boolean, still honoured: true escalates only as far as SHADOW.
  runtime_enabled: false
  canonical_reports_url: "https://ms01-openclaw.tail163d14.ts.net/v3/reports"
  logical_channels:
    CRITICAL_OPERATIONS:
      secret_ref: TRADEAI_GENERAL_ALERT_CHAT_ID
    APPROVALS_ONLY:
      secret_ref: TRADEAI_PROPOSAL_ALERT_CHAT_ID
      allowlist:
        - live_order_2fa_required
        - live_session_2fa_required
        - protective_order_approval_required
        - material_live_authorization_amendment_required
  digest:
    risk_time_et: "08:45"
    ops_trading_time_et: "17:55"
    send_only_if_nonempty: true
