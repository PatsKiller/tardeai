# Secret rotation registry (S6) — names only, no values.
# class: self_minted | vendor_manual | oauth_managed
# BWS_* excluded by design (Rule 1).

defaults:
  max_age_days: 90
  restart_targets: [portfolio_server]
  verify_probe: null

secrets:
  DB_PASSWORD:
    class: self_minted
    max_age_days: 90
    restart_targets: [portfolio_server]
    verify_probe: db_select_1
    notes: "ALTER ROLE trade_ai; then SM+render+restart"

  ALPACA_API_KEY:
    class: vendor_manual
    max_age_days: 90
    restart_targets: [portfolio_server, alpaca_stop_manager]
    verify_probe: alpaca_paper_account
    vendor_url: "https://app.alpaca.markets/paper/dashboard/overview"
    notes: "legacy paper pair — regenerate in Alpaca dashboard"

  ALPACA_SECRET_KEY:
    class: vendor_manual
    max_age_days: 90
    restart_targets: [portfolio_server, alpaca_stop_manager]
    verify_probe: alpaca_paper_account
    vendor_url: "https://app.alpaca.markets/paper/dashboard/overview"

  ALPACA_TAXABLE_API_KEY:
    class: vendor_manual
    max_age_days: 90
    restart_targets: [alpaca_live_read_sync]
    verify_probe: alpaca_taxable_account
    vendor_url: "https://app.alpaca.markets/brokerage/dashboard/overview"

  ALPACA_TAXABLE_SECRET_KEY:
    class: vendor_manual
    max_age_days: 90
    restart_targets: [alpaca_live_read_sync]
    verify_probe: alpaca_taxable_account
    vendor_url: "https://app.alpaca.markets/brokerage/dashboard/overview"

  ALPACA_IRA_API_KEY:
    class: vendor_manual
    max_age_days: 90
    verify_probe: alpaca_ira_account
    notes: "scaffold — may be empty"

  ALPACA_IRA_SECRET_KEY:
    class: vendor_manual
    max_age_days: 90
    verify_probe: alpaca_ira_account

  TELEGRAM_BOT_TOKEN:
    class: vendor_manual
    max_age_days: 180
    restart_targets: [portfolio_server, telegram_command_handler]
    verify_probe: telegram_getme
    vendor_url: "https://t.me/BotFather"
    notes: "Rotate LAST — silences all alerts if botched"

  OPENAI_API_KEY:
    class: vendor_manual
    max_age_days: 90
    verify_probe: openai_models
    vendor_url: "https://platform.openai.com/api-keys"

  ANTHROPIC_API_KEY:
    class: vendor_manual
    max_age_days: 90
    verify_probe: anthropic_models
    vendor_url: "https://console.anthropic.com/settings/keys"

  XAI_API_KEY:
    class: vendor_manual
    max_age_days: 90
    vendor_url: "https://console.x.ai"

  FINVIZ_API_TOKEN:
    class: vendor_manual
    max_age_days: 180
    verify_probe: finviz_ping

  FINVIZ_COOKIE:
    class: vendor_manual
    max_age_days: 30
    notes: "browser cookie — re-export from DevTools"

  SCHWAB_APP_KEY:
    class: oauth_managed
    max_age_days: 365
    notes: "OAuth app credentials — schwab_token_manager owns refresh"

  SCHWAB_APP_SECRET:
    class: oauth_managed
    max_age_days: 365

  SNAPTRADE_CONSUMER_KEY:
    class: vendor_manual
    max_age_days: 180

  SNAPTRADE_USER_SECRET:
    class: vendor_manual
    max_age_days: 180

  SMTP_PASSWORD:
    class: vendor_manual
    max_age_days: 180

  ADMIN_WRITE_TOKEN:
    class: self_minted
    max_age_days: 90
    restart_targets: [portfolio_server]
    verify_probe: null
