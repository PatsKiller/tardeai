# ──────────────────────────────────────────────────────────────────────────────
# Inference Layers — configuration
#
# Drives scripts/inference_layer_engine.py. No values are hardcoded in the engine;
# everything tunable lives here (per the repo "no hardcoded values" rule). The
# engine reads this file via PyYAML and falls back to baked defaults only if a key
# is missing, so partial edits are safe.
# ──────────────────────────────────────────────────────────────────────────────
inference_layers:
  enabled: true
  # Account the cycle reasons about for sizing/journal context (account_key).
  # "rollover" is the active trading account per current ops state.
  account: rollover

  layers:
    ingestion:
      enabled: true
      news_lookback_hours: 72      # window of news_articles to structure
      max_news: 160
      max_topics: 60
      max_closed_trades: 40
    features:
      enabled: true
    regional:
      enabled: true
      regions: [US, Asia, Europe, EmergingMarkets]
    higher_order:
      enabled: true
      journal_days: 180

  llm:
    caller: inference_engine
    timeout: 180
    # Route the WHOLE cycle's reasoning to a free OAuth lane (grok) instead of the
    # governed cloud. With use_external_lane=true every llm_json call whose salience clears
    # proactive.salience_threshold escalates; threshold is set to 0.0 below so that is
    # effectively all of them. A lane miss fails closed.
    use_external_lane: true
    external_lane: grok             # grok | chatgpt
    external_model: grok-3-mini

  regional:
    # Themes the engine actively hunts for in each region (Asia is the priority
    # per the operator's "Asia effects on US markets/ETFs/CEFs" mandate).
    asia_themes:
      - BOJ monetary policy
      - yen / carry trade
      - China stimulus / PBOC
      - semiconductors / TSMC / chip supply chain
      - export controls
      - Japan equities / Nikkei
    europe_themes:
      - ECB policy
      - energy prices
      - EU regulation
    em_themes:
      - India growth
      - commodity demand
      - EM currency stress
    # Income CEFs / ETFs to run NAV premium/discount + flow inference on. Each
    # unmeasured fund costs one grok NAV call per cycle, so this is the main lever on
    # call volume — trimmed (2026-06-21) to the held income positions (JEPI/SCHD/PFLT/
    # CSWC, the actionable ones) plus PTY (the canonical retirement-income CEF watch).
    # Add a ticker here to monitor its premium/discount even when not held.
    income_funds: [PTY, JEPI, SCHD, PFLT, CSWC]

  sizing:
    base_tilt: 1.0
    # Multiplicative tilt applied to the risk budget by detected regime.
    regime_tilts:
      risk_on: 1.15
      neutral: 1.00
      risk_off: 0.70
      high_vol: 0.60
    # Penalty when the proposal/inference carries FOMO / chase signals.
    fomo_penalty: 0.80
    # Reward only when the synthesized confidence clears this bar.
    min_confidence_for_uptilt: 0.60
    # Hard clamp so a runaway inference can never oversize.
    tilt_floor: 0.40
    tilt_ceiling: 1.50
    # Journal edge: scale tilt by historical expectancy of the setup/emotion.
    journal_edge_weight: 0.50

  proactive:
    # "Mind of its own": the engine fires its own Hermes queries when it detects
    # gaps or high-salience regional/journal signals. The budget below is SHARED
    # across the regional layer and the autonomy pass (a single per-cycle ceiling).
    gap_query_enabled: true
    max_queries_per_run: 3
    # Min salience an llm_json call needs to escalate to the external lane (when
    # llm.use_external_lane is true). 0.0 = escalate EVERYTHING → whole cycle on grok.
    # Raise it (e.g. 0.65) to reduce low-salience calls.
    salience_threshold: 0.0

  autonomy:
    # Generalized gap-detection → prioritize → act pass (inference_autonomy.py).
    # One structured LLM call surfaces gaps/opportunities the prior layers did not
    # cover (regional, journal, valuation, modeling, research, risk); the engine
    # then acts on the top items within the SHARED proactive budget above.
    enabled: true
    max_actions_per_run: 3
    min_priority: 6              # 1-10; only act on items at/above this priority
    # Lane for the gap-detection LLM call. Set to a free OAuth lane (grok|chatgpt)
    # so detection uses a governed provider. Local is forbidden and provider failures fail closed.
    detection_lane: grok
    # Lane for the ACTIONS the autonomy pass takes (Hermes follow-up queries + NAV
    # premium/discount reads). grok keeps the whole pass off the contended local GPU.
    action_lane: grok

  telegram:
    enabled: true
    min_severity: high              # only push high/critical inferences (was medium)
    max_items: 6
    dashboard_url: "http://localhost:7777/v3/intelligence"

  output:
    persist: true
    # Index high-value inferences into RAG so future agent prompts can retrieve them.
    rag_index: true

  # Multi-LLM ensemble validator (scripts/inference_ensemble.py) — FREE lanes only.
  # Used as an opt-in second opinion for curation grading + inference quality checks. No metered keys.
  ensemble:
    lanes: [grok, chatgpt]
    consensus_threshold: 0.66        # fraction of approve votes that grants consensus
    min_score: 6.0                   # avg score (0-10) that also grants consensus
    timeout: 60
    # Curator EOD --ensemble rescue cap: max borderline low_quality items re-rated per run
    # (each costs ~3 sequential lane calls, so this bounds the daily run time).
    rescue_max: 20
    # Layer-4 loop validation: synchronous ensemble during the cycle. DISABLED
    # (2026-06-21) — standardized on the queued auto_enqueue path below, which runs the
    # same ensemble OFF the cycle (bounded, lower latency, feeds the UI cards directly).
    # Flip back to true only if you want inferences gated by ensemble BEFORE surfacing.
    validate_in_loop: false
    validate_layers: [higher_order, regional]
    validate_max: 4
    # Auto-enqueue: at the end of each cycle the engine queues ensemble validation
    # jobs for the highest-severity inferences (the worker runs them off-cycle). Bounded
    # by auto_enqueue_max so lane volume stays predictable (~3 lane calls per job).
    auto_enqueue: true
    auto_enqueue_severities: [high, critical]
    # 0 = enqueue ALL high-severity inferences this cycle (no cap). Set a positive
    # number to bound it (each job ≈ 3 lane calls; the worker drains ~5 per tick).
    auto_enqueue_max: 0
