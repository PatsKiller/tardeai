# CIO LLM policy — Phase P2b (brain depth)
# Authority: READ_ONLY_ADVISORY. Fail-closed. Conservative defaults.

enabled: true
shadow: true

# Material wakes that MAY spend LLM budget (still under global/process caps)
material_sources:
  - situation.raised
  - OPERATOR_MESSAGE
  - GOAL_DUE_HIGH          # optional; only HIGH priority goals
  - S0_OPERATOR_CONVERSE
  - S1_POSITION_LIFECYCLE
  - S2_STOP_GAP
  - S3_REENTRY_CANDIDATE
  - S4_SECTOR_ROTATION
  - S5_CASH_DEPLOYMENT
  - S6_CONCENTRATION_OR_DISPOSITION
  - S7_WATCH_PROMOTION
  - S8_DEFENSIVE_REGIME

non_material_sources:
  - system.heartbeat_ok
  - pure_heartbeat_no_change
  - cio_slash_status

situation_notify_telegram: true    # master; also requires CIO_SITUATION_NOTIFY=1 (alias CIO_SITUATIONS_NOTIFY=1 OR'd)
# When notify is on, only these situation types go to @tradeai_cio_bot
#
# 2026-08-29, operator: "Telegram on" — channel @tradeai_cio_bot, bar S6 FIRE
# ONLY. Narrowed from the Phase B canary set (S1/S2/S5/S8 also listed) to the
# single type the operator asked to hear about. The others are NOT deleted
# history: re-add a line to widen the bar, and say so explicitly, because
# widening this list is what turns a 4-message desk into a 400-message one.
#
# Phase B material canary preferred S1/S5/S6/S8 (+ calendar_catalyst_material
# on S1); S2 optional. Restore that set only on an explicit operator sentence.
notify_situation_types:
  - S6_CONCENTRATION_OR_DISPOSITION
# Re-notify guards (re-enrich must NOT re-push Telegram by default)
notify_once_per_fingerprint: true  # same plan_id+evidence/fire → one notify; ledger: data/cio/cio_plan_notify_ledger.json
notify_cooldown_hours: 12          # legacy rows without fingerprint
notify_min_gap_minutes: 5          # min gap even when fingerprint changes
# Override: CIO_SITUATION_NOTIFY_FORCE=1 or maybe_notify_plan(..., force=True)
# Canary flags: docs/ops/CIO_MATERIAL_NOTIFY_CANARY_2026-08-20.md (financial lane remains OFF_BY_POLICY)

llm:
  enabled: true                    # CIO_LLM_ENRICH=0 to disable
  max_llm_per_wake: 1
  enrich_dedup_hours: 6
  prefer_flash: true
  pro_for:
    - OPERATOR_MESSAGE
    - S0_OPERATOR_CONVERSE
    - S8_DEFENSIVE_REGIME
  bridge_endpoint: "http://127.0.0.1:8766/v1/chat/completions"
  # Flash via advisory_desk (FAST) — avoids alex PRO-think empty content
  caller_flash: "advisory_desk"
  task_type_flash: "advisory_opinion"
  caller_pro: "alex"
  task_type_pro: "cio_synthesis"
  max_tokens: 1600
  max_tokens_flash: 1600   # material multi-domain JSON needs headroom
  max_tokens_pro: 2000
  temperature: 0.2
  # Local soft cap (in addition to bridge global daily cap)
  max_calls_per_hour: 12
  log_path: "data/cio/cio_llm_enrich_log.jsonl"

validator:
  reject_invented_numbers: true
  max_retries: 1
