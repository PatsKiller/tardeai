# CIO Situation Catalog v1 — Phase 2a
# Authority: READ_ONLY_ADVISORY. Detector SHADOW by default.
# Env overrides: CIO_SITUATIONS_ENABLED, CIO_SITUATIONS_NOTIFY|CIO_SITUATION_NOTIFY, CIO_SITUATIONS_SHADOW
# Notify env names are OR'd (singular/plural footgun); default notify=false when unset.

enabled: true
shadow: true
# Notify uses dedicated CIO bot (@tradeai_cio_bot) when CIO_SITUATION_NOTIFY=1
# (alias CIO_SITUATIONS_NOTIFY=1 also accepted; also requires situation_notify_telegram or env).
# Default off in yaml; enable via env for canary. See docs/ops/CIO_MATERIAL_NOTIFY_CANARY_2026-08-20.md
notify: false
dedup_hours: 12                  # longer cooldown so channel does not re-spam
detector_version: "situation-catalog-v1.0.0"
# Cap plans created per detector pass (noise control on multi-account books)
max_plans_per_pass: 5
# Max Telegram notifies per detector pass (separate from plan create cap)
max_notify_per_pass: 3

thresholds:
  basis_drawdown_pct: 25.0       # S1 deep drawdown from basis (fires S1)
  partial_recovery_pct: 15.0     # S1: recovery from trough toward basis (of drawdown span)
  reclaim_eps_pct: 1.0           # reclaim alone does NOT fire (needs DD/catalyst)
  cash_pct_band_min: 20.0        # S5: cash share of portfolio (was 15; host ~45%)
  concentration_weight_pct: 12.0 # S6: single-name portfolio weight (not account-scoped)
  disposition_loss_pct: 20.0     # S6 Rule-1 class loss
  disposition_hold_months: 6.0   # S6 long-held
  sector_weight_delta_pp: 2.0    # S4 material rotation vs holdings (placeholder)
  reentry_statuses: ["READY", "NEAR"]
  watch_statuses: ["READY", "GO", "NEAR"]
  watch_near_min_score: 70       # strong NEAR if score present
  regime_risk_off_labels: ["RISK_OFF", "DEFENSIVE", "risk_off", "defensive"]

owners:
  S1_POSITION_LIFECYCLE: alex
  S2_STOP_GAP: alex
  S3_REENTRY_CANDIDATE: alex
  S4_SECTOR_ROTATION: steph
  S5_CASH_DEPLOYMENT: steph
  S6_CONCENTRATION_OR_DISPOSITION: morgan
  S7_WATCH_PROMOTION: alex
  S8_DEFENSIVE_REGIME: alex

cc_deep_links:
  S1_POSITION_LIFECYCLE: ["/v3/portfolio", "/v3/risk"]
  S2_STOP_GAP: ["/v3/risk", "/v3/portfolio"]
  S3_REENTRY_CANDIDATE: ["/v3/portfolio/re-entry", "/v3/watch"]
  S4_SECTOR_ROTATION: ["/v3/rotation", "/v3/portfolio"]
  S5_CASH_DEPLOYMENT: ["/v3/portfolio", "/v3/watch"]
  S6_CONCENTRATION_OR_DISPOSITION: ["/v3/portfolio", "/v3/advisory"]
  S7_WATCH_PROMOTION: ["/v3/watch"]
  S8_DEFENSIVE_REGIME: ["/v3/defense", "/v3/risk"]

revisit_hours:
  default: 24
  S2_STOP_GAP: 12
  S8_DEFENSIVE_REGIME: 12
