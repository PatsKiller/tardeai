# Communications hub — categories, scores, re-entry status, actionability and TTL (scripts/lib/comms/classify.py).
# Operator 2026-10-07: Communications is a DECISION-SUPPORT system — every item has a category, a priority, five
# scores (priority, confidence, risk, reward, time sensitivity), a TTL with an expiry timestamp, a status and an
# actionability flag; re-entry signals carry a re-entry status. Stale items leave every view, then are ARCHIVED
# (jsonl.gz) and removed (scripts/comms_lifecycle.py). Decisions (2026-10-07): approvals, protection incidents and
# broker facts follow the same TTLs; removal is archive-then-delete (AGENTS.md §0 rule 6).
#
# Extend: add a category under `categories` and point rules at it — no code change. Rules run top to bottom; the
# first whose `match` (case-insensitive regex) hits the message's first line — or whose `body` regex hits anywhere —
# wins. Scores are 0..1. priority_score = 100 × (0.35·time + 0.25·max(risk, reward) + 0.20·confidence + 0.20·tier)
# where tier comes from `priority`. A newer message with the same symbol AND category supersedes older active ones
# ("reaffirmed by new data"): the older ones are hidden as `superseded`.

version: 2

priorities: [critical, high, medium, low]

categories:
  re_entry:                    {label: "Re-Entry", ttl_hours: 96}
  risk:                        {label: "Risk", ttl_hours: 96}
  reward:                      {label: "Reward", ttl_hours: 96}
  high_conviction_opportunity: {label: "High Conviction Opportunity", ttl_hours: 96}
  watchlist_candidate:         {label: "Watchlist Candidate", ttl_hours: 168}
  threat:                      {label: "Threat", ttl_hours: 96}
  market_event:                {label: "Market Event", ttl_hours: 96}
  news:                        {label: "News", ttl_hours: 96}
  security_alert:              {label: "Security Alert", ttl_hours: 96}
  system_alert:                {label: "System Alert", ttl_hours: 72}
  operational_issue:           {label: "Operational Issue", ttl_hours: 72}
  operator_conversation:       {label: "Operator Conversation", ttl_hours: 168}

# Re-entry status vocabulary (first match wins, evaluated on the whole body of re_entry items).
reentry_status:
  - {status: invalidated, match: "invalidated|removed from re-?entry|downgraded|re-?entry .*→ ?wait|through stop|avoid\\b|\\bstand down"}
  - {status: confirmed,   match: "buy[_ ]ready|inside entry zone|wait → reenter|upgraded|re_enter\\b(?!_if)|\\breenter\\b"}
  - {status: potential,   match: "re_enter_if|near[- ]entry|entry_near|\\bnear\\b|wait_monitor|re-entry candidate"}
  - {status: opportunity, match: ".*"}

default: {category: system_alert, priority: low, confidence: 0.5, risk: 0.1, reward: 0.0, time: 0.2, actionable: false}

inbound: {category: operator_conversation, priority: medium, confidence: 1.0, risk: 0.0, reward: 0.0, time: 0.5,
          actionable: false}

rules:
  # ── Security alerts: approvals, grants, credentials ──
  - {id: approval_request, match: "approval requested|✅ granted|/approve |/deny ", category: security_alert,
     priority: high, confidence: 1.0, risk: 0.4, reward: 0.0, time: 0.9, actionable: true, action: "Approve or deny in Telegram",
     supersede_by_topic: false}
  - {id: credential, match: "credential|secret|token (revoked|expired)|reauth|2fa|api credits depleted", category: security_alert,
     priority: high, confidence: 0.9, risk: 0.6, reward: 0.0, time: 0.8, actionable: true, action: "Check credentials"}

  # ── Threats: what can hurt a held position now ──
  - {id: stop_health, match: "stop[ _]health|stop_triggered|orphaned|stop crossed|stop triggered|protective-stop|unprotected|stop placement reminder",
     category: threat, priority: critical, confidence: 0.9, risk: 1.0, reward: 0.0, time: 1.0, actionable: true, action: "Check stops"}
  - {id: plan_invalidated, match: "plan invalidated|through stop|what kills the idea", category: threat, priority: high,
     confidence: 0.8, risk: 0.8, reward: 0.0, time: 0.8, actionable: true, action: "Re-plan or drop"}

  # ── Re-entry (before reward rules: CIO re-entry alerts also mention entry zones) ──
  - {id: reentry, match: "re-?entry|re_enter|reenter|recovery watch|reentry", category: re_entry, priority: medium,
     confidence: 0.6, risk: 0.3, reward: 0.6, time: 0.6, actionable: true, action: "Review re-entry"}

  # ── Risk: exposure changes and moves on held names ──
  - {id: atp_review, match: "atp review alert", category: risk, priority: high, confidence: 0.7, risk: 0.7, reward: 0.2,
     time: 0.8, actionable: true, action: "Review the position"}
  - {id: holdings_change, match: "^\\[holdings-change\\]", category: risk, priority: medium, confidence: 0.9, risk: 0.5,
     reward: 0.0, time: 0.5, actionable: false}
  - {id: trade_cancelled, match: "trade cancelled|revalidation required", category: risk, priority: low, confidence: 0.8,
     risk: 0.3, reward: 0.0, time: 0.3, actionable: false}

  # ── High conviction: CIO buy-ready setups inside the zone ──
  - {id: high_conviction, match: "cio entry alert", body: "buy[_ ]ready|inside entry zone", category: high_conviction_opportunity,
     priority: high, confidence: 0.7, risk: 0.4, reward: 0.8, time: 0.8, actionable: true, action: "Review entry"}

  # ── Reward: entries, scalps, options plays ──
  - {id: scalp_alert, match: "active trader · scalp alert|momentum scalp setup", category: reward, priority: high,
     confidence: 0.5, risk: 0.6, reward: 0.6, time: 1.0, actionable: true, action: "Watch the trigger"}
  - {id: cio_entry, match: "cio entry alert|^entry state |watch — cio stance", category: reward, priority: medium,
     confidence: 0.5, risk: 0.4, reward: 0.6, time: 0.6, actionable: true, action: "Review entry"}
  - {id: options_intent, match: "options intent", category: reward, priority: medium, confidence: 0.6, risk: 0.3,
     reward: 0.5, time: 0.4, actionable: true, action: "Review options plan"}

  # ── Watchlist candidates: setups, watch pools, correlations, siblings ──
  - {id: watchlist, match: "pullback/macd triggers|watchpool:|watch alerts|sibling|correlation|watch promotion|recommendations? · .*need your decision|^cio: \\d+ new recommendation",
     category: watchlist_candidate, priority: low, confidence: 0.5, risk: 0.2, reward: 0.4, time: 0.3, actionable: false}

  # ── Market events ──
  - {id: market_event, match: "pre-market catalyst|pre-open brief|small-cap rotation|sector momentum|industry momentum|crossed \\d+-day ma|regime|earnings|8-k",
     category: market_event, priority: low, confidence: 0.6, risk: 0.3, reward: 0.3, time: 0.5, actionable: false}

  # ── News and research ──
  - {id: news, match: "hermes watchlist alerts|material change|inference cycle|trade ai critique|research|thesis|catalyst|cio brief|analyst divergence|multi-consensus|cio decision|cio advisory action|cio run complete|follow-up opr_",
     category: news, priority: low, confidence: 0.5, risk: 0.2, reward: 0.2, time: 0.3, actionable: false}

  # ── Operational issues: something is broken ──
  - {id: data_integrity, match: "^\\[data_integrity\\]", category: operational_issue, priority: high, confidence: 0.8,
     risk: 0.5, reward: 0.0, time: 0.5, actionable: true, action: "Check data quality"}
  - {id: siem_watchdog, match: "siem p[01]|watchdog down|pipeline_failure|lock_timeout|reaped hung|holdings write blocked",
     category: operational_issue, priority: high, confidence: 0.8, risk: 0.4, reward: 0.0, time: 0.6, actionable: true,
     action: "Check the failing job"}
  - {id: system_health, match: "integrity sweep|signal flow warning|coverage gaps|system health|pipeline health|pipeline freshness|auto-retry paused|health agent|health inspector|alert fatigue|\\[platform_availability\\]|services off|research lane raw|disk .*used",
     category: operational_issue, priority: medium, confidence: 0.7, risk: 0.3, reward: 0.0, time: 0.4, actionable: false}

  # ── System alerts: routine reports and digests ──
  - {id: digests, match: "p\\d digest|alert digest|daily ai & search spend|journal reminder|positions proof|executive brief|trade ai live|trade ai v\\d|backlog drain|morning brief|daily digest",
     category: system_alert, priority: low, confidence: 0.9, risk: 0.0, reward: 0.0, time: 0.1, actionable: false}

# Severity raises a rule's priority floor (never lowers it).
severity_floor: {critical: critical, urgent: high, warning: medium}

# Body signals that refine the rule's scores (all optional).
signals:
  confidence: "(?:confidence|conf)[ :=]+(0?\\.\\d+|1\\.0+|\\d{1,3}%)"
  reward_rr: "r:r(?: current)?[ :]+(\\d+(?:\\.\\d+)?)"

# Lifecycle (scripts/comms_lifecycle.py, hourly). Expired items stay viewable under the "expired" filters for
# `purge_grace_hours`, then are archived (jsonl.gz) and removed.
lifecycle:
  purge_grace_hours: 24
