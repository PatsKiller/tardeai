# Momentum Scalp Signal Engine (momentum_scalp_intraday) — engine config.
# NEW key. Does NOT modify momentum_scalp.yaml or any existing strategy/threshold.
# M3-S1 uses only the [data] + [volume_profile] + [universe] sections.
# See docs/strategies/MOMENTUM_SCALP_SIGNAL_ENGINE_v1.md.

strategy_key: momentum_scalp_intraday

# Feature flag — engine OFF by default (shadow build only; no runner wired yet at M3-S1).
enabled: false

data:
  # Alpaca minute-bar feed. IEX is the M3-S1 default because RVOL_tod needs the SAME feed for BOTH
  # the profile (historical) AND the live numerator (real-time): this subscription permits SIP only
  # DELAYED (recent SIP → HTTP 403 "subscription does not permit querying recent SIP data"), so
  # real-time SIP is unavailable and a SIP profile would be biased against an IEX live numerator.
  # IEX is available both historical and real-time → self-consistent ratio (venue-share cancels).
  # SIP (delayed) is reserved for later T1 delayed-microstructure work, not RVOL_tod.
  feed: iex
  bars_endpoint: "https://data.alpaca.markets/v2/stocks/{symbol}/bars"
  timeframe: "1Min"
  adjustment: raw

session:
  tz: "America/New_York"
  regular_open: "09:30"
  regular_close: "16:00"     # last regular minute index = 389 (09:30..15:59)
  regular_minutes: 390
  # ── Multi-setup taxonomy session model (additive; arch-owner 2026-07-27). Existing consumers read
  #    only regular_open/regular_close/regular_minutes and are unaffected. See scripts/scalp_session.py. ──
  context_collection_start: "06:00"   # collect + calculate context; NO alert/fire unless active_fire_start=06:00
  active_fire_start: "07:00"          # default: active setup detection + alerts begin here
  active_fire_start_min: "06:00"      # earliest the operator may configure active_fire_start (no code change)
  no_new_fire_after: "12:00"          # no NEW setup FIRED state after noon (existing positions managed/journaled)

volume_profile:
  lookback_sessions: 20       # trailing sessions in the median
  min_sessions: 15            # skip a symbol with fewer complete sessions than this
  backfill_days: 40           # calendar days to pull to obtain >=20 complete sessions
  # Session completeness is SPAN-based, not print-density based: micro-float scalp names trade
  # sparsely (~50-180 prints/session on IEX, not 390) but still yield a valid cumulative profile
  # (no-trade minutes add 0, cumulative carries forward). A session counts if it printed near the
  # close (spans the day) and has at least a floor of prints (excludes near-dead sessions).
  require_close_minute: 375   # must have a print at/after minute 375 (15:45 ET) → covered the close
  min_session_prints: 30      # exclude near-dead sessions (fewer than this many traded minutes)
  session_window: regular     # premarket profile deferred (doc §14 Q5)
  max_profile_age_sessions: 3 # G2.2 freshness contract: refuse a denominator built more than this
                              # many TRADING sessions ago (a stale denominator poisons RVOL_tod
                              # silently). Consumed by get_profile_denominator().

universe:
  # M3-S1 default universe = existing scalp screener output, float-capped for the new key.
  source_table: scalp_scan_results
  symbol_column: symbol
  time_column: scanned_at
  float_column: float_mm
  float_mm_max: 30            # operator decision 2026-07-27 for momentum_scalp_intraday
  lookback_days: 21           # distinct symbols seen in this window

# ── M3-S3 IGN scorer (design §3.2/§3.3). Weights are v1 PRIORS, refit once on shadow data
#    at M3-S8 (§12) — do NOT hand-tune mid-shadow. All sub-scores normalize to [0,1]. ──
ignition:
  weights:                    # must sum to 1.0
    v_rvol: 0.28
    v_burst: 0.22
    v_cat: 0.18
    v_disp: 0.14
    v_liq: 0.10
    v_rs: 0.08
  subscores:
    v_rvol:
      ref_rvol: 2.0           # RVOL_tod=2× → 0 ; 20× → 1  (log10(rvol/ref))
      log_base: 10
    v_burst:
      z_divisor: 6.0          # clamp(z_vol/6, 0, 1)
      sigma_floor_frac: 0.10  # σ_eff = max(σ_20bar, sigma_floor_frac·μ_20bar, eps) — the σ floor guard
      sigma_eps: 1.0          # absolute floor (shares) so a dead 20-bar window can't blow up z
      mu_window: 20
    v_cat:
      decay_min: 90.0         # v_cat = tier_weight · exp(-age_min/decay_min)
      # tier weights by catalyst_source [VERIFY: mirrors the existing source-quality table].
      # Graceful default for unknown sources = default_weight. 0 when no catalyst.
      tier_weights:
        sec: 1.00
        "8-k": 1.00
        pr: 0.80
        rag: 0.70
        news: 0.65
        finviz: 0.55
        social: 0.30
        unknown_social: 0.20
      default_weight: 0.40
    v_disp:
      atr_mult: 2.0           # (P - VWAP) / (atr_mult · ATR_1m · sqrt(n_bars))
    v_liq:
      dollar_ref_low: 50000   # $·vol_5m = 50K → 0
      log_divisor: 1.7        # /1.7 so $2.5M → ~1
  rvol_tod:
    # universe-proxy fallback (§3.1) for symbols with no per-symbol profile (new/thin listings).
    min_profile_sessions: 15  # below this → use proxy
    proxy_source: universe    # 'universe' U-curve × ADV_20d × ExpectedFraction(t)

# ── M3-S5 entry-trigger state machine (design §4/§6). Pure over a bar series; still SHADOW. ──
trigger:
  atr_period: 14
  impulse_atr_mult: 2.0        # §6.1 impulse leg = advance >= 2*ATR_1m from leg origin
  min_lower_highs: 2           # §6.2 pullback structure
  retrace_min: 0.236           # §6.3 valid retrace band (of the leg)
  retrace_max: 0.618
  retrace_void: 0.786          # retrace beyond this → leg VOID, reset state
  vdu_ratio: 0.60              # §6.4 volume dry-up: mean(vol_pullback) <= 0.60*mean(vol_impulse)
  trigger_vol_mult: 1.5        # §6.6 trigger bar vol >= 1.5*mean(vol_pullback)
  trigger_close_top_frac: 0.667 # §6.6 close in top 1/3 of the trigger bar's range
  evr_bottom_quartile: 0.25    # §6.7 absorption absent: EvR not in bottom quartile of last 3 impulse bars
  entry_offset: 0.02           # §6 entry = trigger_bar_high + 0.02
  stop_offset: 0.02            # stop = min(trigger_low, pullback_low) - 0.02 ...
  noise_stop_atr_mult: 1.0     # ... floored at entry - 1.0*ATR_1m
  max_stop_pct: 0.08           # reject: stop_distance > 8% of entry (LOGGED both, per operator 07-27)
  max_stop_pct_alt: 0.15       # live momentum_scalp value — logged alongside for the "decide on data" pass
  min_rr: 2.0                  # reject: leg_height/R < 2 (measured-move feasibility). §7 exit
                               #   target_1 = entry+2R is separate. INTERPRETATION — see engine + report.
  no_chase_mult: 1.02          # reject: entry > leg_high * 1.02
  post_halt_rewarm_bars: 30    # §6.6 post-halt 30-bar re-warm before re-entering IMPULSE
  macd_5m: {fast: 12, slow: 26, signal: 9}   # §6.1 computed on 5m bars, LOGGED, never gating

# ── Notification tiers (design §3.4). M3-S7 ENABLED: alerts only, still NO proposals. ──
notifications:
  info_min: 45                # IGN>=45 → INFO (dashboard only, no Telegram)
  alert_min: 60               # IGN>=60 → ALERT (Telegram, tagged UNGATED — NOT A PROPOSAL)
  accel_delta: 15             # ΔIGN>=15 in window → IGN_ACCEL → ALERT
  accel_window_min: 10
  proposal_min: 75            # IGN>=75 → still an ALERT in M3-S7 (proposals are M3-S9)
  emit: true                  # M3-S7: Telegram tiers ON. alert_dispatcher dedupes once/day/symbol +
                              # rate-limits 15/hr + fatigue-downgrades. Instantly reversible (set false).
  session_cap: 8              # hard cap of ALERT-tier Telegram alerts per logger run (§3.4)

# ── Data Confidence Factor (design §4.4). M3-S3 runs at T0. ──
# TIER NUMBERING = design-doc convention (operator ruling 2026-07-27): T2 = full book (moomoo, best
# data), T1 = SIP/quotes, T0 = bars-only (weakest, what ships today). This is the OPPOSITE numbering
# to some external "ascending capability" ladders — do not renumber; the invariant below is what
# actually matters, not the label direction. `quality_order` lists tiers best→worst so the
# monotonicity invariant (G4.3) is checked against data quality, not label sort order.
data_tiers:
  active_tier: T0
  quality_order: [T2, T1, T0]   # best data (book) → worst data (bars)
  dcf:                          # size multiplier — MUST be non-increasing along quality_order
    T2: 1.00
    T1: 0.70
    T0: 0.40
  assumed_slippage_bps:         # assumed slippage — MUST be non-decreasing along quality_order
    T2: 8
    T1: 20
    T0: 40
  stale_max_sec: 120            # data older than this → NO TRADE (dcf 0)

# ── M3-S5.5 multi-source observation fabric. DEFAULT OFF: with enabled=false the existing
#    single-source T0 path (Alpaca IEX bars) is used unchanged and fully reproducible. ──
multi_source:
  enabled: false               # HARD default OFF — no behavior change until an operator flips it
  concurrency:
    global_max: 8              # global concurrent provider requests (never one-thread-per-symbol)
    per_provider_max:          # per-provider caps (moomoo = single gateway owner)
      alpaca: 4
      yahoo: 2
      schwab: 2
      moomoo: 1
    task_timeout_s: 10.0
    max_retries: 2             # bounded; NEVER retried on auth/entitlement rejection
    breaker_threshold: 3       # consecutive failures → open per-provider circuit breaker
  # Source-authority policy is versioned in code (arbitration.AuthorityPolicy, source-authority-v1).
  # Summary: T0 bars = Alpaca IEX (yahoo = degraded fallback only); T1 trades/NBBO = consolidated
  # only (Alpaca IEX is venue-partial → T1_venue, NOT consolidated SIP; SIP realtime = 403); T2 book
  # = moomoo gateway only when entitlement+freshness+sequence pass (currently SCAFFOLD_ONLY); broker
  # facts = each broker authoritative only for its own resources. No averaging; conflict → SOURCE_CONFLICT.

# ── M3-S6 Tier-1 microstructure (Lee-Ready TFI, effective spread, Kyle λ, VPIN). GATED + DEFAULT OFF.
#    HARD RULE: T1 metrics require real-time CONSOLIDATED (SIP) data. IEX-only/delayed/unentitled are
#    FORBIDDEN (M3-S5.5: IEX = ~2-3% venue, weaker than the T0 BarPressure fallback). scalp_t1_gate
#    refuses computation unless enabled AND entitlement == SIP_REALTIME. No feed procured yet → dormant. ──
t1:
  enabled: false               # HARD OFF — cannot run until a consolidated feed is procured + re-probed
  required_entitlement: SIP_REALTIME
  consolidated_provider: polygon   # candidate T1 source once upgraded (or alpaca SIP via Algo Trader Plus)
  vpin_bucket_volume: 0        # shares per equal-volume VPIN bucket — set when a feed exists
  vpin_buckets: 50

# ── Moomoo T2 (Level-2) arm-on-demand, wired to the trigger FSM ARMED state. CONSERVING + fail-closed.
#    Arms a symbol's L2 subscription only while its trigger FSM is ARMED (seconds/minutes from a fire),
#    disarms otherwise; hard max_armed budget + TTL. Live-only (replay never arms). Fail-closed →
#    SCAFFOLD_ONLY until OpenD is configured (no real subscription/cost until then). ──
t2:
  arm_from_trigger: true       # wire ARMED → moomoo L2 arm (harmless until OpenD; observability now)
  max_armed: 8                 # hard OpenD L2 subscription budget (never exceeded / never silent-evict)
  ttl_seconds: 180             # auto-disarm if a name isn't re-armed within 3 min
  state_file: data/scalp/moomoo_armed_state.json   # cross-cron persistence (avoid re-subscribe churn)

# ── M3-S8 weight refit (§12). Weights are refit ONCE, only after G1 (>=100 TRIGGER fires / >=15
#    sessions), on a held-out split, then LOCKED with a hash and the sample RESTARTS. No continuous
#    tuning. The refit tool REFUSES until G1 is met (currently 6 fires / 1 session → blocked). ──
refit:
  g1_min_fires: 100
  g1_min_sessions: 15
  held_out_frac: 0.30          # deterministic (hashed) train/test split
  lock_file: config/scalp_ignition_weights_locked.json   # written on refit --apply (audit + hash)
