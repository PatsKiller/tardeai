# Momentum Scalp Signal Engine (momentum_scalp_intraday) — engine config.
# NEW key. Does NOT modify momentum_scalp.yaml or any existing strategy/threshold.
# M3-S1 uses only the [data] + [volume_profile] + [universe] sections.
# See docs/strategies/MOMENTUM_SCALP_SIGNAL_ENGINE_v1.md.

strategy_key: momentum_scalp_intraday

# Feature flag — engine OFF by default (shadow build only; no runner wired yet at M3-S1).
enabled: false

data:
  # Alpaca minute-bar feed. IEX is the M3-S1 default because RVOL_tod needs the SAME feed for BOTH
  # the profile (historical) AND the live numerator (real-time): this subscription permits SIP only
  # DELAYED (recent SIP → HTTP 403 "subscription does not permit querying recent SIP data"), so
  # real-time SIP is unavailable and a SIP profile would be biased against an IEX live numerator.
  # IEX is available both historical and real-time → self-consistent ratio (venue-share cancels).
  # SIP (delayed) is reserved for later T1 delayed-microstructure work, not RVOL_tod.
  feed: iex
  bars_endpoint: "https://data.alpaca.markets/v2/stocks/{symbol}/bars"
  timeframe: "1Min"
  adjustment: raw

session:
  tz: "America/New_York"
  regular_open: "09:30"
  regular_close: "16:00"     # last regular minute index = 389 (09:30..15:59)
  regular_minutes: 390

volume_profile:
  lookback_sessions: 20       # trailing sessions in the median
  min_sessions: 15            # skip a symbol with fewer complete sessions than this
  backfill_days: 40           # calendar days to pull to obtain >=20 complete sessions
  # Session completeness is SPAN-based, not print-density based: micro-float scalp names trade
  # sparsely (~50-180 prints/session on IEX, not 390) but still yield a valid cumulative profile
  # (no-trade minutes add 0, cumulative carries forward). A session counts if it printed near the
  # close (spans the day) and has at least a floor of prints (excludes near-dead sessions).
  require_close_minute: 375   # must have a print at/after minute 375 (15:45 ET) → covered the close
  min_session_prints: 30      # exclude near-dead sessions (fewer than this many traded minutes)
  session_window: regular     # premarket profile deferred (doc §14 Q5)
  max_profile_age_sessions: 3 # G2.2 freshness contract: refuse a denominator built more than this
                              # many TRADING sessions ago (a stale denominator poisons RVOL_tod
                              # silently). Consumed by get_profile_denominator().

universe:
  # M3-S1 default universe = existing scalp screener output, float-capped for the new key.
  source_table: scalp_scan_results
  symbol_column: symbol
  time_column: scanned_at
  float_column: float_mm
  float_mm_max: 30            # operator decision 2026-07-27 for momentum_scalp_intraday
  lookback_days: 21           # distinct symbols seen in this window

# ── M3-S3 IGN scorer (design §3.2/§3.3). Weights are v1 PRIORS, refit once on shadow data
#    at M3-S8 (§12) — do NOT hand-tune mid-shadow. All sub-scores normalize to [0,1]. ──
ignition:
  weights:                    # must sum to 1.0
    v_rvol: 0.28
    v_burst: 0.22
    v_cat: 0.18
    v_disp: 0.14
    v_liq: 0.10
    v_rs: 0.08
  subscores:
    v_rvol:
      ref_rvol: 2.0           # RVOL_tod=2× → 0 ; 20× → 1  (log10(rvol/ref))
      log_base: 10
    v_burst:
      z_divisor: 6.0          # clamp(z_vol/6, 0, 1)
      sigma_floor_frac: 0.10  # σ_eff = max(σ_20bar, sigma_floor_frac·μ_20bar, eps) — the σ floor guard
      sigma_eps: 1.0          # absolute floor (shares) so a dead 20-bar window can't blow up z
      mu_window: 20
    v_cat:
      decay_min: 90.0         # v_cat = tier_weight · exp(-age_min/decay_min)
      # tier weights by catalyst_source [VERIFY: mirrors the existing source-quality table].
      # Graceful default for unknown sources = default_weight. 0 when no catalyst.
      tier_weights:
        sec: 1.00
        "8-k": 1.00
        pr: 0.80
        rag: 0.70
        news: 0.65
        finviz: 0.55
        social: 0.30
        unknown_social: 0.20
      default_weight: 0.40
    v_disp:
      atr_mult: 2.0           # (P - VWAP) / (atr_mult · ATR_1m · sqrt(n_bars))
    v_liq:
      dollar_ref_low: 50000   # $·vol_5m = 50K → 0
      log_divisor: 1.7        # /1.7 so $2.5M → ~1
  rvol_tod:
    # universe-proxy fallback (§3.1) for symbols with no per-symbol profile (new/thin listings).
    min_profile_sessions: 15  # below this → use proxy
    proxy_source: universe    # 'universe' U-curve × ADV_20d × ExpectedFraction(t)

# ── Notification tiers (design §3.4). STORED for M3-S7; M3-S3 is SHADOW and emits NOTHING. ──
notifications:
  info_min: 45
  alert_min: 60
  accel_delta: 15
  accel_window_min: 10
  proposal_min: 75
  emit: false                 # HARD: shadow logging only — no Telegram, no proposals at M3-S3

# ── Data Confidence Factor (design §4.4). M3-S3 runs at T0. ──
# TIER NUMBERING = design-doc convention (operator ruling 2026-07-27): T2 = full book (moomoo, best
# data), T1 = SIP/quotes, T0 = bars-only (weakest, what ships today). This is the OPPOSITE numbering
# to some external "ascending capability" ladders — do not renumber; the invariant below is what
# actually matters, not the label direction. `quality_order` lists tiers best→worst so the
# monotonicity invariant (G4.3) is checked against data quality, not label sort order.
data_tiers:
  active_tier: T0
  quality_order: [T2, T1, T0]   # best data (book) → worst data (bars)
  dcf:                          # size multiplier — MUST be non-increasing along quality_order
    T2: 1.00
    T1: 0.70
    T0: 0.40
  assumed_slippage_bps:         # assumed slippage — MUST be non-decreasing along quality_order
    T2: 8
    T1: 20
    T0: 40
  stale_max_sec: 120            # data older than this → NO TRADE (dcf 0)
