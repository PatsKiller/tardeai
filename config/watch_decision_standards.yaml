# Watch decision standards — category, priority, scores, TTL, status, actionability for every Watch item
# (scripts/lib/data_broker/watch_decision.py). Operator 2026-10-07: the Command Center standards that
# Communications follows apply to the Watchlist too: every item carries a category, priority, confidence score,
# TTL, expiration timestamp, status and actionability indicator; items are sortable by priority, confidence,
# risk, reward and time sensitivity; stale signals leave the active views.
#
# What expires is the SIGNAL, never the membership: an expired item moves to the "expired" view until new
# evidence (a new entry plan, synthesis, review or re-entry computation) reaffirms it. HELD positions never leave
# the views — a held name with an old signal shows status "expired" (review it) but stays listed. Removing a name from the
# watchlist stays an operator action (watchlist_hygiene.py keeps its own weekly rules).
#
# Rules run top to bottom; the first whose every condition holds wins. Conditions (all optional, AND-ed):
#   held, near_trigger, in_zone, proposal_allowed      true/false
#   reentry_state_in, trade_state_in, plan_urgency_in, synthesis_in   lists (upper-cased compare, urgency lower)
#   min_plan_confidence, min_rr                          numbers
# Scores are 0..1. priority_score = 100 × (0.35·time + 0.25·max(risk, reward) + 0.20·confidence + 0.20·tier),
# tier from the rule's base priority — the same formula as config/comms_categories.yaml.

version: 1

categories:
  re_entry:                    {label: "Re-Entry", ttl_hours: 96}
  risk:                        {label: "Risk", ttl_hours: 96}
  high_conviction_opportunity: {label: "High Conviction Opportunity", ttl_hours: 96}
  reward:                      {label: "Reward", ttl_hours: 96}
  watchlist_candidate:         {label: "Watchlist Candidate", ttl_hours: 168}
  held_position:               {label: "Held Position", ttl_hours: 168}

# Re-entry desk state (lib/data_broker/reentry_decision_desk.py) → re-entry status (same vocabulary as Communications).
reentry_status:
  "READY TO REVIEW": confirmed
  "NEAR ENTRY": potential
  "WAIT": opportunity
  "OVERBOUGHT WAIT": opportunity
  "MISSING PLAN": opportunity
  "MISSING MARKET": opportunity

# Trade AI states and CIO synthesis outcomes that INVALIDATE a non-held idea (status = invalidated; still visible
# under the "avoid" view and with include_expired).
invalidating_trade_states: [AVOID, BLOCKED, DETERMINISTIC_FAIL]
invalidating_synthesis: [AVOID, IGNORE, SELL]

rules:
  - {id: held_negative, category: risk, priority: high, actionable: true, action: "Review the held position",
     when: {held: true, synthesis_in: [SELL, TRIM, AVOID]}}
  - {id: held_blocked, category: risk, priority: high, actionable: true, action: "Review the held position",
     when: {held: true, trade_state_in: [AVOID, BLOCKED, DETERMINISTIC_FAIL]}}
  - {id: reentry_confirmed, category: re_entry, priority: high, actionable: true, action: "Review re-entry now",
     when: {held: false, reentry_state_in: ["READY TO REVIEW"]}}
  - {id: reentry_near, category: re_entry, priority: medium, actionable: true, action: "Set a re-entry alert",
     when: {held: false, reentry_state_in: ["NEAR ENTRY"]}}
  - {id: reentry_watch, category: re_entry, priority: low, actionable: false,
     when: {held: false, reentry_state_in: [WAIT, "OVERBOUGHT WAIT", "MISSING PLAN", "MISSING MARKET"]}}
  # Entry rules never match a HELD name (2026-10-22 Watch audit: RTX/NVDA/CSWC/LDOS/BAH showed "High conviction /
  # Review entry" while Trade AI said MANAGING). A held name is managed, not entered: it falls through to held_watch.
  - {id: proposal_ready, category: high_conviction_opportunity, priority: high, actionable: true, action: "Review the proposal",
     when: {held: false, proposal_allowed: true}}
  - {id: plan_ready_strong, category: high_conviction_opportunity, priority: high, actionable: true, action: "Review entry",
     when: {held: false, plan_urgency_in: [ready], in_zone: true, min_plan_confidence: 0.6, min_rr: 2.0}}
  - {id: plan_ready, category: reward, priority: medium, actionable: true, action: "Review entry",
     when: {held: false, plan_urgency_in: [ready]}}
  - {id: near_trigger, category: reward, priority: medium, actionable: true, action: "Watch the trigger",
     when: {held: false, near_trigger: true}}
  - {id: plan_near, category: reward, priority: low, actionable: false,
     when: {held: false, plan_urgency_in: [near_entry]}}
  - {id: held_watch, category: held_position, priority: low, actionable: false, action: "Manage the position",
     when: {held: true}}
  - {id: candidate, category: watchlist_candidate, priority: low, actionable: false, when: {}}

# A non-held idea whose Trade AI state is one of these is NEVER actionable, whatever rule matched (2026-10-22 audit:
# FATN/AXTI showed "actionable / Set a re-entry alert" while Trade AI said DETERMINISTIC_FAIL / NO TRADE ACTION).
# The card keeps its category and status; actionable is false and blocked_by names the state.
non_actionable_trade_states: [DETERMINISTIC_FAIL, BLOCKED, AVOID]

# Score inputs.
scores:
  reward_rr_full: 6.0          # R:R at which reward = 1.0 (stored R:R mostly 2-4; 3 saturated)
  reward_upside_full_pct: 30   # street upside % at which reward = 1.0 (used when no plan R:R)
  risk_stop_full_pct: 15       # stop distance % at which stop risk = 1.0
  risk_earnings_days: 7        # earnings inside this window adds risk and time sensitivity
  near_full_pct: 6             # distance-to-trigger % at which time sensitivity falls to 0
  default_confidence: 0.3      # when no planner / strategy / synthesis confidence exists
  plan_fresh_hours: 168        # an entry plan older than this no longer counts as evidence
  synthesis_fresh_hours: 336

# priority label from priority_score — never lower than the rule's base priority, at most one tier above it.
priority_bands: {critical: 80, high: 60, medium: 40}

# Decision board: the six at-a-glance questions.
board:
  panel_size: 6
  expiring_within_hours: 24
  recent_hours: 24
  reward_min: 0.5              # "Highest reward" counts items at or above this reward score
  risk_min: 0.6                # "Highest risk" counts risk-category items and items at or above this risk score

# Held flag — the one reader is lib/data_broker/watch_domains.held_positions() (2026-10-22 Watch audit).
# positions_store_reader: read held names from positions_current (broker-synced, positions_sync freshness contract)
#   before holdings.json. ON since 2026-10-22: the operator approved positions_store phase-3 reader batch #1 = the
#   Watch held flag ("I take your recommendations on above", reply to "Use the broker-synced store for 'held' on
#   Watch: Watch becomes positions batch #1 … Recommend: yes"). The grant is recorded in
#   config/data_source_authority.json, domain positions_store, approved_readers[batch 1] (AGENTS.md §7A, §17).
# positions_store_reader_surfaces: the callers that may read the store: "watch" (batch #1) and "home" (batch #3,
#   operator 2026-10-22, verbatim "yes i approve 'approve all' (A–L)", item G: the Home do-now held filter). A held_positions()
#   caller with no surface (advice digest, opportunity) reads holdings.json only. Adding a surface is a new reader
#   batch — an operator grant, recorded in the registry in the same PR.
# A stale, empty or unreadable store falls back to holdings.json with an explicit fallback_reason, never silently.
# holdings_stale_after_hours: holdings.json older than this is served with stale=true (registry stale_after_hours).
held:
  positions_store_reader: true
  positions_store_reader_surfaces: [watch, home]
  holdings_stale_after_hours: 24
