# Retired multi-model embedding canary. Only pinned nomic may remain.
enabled: false
phase: retired_hybrid_embedding_canary
production_default_embedding: nomic-embed-text
shadow_embedding: null
production_table: content_embeddings
shadow_table: null
global_rag_default: nomic_only
global_promotion_approved: false
allowed_workflows: []
blocked_workflows: [all]
canary_limits:
  max_jobs_per_run: 0
  max_runtime_min: 0
  strict_mode: true
  fallback_to_nomic: false
retrieval:
  final_k: 10
  top_k_nomic: 10
  top_k_shadow: 0
  consensus_boost: 1.0
lifecycle:
  restore_nomic_after_run: false
audit:
  write_metrics: true
  log_path: logs/phase2g_hybrid_canary.log
