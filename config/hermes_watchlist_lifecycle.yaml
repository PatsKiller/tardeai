# Watchlist lifecycle + health scoring — parallel to scope_tier (S0–S3), outcome-driven.

enabled: true
review_mode: true   # block weak promotions in governor; tier writes still via --apply

stages:
  - new
  - monitoring
  - watch
  - promoted
  - demoted
  - archived
  - blacklisted

new_symbol_days: 7
archive_conviction_floor: 35
demotion_cooldown_days: 7

# Composite health score (0–100) — Phase 2
health_weights:
  outcome_performance: 0.22
  promotion_success_rate: 0.13
  tag_lift_consistency: 0.13
  stop_quality: 0.25          # heavier weight on stop discipline (Prompt A)
  regime_alignment: 0.09
  research_efficiency: 0.09
  edge_blend: 0.09

health_thresholds:
  promote_floor: 62        # block outcome S1 promotion below this
  watch_min: 45
  watch_max: 59
  archive_floor: 35
  trend_decline_watch: 10    # 7d health drop triggers watch stage

confidence:
  min_graded_samples: 3
  min_graded_for_full: 5
  low_graded_multiplier: 0.75
  sparse_multiplier: 0.85

conviction_blend:
  health_weight: 0.70
  edge_weight: 0.30

conviction:
  gate_adjustments:
    promote_eligible: 8
    demote_pressure: -18
    pause_eligible: -28
    neutral: 0
  bus_action_adjustments:
    promote_eligible: 5
    demote_pressure: -10
    pause: -20

transition_rules:
  min_graded_samples: 3
  auto_blacklist_on_pause: true
  block_weak_outcome_promotions: true

promotion_success:
  lookback_days: 90

health_history_days: 14

regime:
  high_vol_tokens: [high_vol, volatility, risk_off, elevated]

monitoring:
  panel_limit: 30

# Phase D — closed-loop evaluation (run via hermes_threshold_learner.py --evaluate)
evaluation:
  enabled: true
  lookback_days: 60
  min_days_after_activation: 7
  before_window_days: 14
  after_window_days: 14
  min_window_days: 7
  min_blocked_samples: 3
  helped_hit_rate_delta: 0.02
  hurt_hit_rate_delta: -0.05
  weak_blocked_hit_rate_ceiling: 0.40