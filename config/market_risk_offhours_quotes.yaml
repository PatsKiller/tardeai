# Market Risk Engine off-hours quotes from Schwab market data (scripts/lib/offhours_quotes.py,
# scripts/market_quotes_offhours_schwab.py). Operator-owned settings.
# Why: the Market Risk Engine (#2383) had no quote after about 16:10 ET or before the 09:30 open (2026-10-30 selloff
# RCA, design DSN-20261031-market-risk-engine). Alpaca extended-session prints are collected by #2384's producer
# (scripts/market_quotes_extended.py, config/market_quotes_extended.json); this lane adds Schwab's view.
# STORE: market_quotes_extended through its single writer scripts/lib/writers/market_quotes_extended_writer.py --
# NEVER market_quotes, whose newest row is the "latest quote" for stop checks, the repricer and watch alerts
# (coordinator decision 2026-10-31, option 3; review of #2384).
# Advisory market data only (MBI_BEHAVIOR = 0): no order, stop, account or auth endpoint is reachable from here.
# Scheduling lives in the host crontab (lane market-quotes-offhours-schwab in config/lane_registry.json), not in this file.
schema: MarketRiskOffHoursQuotes@v2
as_of: 2026-10-31

universe:
  # One list, read from where it already lives; nothing is copied here. A key that is absent is named on the run
  # receipt as missing_refs and the run continues with the rest.
  sources:
    - {file: config/market_quotes_extended.json, key: symbols}          # #2384's Alpaca universe (index/sector proxies + heavyweights)
    - {file: config/market_risk_policy.yaml, key: extended_hours.heavyweights}  # the engine's large-cap list

schwab:
  # ON: operator in session 2026-11-01 ~13:45 ET, "enable schwab", under the 2026-10-31 broker-market-data allowance
  # (AGENTS.md 29.2.0 §24.11, #2407 merged): read-only market data via host lanes; never orders, accounts, stops, 2FA,
  # auth endpoints or credentials. Grant recorded in config/data_source_authority.json providers.schwab.supply_grants.
  enabled: true
  requires_policy: "AGENTS.md 29.2.0 §24.11 (PR #2407, merged)"
  marketdata_base_url: "https://api.schwabapi.com/marketdata/v1/"
  batch_size: 100
  feed: schwab                 # market_quotes_extended.feed; the unique key (symbol, bar_start, feed) keeps it apart from Alpaca sip
  # These are ROOTS. Schwab answers a root with the front-month CONTRACT (asking for "/ES" on 2026-11-01 returned
  # "/ESZ26"); offhours_quotes.contract_root stores the row under the root listed here -- the same name
  # market_risk_policy.yaml extended_hours.futures_proxies reads -- and the run receipt's symbol_map records which
  # contract stood behind it. A contract whose root is not listed here is skipped (unmapped_contract), never stored
  # under a name nothing reads.
  futures: ["/ES", "/NQ", "/RTY", "/YM"]
  # $DJI/$RUT/$NDX added per design WU-1 (ADDENDUM to LQ-20261107-939, lead 2026-11-08 10:58 ET):
  # ["$SPX","$COMPX","$DJI","$RUT","$NDX","$VIX"]. Every index symbol must come back from Schwab as
  # assetMainType INDEX; anything else is refused with a named ``index_asset_type_*`` reason on the receipt (never
  # stored as if it were an index, never silently dropped), and the brief prints UNKNOWN for it.
  indices: ["$SPX", "$COMPX", "$DJI", "$RUT", "$NDX", "$VIX"]
  # CASH INDEX LEVELS (LQ-20261107-939, operator 2026-11-08: the Sunday 20:00 ET weekly-outlook brief needs them).
  # A cash index has no off-hours print: Schwab's last $SPX/$COMPX/$DJI/$RUT trade is frozen at the regular close
  # (measured: Friday 16:47 ET, age ~50 h at the Sunday 18:00 fire), so max_trade_age_minutes would refuse it as a
  # quote. That is right for a QUOTE and wrong for a LEVEL: the cash index level off-hours IS its last close, and it
  # is knowable (and true) for every fire until the next cash open. With this block present, an index whose print is
  # older than max_trade_age_minutes but no older than carry_max_age_hours is stored as a LEVEL ONLY row in the
  # NIGHT session the lane observes (overnight 20:00-04:00 ET; never futures_open, which the store reserves for
  # futures, and never premarket/afterhours, which require a dated close). bar_end is that session's 20:00 ET start,
  # so every later fire in the same night conflicts on (symbol, bar_start, feed) and writes nothing: one row per
  # index per night, never a synthetic stream. reference_basis names the basis AND the print's ET date
  # (<basis_prefix>_YYYY-MM-DD) -- a level is never shown as a fresh print; the receipt also carries carried_from.
  # Equities and futures are never carried. Remove the block, or set carry_max_age_hours to 0, to go back to
  # refusing every stale index print.
  index_levels:
    carry_max_age_hours: 120   # Fri close -> Tue 09:30 ET after a Monday holiday is 113 h; 120 covers the longest gap
    basis_prefix: schwab_index_level_carried_print
  include_universe: true       # also the universe's extended-hours prices
  # ET window: Sunday 18:00 through Friday 09:30, regular session skipped on trading days.
  window: {start_day: sun, start: "18:00", end_day: fri, end: "09:30"}
  skip_regular_session: true
  max_trade_age_minutes: 30
  # A point quote has no bar: bar_end is the trade instant itself (when the print became knowable) and bar_start is
  # this many milliseconds earlier, because the store's contract requires bar_end > bar_start.
  point_quote_span_ms: 1
  # Reference close: ONE rule for every session (review of #2416 F4 and #2423 F2/F6, 2026-10-31). The reference is the
  # close of: the same trading day (afterhours), the previous session (premarket), or the trading day before the
  # trading date (overnight / futures_open, scripts/lib/overnight_session.py). It is used ONLY when the payload dates
  # it to that day: equities regular.regularMarketLastPrice + regular.regularMarketTradeTime, futures and indices
  # quote.closePrice + quote.settleTime (the settlement). Undated or another day: premarket/afterhours rows are
  # refused (no_dated_reference_for_<session>); overnight/futures_open rows store the level only, and the engine
  # ties them to the close through an earlier referenced print of the same symbol or reads UNKNOWN.
  # Coverage note: weekday futures 16:00-20:00 (afterhours) and the Sunday open are measured when Schwab dates the
  # close to the reference session, or (overnight / futures_open only, see below) to a later day up to the print.
  #
  # Operator 2026-11-01, "fix the futures settleTime so they measure": Schwab dates a futures close to the PRINT's
  # own session day (live: the 2026-11-01 Sunday open carried settleTime 2026-11-01, not the 2026-10-30 reference
  # session), so every overnight futures row was level-only and extended_hours never measured /ES or /NQ. With this
  # true, a FUTURE or INDEX close in an overnight/futures_open session, dated after the reference session and no
  # later than the PRINT ITSELF (the close instant, not just its date), is accepted as that session's reference under
  # its own basis label below. Premarket/afterhours are not widened. It is still the provider's last close, never
  # older than the reference and never newer than the print; equities are never widened. Set false to refuse it again
  # (futures then stay level-only and unmeasured); the value must be a real boolean and the label below must exist.
  #
  # A fresh STAMP does not prove a fresh close (Schwab stamped a Sunday, when CME does not settle), and the provider
  # derives netChange FROM that same close, so it cannot corroborate itself (round-2 review of #2485, 2026-11-02). A
  # same-day-dated close is accepted ONLY when a stored reference for the session date agrees within
  # max(tolerance_abs, tolerance_pct% of closePrice). No reference, or a disagreement, keeps the row LEVEL ONLY.
  same_day_reference_tolerance_pct: 0.25
  same_day_reference_tolerance_abs: 0.05
  # SETTLE REFERENCE (design WU-1, ADDENDUM to LQ-20261107-939, lead 2026-11-08 10:58 ET): the reference is the LANE'S
  # OWN last stored settle for the session date, read from market_quotes_extended on the feed below. It replaces the
  # yfinance-named map (ES=F, NQ=F, RTY=F, YM=F) that read market_ohlcv_bars daily bars: those symbols had zero rows and
  # would have brought a banned source into the Market Risk Engine (LQ-20261107-455). Friday's after-hours rows carry
  # Friday's settle as their reference_close, so a Sunday close the provider dates to Sunday is corroborated against the
  # settle this lane itself recorded on Friday. Stated plainly: that is the same provider's earlier observation, not a
  # second provider -- it catches a provider re-stamping an old close with a fresh date (the 2026-11-01 defect) and it
  # cannot catch an error both prints share. No stored settle (first run, a missed Friday) = no reference = level only.
  settle_reference_source: market_quotes_extended_own_feed
  settle_reference_feed: schwab
  settle_same_day_reference: true
  dated_reference_basis:
    equity: schwab_regular_market_last_price_dated
    non_equity: schwab_quote_close_price_settle_dated
    non_equity_same_day: schwab_quote_close_price_settle_same_day
    level_only: none_level_only_no_dated_reference_in_payload
