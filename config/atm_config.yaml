# Automated Trade Mode v1 configuration
# Per-account caps. Global state machine. No broker hardcoded.
#
# ATM does NOT control where trades execute. That is governed by:
#   - ALPACA_MODE / LLM_DISABLE_LIVE_EXECUTION (existing env flags)
#   - accounts table routing_adapter / mode fields
#   - the proposal's target_account assignment
version: 1

defaults:
  position_limits:
    max_concurrent: 10           # Stage 1: was 6
    max_new_per_day: 25          # Stage 1: was 3
    max_pct_per_trade: 0.05      # Stage 1: was 0.10 (5% = $5K max per trade)
    max_pct_per_strategy: 20     # Stage 1: was 25
    max_pct_per_sector: 30       # Stage 1: was 35
  strategy_filter:
    # TEMPORARY: lowered from 0.50 to 0.0 during DRY_RUN cold-start
    # (0 closed trades per strategy → health=0.0 → gate blocks everything)
    # Restore to 0.50 once ≥3 paper trades close per active strategy.
    min_classifier_health: 0.0
    whitelist: []
    blacklist: []
  # Finviz technical gate — same score band as Proposals card (≥60 OK, WEAK/INCOMPLETE block).
  technical_gate:
    min_score: 60
    block_grades:
    - TECH_WEAK
    - TECH_INCOMPLETE
  kill_switches:
    daily_loss_pct_hard_pause: 2.5   # Stage 1: was 0.25 (2.5% = $2,500 daily loss cap)
  operating_hours:
    start_et: "04:00"                # Alpaca premarket start
    stop_new_entries_et: "15:30"     # Last new entry before market close
    extended_hours_exit_et: "19:30"  # Allow exits until 30min before AH close
  extended_hours:
    enabled: true
    premarket_start_et: "04:00"
    afterhours_end_et: "20:00"
    allow_extended_entries: true
    allow_extended_exits: true
    limit_orders_only: true          # Alpaca requirement for extended hours
    reduced_size_multiplier: 0.5     # Half position size in extended hours
    max_spread_pct: 1.0              # Stricter spread gate for thin liquidity

# Same-day strategies: gap_and_go still skipped (requires sub-minute execution).
# momentum_scalp REMOVED from skip list — ATM now allowed to process these.
same_day_skip_strategies:
- gap_and_go

# Per-account overrides. account_label must exist in accounts table.
# DEPRECATED (R1 2026-07-21): which accounts are ATM-enabled is owned by
# broker_accounts + account_automation_policies (automation_mode AUTO_PAPER/AUTO_LIVE).
# The YAML list below is retained only as a temporary intersection filter +
# position_limits overrides — do not add new accounts here; insert DB rows.
accounts:
  tradeai_automated:
    enabled: true
    position_limits:
      max_concurrent: 10         # Stage 1: was 6
      max_new_per_day: 25        # Stage 1: was 3
      max_pct_per_trade: 0.05    # Stage 1: was 0.10

global:
  daily_loss_pct_hard_pause_aggregate: 10.0
  manual_kill_switch_only: true
  config_backup_dir: "config/.atm_config_backups"

# B-1 observation window protection (ended 2026-05-25 — all strategies now active).
b1_tracking:
  enabled: false
  observation_end: "2026-05-25"
  exclude_bucket2_during_observation: false
  bucket2_strategies:
  - swing_breakout
  - swing_trade
  - earnings_post_momentum
  - recovery_watch
  - fib_retracement_bounce
