# Canonical Finviz screener registry — single source of truth for screener names, URLs, filters,
# strategy family, cadence class, signal-decay/time-sensitivity, and active/sunset status.
#
# Two groups:
#   screeners:    operator-provided purpose-built presets (scalp/gapper + swing). These drive the
#                 5-minute scalp lane (scalp_fast only) and the swing cadence.
#   db_screeners: the 29 screeners currently in the finviz_screeners DB table (income/swing/fundamental;
#                 NONE are momentum_scalp). classification_status=needs_review until operator-confirmed.
#
# validate_finviz_screener_registry.py FAILS the build if the DB and this registry drift (missing /
# extra / active-mismatch). Finviz screens are DISCOVERY ONLY — go_eligible_by_itself is always false;
# momentum_scalp GO still requires the strict downstream deterministic gates (float<=20M, RVOL>=5,
# verified catalyst, fresh quote, route=momentum_scalp/GO, not-scout, valid plan, risk/liquidity/TTL).

screeners:
  - screener_id: momentum_scalp_primary_gappers
    preset_id: s144880153
    name: "Momentum Scalp — Primary Premarket High-RVOL Gappers"
    strategy_family: momentum_scalp
    time_sensitivity: scalp_fast
    cadence_class: scalp_fast
    active: true
    cadence: {market_days_only: true, timezone: America/New_York,
              windows: [{start: "06:00", end: "10:30", every_minutes: 5}]}
    url: "https://elite.finviz.com/screener?v=151&f=cap_smallunder%2Cgeo_usa%2Csh_avgvol_o100%2Csh_float_u50%2Csh_price_2to20%2Csh_relvol_o5%2Cta_gap_u10&ft=4&o=-sector&c=0%2C1%2C2%2C3%2C4%2C5%2C6%2C7%2C25%2C67%2C65%2C66%2C136%2C137&preset=s144880153"
    filters: {cap: small_under, geo: usa, avg_volume_min: 100000, float_max_m: 50,
              price_min: 2, price_max: 20, rel_volume_min: 5, gap_up_min_pct: 10}
    primary_use: "Premarket scalp/gapper discovery. Broad discovery; strict momentum_scalp GO gates apply downstream."
    contributes_to: [market_confirmation, structure_tradeability, strategy_risk_fit, catalyst_evidence_optional]
    go_eligible_by_itself: false
    notes: "Float <50M is broader than momentum_scalp GO (<=20M). Downstream GO requires float<=20M, verified catalyst, fresh quote, route=momentum_scalp, actionability=GO, valid plan, all deterministic gates."

  - screener_id: momentum_scalp_low_price_active_gappers
    preset_id: s144880160
    name: "Momentum Scalp — Lower-Price Active Gappers"
    strategy_family: momentum_scalp
    time_sensitivity: scalp_fast
    cadence_class: scalp_fast
    active: true
    cadence: {market_days_only: true, timezone: America/New_York,
              windows: [{start: "06:00", end: "10:30", every_minutes: 5}]}
    url: "https://elite.finviz.com/screener?v=111&f=cap_smallunder%2Cexch_nyse%7Cnasd%2Csh_avgvol_o100%2Csh_curvol_o50%2Csh_float_u50%2Csh_price_1to10%2Csh_relvol_o2%2Cta_gap_u5&ft=4&o=-change&preset=s144880160"
    filters: {cap: small_under, exchanges: [nyse, nasdaq], avg_volume_min: 100000, current_volume_min: 50000,
              float_max_m: 50, price_min: 1, price_max: 10, rel_volume_min: 2, gap_up_min_pct: 5}
    primary_use: "Broader active low-price gapper discovery. Good for early Social Scout/watch candidates; strict GO gates apply."
    contributes_to: [market_confirmation, structure_tradeability, strategy_risk_fit]
    go_eligible_by_itself: false

  - screener_id: momentum_scalp_intraday_continuation
    preset_id: s144880157
    name: "Momentum Scalp — Intraday Continuation / Change From Open"
    strategy_family: momentum_scalp
    time_sensitivity: scalp_fast
    cadence_class: scalp_fast
    active: true
    cadence: {market_days_only: true, timezone: America/New_York,
              windows: [{start: "09:30", end: "11:30", every_minutes: 5}]}
    url: "https://elite.finviz.com/screener?v=111&f=cap_smallunder%2Cexch_nyse%7Cnasd%2Csh_avgvol_o100%2Csh_curvol_o100%2Csh_float_u50%2Csh_price_1to10%2Csh_relvol_o2%2Cta_changeopen_5to50&ft=4&o=-change&preset=s144880157"
    filters: {cap: small_under, exchanges: [nyse, nasdaq], avg_volume_min: 100000, current_volume_min: 100000,
              float_max_m: 50, price_min: 1, price_max: 10, rel_volume_min: 2,
              change_from_open_min_pct: 5, change_from_open_max_pct: 50}
    primary_use: "Post-open continuation / opening-range momentum discovery (09:30-11:30 ET only)."
    contributes_to: [market_confirmation, structure_tradeability, strategy_risk_fit]
    go_eligible_by_itself: false

  - screener_id: swing_smallcap_quality_trend_extension
    preset_id: s144880159
    name: "Swing — Small-Cap Quality Trend Extension"
    strategy_family: swing
    time_sensitivity: swing_daily
    cadence_class: swing_daily
    active: true
    cadence: {market_days_only: true, timezone: America/New_York,
              windows: [{start: "10:00", end: "10:05", every_minutes: 1440},
                        {start: "15:30", end: "15:35", every_minutes: 1440}]}
    url: "https://elite.finviz.com/screener?v=111&f=cap_smallunder%2Cfa_curratio_o1%2Cfa_debteq_u1%2Csh_avgvol_o300%2Csh_price_10to200%2Cta_sma50_pa10&preset=s144880159"
    filters: {cap: small_under, current_ratio_min: 1, debt_to_equity_max: 1, avg_volume_min: 300000,
              price_min: 10, price_max: 200, price_vs_sma50: above_10pct}
    primary_use: "Small-cap quality/trend-extension swing candidates. NOT a scalp screen."
    recommended_frequency: "1-2x/day"
    go_eligible_by_itself: false

  - screener_id: swing_smallcap_uptrend_pullback
    preset_id: s144880158
    name: "Swing — Small-Cap Uptrend Pullback"
    strategy_family: swing
    time_sensitivity: swing_intraday
    cadence_class: swing_intraday
    active: true
    cadence: {market_days_only: true, timezone: America/New_York,
              windows: [{start: "09:45", end: "09:50", every_minutes: 1440},
                        {start: "12:30", end: "12:35", every_minutes: 1440},
                        {start: "15:30", end: "15:35", every_minutes: 1440}]}
    url: "https://elite.finviz.com/screener?v=111&f=cap_smallunder%2Cfa_curratio_o1%2Cfa_debteq_u1%2Csh_avgvol_o300%2Csh_price_10to200%2Cta_sma20_pb%2Cta_sma200_pa%2Cta_sma50_pa&preset=s144880158"
    filters: {cap: small_under, current_ratio_min: 1, debt_to_equity_max: 1, avg_volume_min: 300000,
              price_min: 10, price_max: 200, price_vs_sma20: below, price_vs_sma50: above, price_vs_sma200: above}
    primary_use: "Swing pullback in an uptrend. Watchlist/swing research, NOT scalp execution."
    recommended_frequency: "2-3x/day"
    go_eligible_by_itself: false

# The scalp 5-minute lane runs ONLY these scalp_fast screener_ids (intraday_continuation only 09:30-11:30):
scalp_lane_screener_ids:
  - momentum_scalp_primary_gappers
  - momentum_scalp_low_price_active_gappers
  - momentum_scalp_intraday_continuation

