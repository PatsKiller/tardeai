# Wait for the Bitwarden secret render before reading credentials.
#
# Observed on boot 6f2050e7 (2026-09-12). This unit started at 17:02:27, six
# seconds before tradeai-sm-render.service first succeeded at 17:02:33, and died
# with
#
#     FATAL:  password authentication failed for user "trade_ai"
#
# which is false -- the database was healthy throughout. With no DB_PASSWORD in
# the environment, libpq silently fell back to ~/.pgpass, stale since
# 2026-07-16. The misleading error is fixed separately; this stops the race that
# produced it.
#
# WHY THIS UNIT RACES AT ALL, which is the part worth knowing: its timer carries
# Persistent=true with a Sat 14:00 trigger. The host was down 09:55-17:02, so
# systemd fired the MISSED event immediately at boot -- catch-up runs land in
# exactly the window where secrets do not exist yet. On a host that reboots
# often, a persistent timer will race the render every single time.
#
# Wants= rather than Requires=: if the render is genuinely broken this unit
# should still get its chance to run and fail honestly, rather than being
# silently skipped.
#
# ROLLBACK (one step):
#   rm ~/.config/systemd/user/tradeai-watch-decision-scheduler.service.d/20-after-sm-render.conf
#   systemctl --user daemon-reload
[Unit]
After=tradeai-sm-render.service
Wants=tradeai-sm-render.service
