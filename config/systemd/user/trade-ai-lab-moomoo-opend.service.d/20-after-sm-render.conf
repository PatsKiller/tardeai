# Wait for the Bitwarden secret render before reading credentials.
#
# Observed on boot 6f2050e7 (2026-09-12), 17:02:27, six seconds before
# tradeai-sm-render.service first succeeded:
#
#     [opend_launch] FATAL: MOOMOO_OPEND_LOGIN_ACCOUNT not in Bitwarden render
#                           (/run/user/1000/tradeai/env).
#
# Verified this is a race and not a missing credential: the key IS present in
# the render now. The unit was simply asking before the file existed. Worth
# checking, because the same message would appear if the secret had never been
# stored, and ordering would not have helped that.
#
# This unit is WantedBy=default.target, so it is queued in the boot transaction
# alongside the render and After= orders it correctly.
#
# ROLLBACK (one step):
#   rm ~/.config/systemd/user/trade-ai-lab-moomoo-opend.service.d/20-after-sm-render.conf
#   systemctl --user daemon-reload
[Unit]
After=tradeai-sm-render.service
Wants=tradeai-sm-render.service
