# Enable the paid Flash/Pro opinion layer for the daily shadow session.
# ADVISORY_DESK_V1 read by run_shadow_session() gates live_llm (dry_run=False).
# yaml flag in config/advisory_desk.yaml is also true; this env keeps the
# systemd timer path live without editing the unit ExecStart.
[Service]
Environment=ADVISORY_DESK_V1=true
