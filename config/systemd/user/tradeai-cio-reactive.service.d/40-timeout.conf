# Bounded run for the reactive wake cycle (2026-10-31). Before this the oneshot had TimeoutStartSec=infinity and sat
# "activating" from 2026-10-30 05:10 ET for 31 h behind a self-deadlocked wake-job lock, so its 2-minute timer never
# fired again. Measured longest clean run: 325 s (start spacing over 9,300 runs, 10-17..10-30; p99 22 s). 15 min
# leaves ~2.8x margin; the process reaper rule cio_reactive_cycle uses the same cap.
# Install (host, operator or deploy): cp this file to ~/.config/systemd/user/tradeai-cio-reactive.service.d/ and
# systemctl --user daemon-reload. Takes effect at the next timer fire.
[Service]
TimeoutStartSec=15min
