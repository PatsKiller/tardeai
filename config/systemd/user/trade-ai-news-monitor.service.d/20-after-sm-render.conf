# Wait for the Bitwarden secret render before reading credentials.
#
# Failed on boot 6f2050e7 (2026-09-12) at 17:02:27 with a bare exit 1 and no
# diagnostic, inside the same pre-render window as the other two casualties.
# Confirmed by running it once secrets were present: it finishes successfully.
# So the boot failure was the race, not the script.
#
# Its own ordering was After=network.target, which says nothing about whether
# the secret render has run.
#
# ROLLBACK (one step):
#   rm ~/.config/systemd/user/trade-ai-news-monitor.service.d/20-after-sm-render.conf
#   systemctl --user daemon-reload
[Unit]
After=tradeai-sm-render.service
Wants=tradeai-sm-render.service
