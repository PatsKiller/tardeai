# Retry the secret render until the network can actually reach Bitwarden.
#
# Measured on boot 6f2050e7 (2026-09-12): the first attempt at 17:02:27 exited 1
# with a DNS failure resolving identity.bitwarden.com -- the network was not up
# yet. `After=network-online.target` does NOT prevent this: in a *user* manager
# network-online.target is a local, inert target, not the system one, so it
# orders against nothing.
#
# A successful re-render did happen 6 seconds later, but nothing in this unit
# declared it -- there is no Restart= here and the timer's OnBootSec=2min did not
# fire until 17:04:19. The recovery was incidental. Every unit that read secrets
# in the 14-second gap (17:02:19 boot -> 17:02:33 first good render) started
# without them; tradeai-watch-decision-scheduler.service lost that race by six
# seconds and stayed failed for the rest of the boot.
#
# This makes the retry declared rather than lucky. It is deliberately additive:
# it changes nothing about a render that succeeds first time.
#
# ROLLBACK (one step):
#   rm ~/.config/systemd/user/tradeai-sm-render.service.d/20-retry-until-rendered.conf
#   systemctl --user daemon-reload
# StartLimit* are [Unit] directives in systemd >= 229; in [Service] they parse
# as unknown and are silently ignored, which would have left the retry unbounded.
[Unit]
# Six attempts over ~5 minutes covers DHCP/DNS coming up after a cold boot
# without spinning forever on a genuine credential fault.
StartLimitBurst=6
StartLimitIntervalSec=300

[Service]
Restart=on-failure
RestartSec=10
