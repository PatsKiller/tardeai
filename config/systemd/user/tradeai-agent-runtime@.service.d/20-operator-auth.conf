[Service]
# EnvironmentFile is applied first; bare Environment= in the unit body then overrides it
# to AUTH=0. This drop-in re-asserts operator auth for the opt-in host.
Environment=AGENT_RUNTIME_OPERATOR_AUTH=1
Environment=AGENT_RUNTIME_PROVIDER_MODULE=agent_runtime_live_providers
Environment=AGENT_RUNTIME_QUEUE_MODULE=agent_runtime_dispatch_boot
# Ensure scripts/ is on path (already in unit; restate for safety)
Environment=PYTHONPATH=/home/johnclaw/trade-ai-v12-rebuild/trade-ai-v12-rebuild/scripts
