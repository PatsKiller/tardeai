# Holdings lifecycle — per-position health + advisory stages (no auto-sell).

enabled: true
review_mode: true

stages:
  - healthy
  - watch
  - trim_candidate
  - exited

health_weights:
  stop_quality: 0.30          # trail, alignment, R-left (Prompt: 25–35%)
  outcome_consistency: 0.22
  realized_r: 0.15
  research_actionability: 0.13
  position_risk: 0.20

confidence:
  min_graded_samples: 2
  min_graded_for_full: 4
  low_graded_multiplier: 0.80
  sparse_multiplier: 0.88

thresholds:
  healthy_min: 70
  watch_min: 50
  trim_max: 49

monitoring_hints:
  healthy:
    research_depth: standard
    stop_monitoring: normal
  watch:
    research_depth: elevated
    stop_monitoring: tight
  trim_candidate:
    research_depth: full
    stop_monitoring: tight
  exited:
    research_depth: none
    stop_monitoring: none

# LLM health chip mapping (portfolio watchlist_items)
llm_health_scores:
  STRONG: 90
  STABLE: 75
  WATCH: 55
  WEAK: 35
  CRITICAL: 20

panel_limit: 25
history_days: 14
# ── Stop-policy linkage (documentation only — no engine reads this block) ─────
# Lifecycle stages feed protective-stop sizing via config/stop_policy.yaml
# `lifecycle_modifiers` (watch: cap −1 pct-pt, trim_candidate: cap −2). Stop rules
# themselves live ONLY in stop_policy.yaml so the two files cannot drift; this
# note exists so a reader of this file knows the stages have that second consumer.
