# Operator-documented cost basis for long-held lots whose opening predates the Schwab API transaction
# window (2025-07-19). Used by schwab_journal_builder when no in-window or CSV opening lot exists. NEVER
# reconstructed from the truncated API window. Split-adjusted per-share basis.
#
# BASIS HIERARCHY (authoritative first): schwab_cost_basis_lots (Schwab Gain/Loss export) > THIS file
# (operator-documented) > basis_unknown. These entries are TIER 2 — operator-documented but NOT yet
# validated against Schwab's actual tax-lot assignment. Once a Schwab Realized Gain/Loss CSV is ingested
# (scripts/ingest_schwab_gainloss.py --apply) the reconcile pass elevates/corrects these; Schwab wins.
# Format:  "SYMBOL|account": basis_per_share
overrides:
  # V: documented IPO lot ONLY = 400 sh @ $10.75 (100 sh 2008 IPO @ ~$43 -> 4:1 split 2015). The override
  # basis is now CAPPED at documented_qty: shares sold beyond 400 underflow to basis_unknown (their true
  # basis needs the Schwab Realized Gain/Loss export). Confirmed by the 2026-04-21 Roth Positions export:
  # the 130 V shares still HELD carry cost basis $307.32/sh (NOT $10.75) — so the non-IPO V is high-basis.
  "V|schwab_roth_ira":
    basis: 10.75
    documented_qty: 400
