consolidation_note: "Absorbs gap_and_go (2026-06-11): gap >5% at open is a sub-setup of this strategy, not a separate one"
strategy_id: momentum_scalp
display_name: Momentum Scalp
version: 1.0.0
status: TESTING
purpose: "Micro-cap momentum — RVOL surge + verified catalyst. Intraday hold, exit same day."
eligible_accounts:
  - taxable
forbidden_accounts:
  - rollover_ira
  - roth_ira
  - fidelity_rollover_ira
timeframe: intraday
timeframe_class: INTRADAY
universe: micro_cap_momentum
primary_data_sources:
  - finviz_screener
  - trade_ai_scans
  - social_posts
  - news_articles
  - sec_form4
screen_filters:
  min_price: 1.0
  max_price: 25.0
  preferred_max_price: 10.0
  min_rvol: 5.0              # preferred RVOL > 5 (the setup: high RVOL on low float)
  premium_rvol: 8.0
  max_float_m: 20            # float under 20M (was 100) — operator preference 2026-06-26
  preferred_max_float_m: 10  # prime: under 10M
  min_volume: 1000000       # absolute "high volume" liquidity floor (shares) — tradeable scalp
  min_gap_pct: 5.0
  min_score: 40
  aplus_score: 48

# Intraday scalp execution (operator 2026-06-26): the strategy was generating 104 proposals → 0
# conversions because the 9h TTL + slow approval cadence outran the scalp window. Fast-path fixes it.
intraday_execution:
  trading_window_et: {start: "06:00", end: "12:00"}     # 6am-noon ET, trading days only
  proposal_ttl_minutes: 30        # short TTL — a scalp setup is valid for minutes, not 9h
  fast_path_auto_approve: true    # gated auto-approve within window (paper account) so it converts
  fast_path_account: alpaca_paper # build the sample on paper before promoting off TESTING
  max_price_drift_pct: 3.0        # kill the proposal if price drifts past this before fill
  social_momentum:
    enabled: true                 # social-surge scalps are in scope
    social_only_max_grade: WATCH  # social-ONLY stays advisory (no auto-trade without confirmation)
    social_confirmed_tradeable: true  # social + Finviz/RVOL confirmation can reach GO
setup_qualification:
  catalyst_present: required
  catalyst_verified_for_aplus: true
  catalyst_verified_for_live: true
  social_only_max_grade: WATCH
  price_data_max_age_minutes: 15
  rvol_data_required: true
  float_data_required: true
auto_disqualifiers:
  - id: PRICE_OVER_25
    condition: price > 25
  - id: FLOAT_OVER_20M
    condition: float_m > 20
  - id: STOP_OVER_15_PCT
    condition: stop_pct > 0.15
  - id: POSITION_OVER_2000
    condition: dollar_size > 2000
  - id: SAME_SECTOR_OPEN
    condition: open_position_in_same_sector
  - id: OUTSIDE_TRADING_WINDOW
    condition: current_time < 06:00 ET OR current_time > 12:00 ET   # 6am-noon window (operator 2026-06-26)
  - id: REVERSE_SPLIT_RECENT
    condition: reverse_split_within_90d
    action: manual_review  # SQUEEZE lane — Entry Desk only, never auto GO (Ross alignment 2026-07)
  - id: HIGH_RVOL_WAIT
    condition: decision == WAIT AND rvol >= 8.0
    action: manual_review  # RUNNER lane — high-RVOL momentum, Entry Desk only (Ross alignment 2026-07)
  - id: MICRO_FLOAT_RVOL
    condition: float_m < 1.0 AND rvol > 5.0 AND NOT (float_m < 0.5 AND rvol > 50)
    action: manual_review  # MICRO lane — low-float momentum, Entry Desk only (Ross alignment 2026-07)
  - id: LOW_PRICE_SPIKE
    condition: price < 2.0 AND change_pct > 30 AND NOT (float_m < 0.5 AND rvol > 50)
    action: manual_review  # LOW lane — sub-$2 squeeze, Entry Desk only (Ross alignment 2026-07)
  - id: CATALYST_EXCEPTION_RUNNER
    condition: setup_class IN (squeeze, high_rvol_runner, micro_float_runner, momentum_runner, low_price_runner)
    action: manual_review  # Catalyst optional — grade cap B, never auto-GO (Ross alignment 2026-07)
  - id: TRADING_HALTED
    condition: trading_halt_active
  - id: WIDE_SPREAD
    condition: spread_pct > 5
  - id: DILUTION_RISK
    condition: recent_offering_or_shelf
scoring_weights:
  catalyst: 15
  rvol: 12
  price_action: 10
  float: 8
  price_range: 5
  sector_momentum: 5
grade_thresholds:
  aplus: 48
  a: 42
  b: 35
  c: 28
minimum_evidence:
  required:
    - price_data
    - rvol_data
    - float_data
    - trade_plan
    - stop_defined
  preferred:
    - catalyst_verified
    - intel_readiness_score
    - sector_data
recommendation_rules:
  social_only_catalyst: WATCH
  unverified_catalyst_max: WAIT
  verified_catalyst_high_rvol: GO
  all_evidence_present_aplus: APPROVAL_REQUIRED
agent_responsibilities:
  maria: Verify catalyst source and relevance. Check for contrary news.
  risk: Verify entry zone, stop placement, R:R ratio. Check for technical traps.
  steph: Verify position sizing and account fit. Confirm no wash sale risk.
# Canonical operator-facing taxonomy: VALIDATION execution (sandbox/simulated sample collection).
# The legacy `paper_trade_rules` block below is a deprecated alias kept for backward compatibility.
validation_execution:
  enabled: true
  mode: sandbox_simulated
  approval_required: false                 # deterministic gates replace human validation approval
  deterministic_gates_required: true
  account: alpaca_paper                    # sandbox account identifier (legacy storage)
  account_label: sandbox_validation
  submit_mode: validation_fast_path
  legacy_storage: paper_trades
  legacy_submitter: proposal_paper_submitter
paper_trade_rules:
  deprecated_alias_for: validation_execution   # legacy alias — see validation_execution above
  use_same_plan_as_live: true
  log_entry_slippage: true
  log_max_adverse_excursion: true
  auto_exit_at_close: true
  paper_approval_required: false           # legacy alias of validation_execution.approval_required
  deterministic_gates_required: true
  allowed_account: alpaca_paper
  submit_mode: validation_fast_path
live_trade_rules:
  max_position_size: 2000
  max_dollar_risk: 200
  no_overnight_hold: true
  require_risk_gate_approved: true
outcome_learning_fields:
  - entry_slippage
  - stop_hit_before_target
  - target_hit_time
  - max_adverse_excursion
  - catalyst_type
  - rvol_at_entry
  - float_at_entry
  - time_of_entry
  - sector
  - vix_at_entry
sub_strategies:
  high_rvol_verified:
    description: RVOL >8x + verified catalyst
    expected_win_rate: 0.65
    filters:
      min_rvol: 8.0
      catalyst_verified: true
  moderate_rvol_verified:
    description: RVOL 5-8x + verified catalyst
    expected_win_rate: 0.55
    filters:
      min_rvol: 5.0
      max_rvol: 8.0
      catalyst_verified: true
  high_rvol_unverified:
    description: RVOL >8x + unverified catalyst
    expected_win_rate: 0.45
    filters:
      min_rvol: 8.0
      catalyst_verified: false
  social_confirmed:
    description: Social surge + Finviz confirmation
    expected_win_rate: 0.5
    filters:
      source: social_confirmed
entry_criteria:
  - id: CATALYST_VERIFIED
    description: "Verified catalyst (news, SEC filing, or institutional event) — not social-only"
    metric: catalyst_verified
    operator: eq
    value: true
  - id: RVOL_SURGE
    description: Relative volume at least 5x 20-day average
    metric: rvol
    operator: gte
    value: 5.0
  - id: PRICE_RANGE
    description: Price between $1 and $25 (preferred under $10)
    metric: price
    operator: between
    value:
      - 1.0
      - 25.0
  - id: FLOAT_LOW
    description: Float under 20M shares (preferred under 10M)   # aligned to screen_filters.max_float_m (P0-3)
    metric: float_m
    operator: lte
    value: 20
  - id: ENTRY_WINDOW
    description: Current time within intraday_execution window (06:00–12:00 ET)   # aligned to intraday_execution (P0-3)
    metric: current_time_et
    operator: lte
    value: 720   # 12:00 ET in minutes-from-midnight (matches intraday_execution.trading_window_et.end)
exit_rules:
  # Layered stop methodology — MOMENTUM_SCALP_STOP_AND_TRAIL_POLICY (2026-06-29).
  # Executable stop comes from the proposal/screener; broker_strategy_resolver only fills a MISSING stop.
  stop_method: level_based        # L1 = structure-anchored (resolver: stop below support); was fixed_pct
  stop_max_pct: 0.08              # fallback cap only (no structural stop) — tightened 0.15->0.08 for scalps
  target_method: trailing         # TARGET trail (profit target), NOT the protective stop trail (L3, off below)
  intraday_exit_required: true
  no_overnight_hold: true
  # ── Layered methodology (L1/L2 active; L3 protective trailing GATED OFF — advisory/monitoring) ──
  layered_stop:
    layer1_initial:
      method: atr_structure_hybrid   # recent swing structure OR 0.8-1.5x ATR(14), whichever tighter
      max_atr_mult: 1.5
      max_initial_risk_r: 1.2
    layer2_breakeven:
      enabled: true
      trigger_r: 1.2                 # move stop to breakeven at +1.0-1.5R (mandatory)
      offset_r: 0.0
    layer3_trailing:
      enabled: false                 # GATED OFF — backtest + 27-config sweep net-negative for momentum
      reason: "Chandelier/ATR trailing truncates the momentum fat tail (delta -0.13..-0.87R) — policy section 2"
      method: chandelier             # params kept for advisory/replay (Stop Intelligence panel) only
      activation_r: 1.5
    layer4_dynamic:                  # MOMENTUM_SCALP_STOP_AND_TRAIL_POLICY section 3 Layer-4 / section 4 alerts
      enabled: true                  # ADVISORY (paper): suggests tightens; paper trades can auto-apply, real = advisory
      regime_shift_tighten_atr: 0.5  # Trending -> Ranging in-trade: tighten active trail by 0.5x ATR (section 3 #1)
      heat_tighten_pct: 3.5          # aggregate open risk > 3.5% -> global tighten-all + pause entries (section 3 #2 / section 4 Red)
      heat_tighten_atr: 0.5          # amount to tighten each active trail by on the heat rule
      trending_tokens: [trend, "risk on", momentum, bull]   # entry/current regime classified trending if it contains any
      ranging_tokens: [rang, chop, neutral, "risk off", defensive, bear]  # ...ranging/adverse if any
lifecycle:
  # P0-3: intraday_execution.proposal_ttl_minutes is the SINGLE SOURCE OF TRUTH for proposal TTL.
  # The old proposal_expiry_hours:4 contradicted the 30-minute scalp TTL and is removed.
  proposal_expiry_minutes: 30
  source_of_truth: intraday_execution.proposal_ttl_minutes
  overnight_allowed: false
  max_hold_days: 0
risk:
  risk_per_trade_pct: 0.002
  max_position_size: 2000
  max_daily_trades: 3
  target_rr: 2.0
  # MOMENTUM_SCALP_STOP_AND_TRAIL_POLICY section 7 — kill switches (consumed by the monitoring layer)
  max_initial_risk_r: 1.2
  max_concurrent_scalps: 3
  daily_loss_limit_r: 3.0
  portfolio_heat_tighten_pct: 3.5   # section 4: Red global tighten + pause new entries (soft, reversible)
  portfolio_heat_kill_pct: 4.5      # section 7: hard kill switch — pause all new entries
  paper_account_equity: 100000      # paper-account nominal — heat % denominator (edit to match the paper book)
co_enables:
  promotes_to:
    - swing_breakout
  strengthens:
    - gap_and_go
  notes: Successful intraday momentum runners can incubate into multi-day swing setups.
validation_gate:
  min_closed_validation_trades: 30
  min_closed_paper_trades: 30                              # legacy alias of min_closed_validation_trades
  min_win_rate: 0.5
  min_profit_factor: 1.3
  min_calendar_months: 6
  human_approval_required: true                            # retained (back-compat)
  # Validation sample collection is deterministic/gate-based (no human validation approval); PROMOTION off
  # TESTING and any LIVE use still require human/operator review + the existing 2FA path.
  validation_approval_required_for_sample_collection: false
  paper_approval_required_for_sample_collection: false    # legacy alias
  human_promotion_review_required: true
  human_approval_required_for_promotion: true             # legacy alias
# LIVE execution requires the existing operator confirmation / two-factor (2FA) path — UNCHANGED
# and out of scope. The validation fast-path above never touches live.
live_execution_policy:
  operator_confirmation_required: true
  two_factor_required: true
  autonomous_live_trading: false
prompt_context:
  summary: Intraday momentum scalp on micro-cap names with verified catalyst and RVOL surge. Strict same-day exit, taxable account only.
  key_questions:
    - Is the catalyst verified or social-only?
    - Is RVOL holding above 5x or fading?
    - Are we within the entry window (inside 06:00–12:00 ET)?
vix_rules:
  max_vix_for_entry: 25
  elevated_vix_band:
    - 22
    - 35
  elevated_vix_changes:
    position_size_multiplier: 0.5
    require_aplus_grade: true
    require_catalyst_verified: true
  extreme_vix_threshold: 35
  extreme_vix_action: pause_new_entries
  exit_holdings_at_vix: 40
  notes: "Micro-cap momentum is most vulnerable to VIX expansion — pause aggressively."
technical_indicators_required:
  gates:
    - id: VWAP_RECLAIM
      condition: price > vwap (intraday)
      metric: price_vs_vwap
      operator: gt
      value: 0
    - id: EMA_9_ABOVE_EMA_21
      condition: EMA(9) > EMA(21) on 5-min
      metric: ema_9_minus_ema_21
      operator: gt
      value: 0
    - id: OPENING_RANGE_BREAK
      condition: price > opening 15-min high
      metric: price_vs_or_high
      operator: gt
      value: 0
  preferred:
    - rvol_5min
    - rsi_5
    - atr_pct
    - premarket_high_distance
  irrelevant:
    - ema_200
    - fib_618_distance
    - bollinger_squeeze
performance_context:
  last_updated: '2026-06-28T06:30:03+00:00'
  closed_paper_trades: 3
  win_rate: 0.3333
  avg_r_realized: 1.0167
  profit_factor: 1.2858
  max_drawdown_pct:
  expectancy_per_trade: 0.3389
  best_trade_r: 3.19
  worst_trade_r: -0.14
  current_streak:
  ready_for_review: false
  review_thresholds:
    min_trades: 30
    min_months: 6
    min_profit_factor: 1.25
    min_win_rate: 0.5
  notes: Populated nightly by scripts/paper_performance_governance.py. Used by LLM prompts to evaluate proposal context.
freshness:
  bucket: SAME_DAY
  ttl_hours: 4
  eval_cadence: none
  watchpool: false
