required_fields:
  - strategy_id
  - display_name
  - version
  - status
  - purpose
  - eligible_accounts
  - timeframe
  - timeframe_class
  - universe
  - entry_criteria
  - auto_disqualifiers
  - exit_rules
  - risk
  - scoring
  - lifecycle
  - execution
  - agent_responsibilities
  - co_enables
  - validation_gate
  - prompt_context

valid_statuses:
  - UNVALIDATED
  - TESTING
  - VALIDATED
  - PAUSED
  - KILLED

valid_timeframe_classes:
  - INTRADAY
  - SHORT_SWING
  - MEDIUM_SWING
  - POSITION
  - CASH

valid_operators:
  - gte
  - lte
  - gt
  - lt
  - eq
  - neq
  - in
  - exists

valid_actions:
  - PASS
  - WAIT
  - CAUTION
  - BLOCK
  - PAPER_ONLY

valid_missing_data_actions:
  - WARN
  - BLOCK
  - IGNORE
performance_context:
  last_updated: '2026-06-27T06:30:03+00:00'
  closed_paper_trades: 0
  win_rate:
  avg_r_realized:
  profit_factor:
  max_drawdown_pct:
  expectancy_per_trade:
  best_trade_r:
  worst_trade_r:
  current_streak:
  ready_for_review: false
  review_thresholds:
    min_trades: 30
    min_months: 6
    min_profit_factor: 1.25
    min_win_rate: 0.5
  notes: Populated nightly by scripts/paper_performance_governance.py. Used by LLM prompts to evaluate proposal context.

# Optional per-strategy GENERATION contract (auto_proposal_generator, 2026-09-28). All keys optional.
proposal_contract:
  hard_min_price: "float >= 1.0; overrides the 3.0 momentum default for this strategy only"
  require_analyst_coverage: "bool, default true; false is recorded as ANALYST_WAIVED_BY_CONTRACT"
  require_catalyst: "bool, default false; true -> SKIPPED_NO_CATALYST when neither catalyst text nor catalyst_verified"
  liquidity_prescreen: "dict merged over shared_risk_rules.liquidity_prescreen for this strategy"
  target_account: "accounts.account_label; must be mode=paper, else SKIPPED_ACCOUNT_NOT_PAPER"
