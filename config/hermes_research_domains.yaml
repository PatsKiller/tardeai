      - rate limit

  custom:
    description: >-
      Fallback for candidates that no registered domain claims. Everything
      here requires explicit classification before any promotion path opens.
    risk_level: variable
    allowed_candidate_types: [SOURCE_CANDIDATE, TREND_CANDIDATE, TICKER_CANDIDATE, TOPIC_CANDIDATE, CONNECTOR_CANDIDATE]
    promotion_paths: []
    requires_operator_for_promotion: true
    requires_classification: true
    classification_keywords: []
