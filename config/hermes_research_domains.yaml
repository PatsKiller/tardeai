      - gdp
      - cpi
      - unemployment
      - recession
      - treasury yield
      - yield curve
      - monetary policy
      - fiscal policy

  geopolitical:
    description: >-
      Geopolitical research (conflict, sanctions, trade policy, elections,
      supply-security events with market impact).
    risk_level: general
    allowed_candidate_types: [TOPIC_CANDIDATE, TREND_CANDIDATE, SOURCE_CANDIDATE]
