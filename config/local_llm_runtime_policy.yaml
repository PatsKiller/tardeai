# Local LLM runtime policy — ratifies exactly which models run locally on the Intel Arc Pro B50, how
# they're pinned, the backend, and the market-hours budget. Enforced by llm_budget_guard +
# local_llm_runtime_probe. No paid fallback; no local 31B fallback during market hours. No broker writes.

hardware:
  discrete_gpu:
    name: Intel Arc Pro B50
    vram_gb: 16
    required: true
    preferred_device_index:
      vulkan: 1            # GGML_VK_VISIBLE_DEVICES=1 → discrete B50 (device 0 = integrated Iris Xe)
      oneapi: discrete
  integrated_gpu:
    name: Intel Iris Xe
    allowed_for_llm_generation: false

runtime:
  production_backend: vulkan
  benchmark_backends: [vulkan, sycl_oneapi, ipex_llm]
  required_env:
    GGML_VK_VISIBLE_DEVICES: "1"
  optional_env:
    ONEAPI_DEVICE_SELECTOR: "level_zero:gpu"
    SYCL_CACHE_PERSISTENT: "1"

market_hours_policy:
  timezone: America/New_York
  window: "06:00-12:00"
  allowed_local_models: [gemma3:4b, gemma3:12b, qwen3:8b, nomic-embed-text]
  blocked_local_models: [gemma3:27b, gemma4-31b]
  no_paid_fallback: true
  no_local_31b_fallback: true

lanes:
  local_fast:
    model: gemma3:4b
    max_calls_per_5m: 20
    max_concurrent: 2
    max_latency_ms_target: 3000
  local_quality:
    model: gemma3:12b
    max_calls_per_5m: 8
    max_concurrent: 1
    max_latency_ms_target: 10000
  local_embed:
    model: nomic-embed-text
    protected: true
    max_concurrent: 1
    timeout_seconds: 90
  local_fallback_benchmark:
    model: qwen3:8b
    production_enabled: false       # benchmark/fallback only until measured-promoted
    benchmark_only: true

blocked_market_hour_models:
  - {model: gemma3:27b, reason: "exceeds safe local VRAM/context budget (17GB > 16GB)"}
  - {model: gemma4-31b, reason: "caused CPU-spill/load feedback loop; cloud-only or overnight-only"}
