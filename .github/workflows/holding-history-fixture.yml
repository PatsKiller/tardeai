name: holding-history-fixture
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/holding-history-fixture.yml'
      - 'apps/command-center-v3/src/components/tradeinview/HoldingHistory*'
      - 'apps/command-center-v3/src/lib/holdingHistoryModel*'
      - 'apps/command-center-v3/e2e/holding-history.spec.ts'
      - 'apps/command-center-v3/e2e/fixtures/holdingHistory.fixture.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holding-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  holding-history-proof:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types src/lib/holdingHistoryModel.test.ts
      - run: npm run build
      - name: Actual HoldingHistory states and URL interactions without a server
        env:
          HISTORY_SHOTS_DIR: ${{ runner.temp }}/holding-history
        run: npx playwright test e2e/holding-history.spec.ts --project=chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holding-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/holding-history/
            apps/command-center-v3/test-results/
          if-no-files-found: error
