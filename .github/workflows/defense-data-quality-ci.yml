name: defense-data-quality-ci

on:
  pull_request:
    paths:
      - 'scripts/defense_data_quality.py'
      - 'tests/test_defense_data_quality.py'
      - '.github/workflows/defense-data-quality-ci.yml'

permissions:
  contents: read

jobs:
  quality-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/defense_data_quality.py tests/test_defense_data_quality.py
      - name: Test
        run: python -m pytest -q tests/test_defense_data_quality.py
