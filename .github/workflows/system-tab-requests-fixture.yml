name: system-tab-requests-fixture
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/system-tab-requests-fixture.yml'
      - 'apps/command-center-v3/src/pages/SystemHub.tsx'
      - 'apps/command-center-v3/src/lib/systemTabModel*'
      - 'apps/command-center-v3/src/hooks/useApi.ts'
      - 'apps/command-center-v3/e2e/system-tab-requests.fixture.mjs'
      - 'apps/command-center-v3/e2e/fixtures/systemTabRequests.fixture.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-tab-requests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  system-tab-proof:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Actual component requests, polling and URL history on synthetic responses
        run: node e2e/system-tab-requests.fixture.mjs "$RUNNER_TEMP/system-tab-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-tab-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-tab-proof/
          if-no-files-found: error
