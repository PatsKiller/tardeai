name: aif-financial-senses-integration-ci

# Governed AIF ↔ Financial Senses integration. READ_ONLY_ADVISORY.
# No broker writes, no Telegram, no production mutation.
# pull_request has no path filter so the job always reports (never pending).

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Push policy v2 (2026-10-23): a new push to a PR supersedes the run in flight; a push to main gets
# one group per SHA so a merged SHA is never left without CI evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aif-financial-senses-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TRADE_AI_CI: "1"
      CIO_TELEGRAM_INTERDICT: "1"
      ENABLE_TELEGRAM: "0"
      ALPACA_MODE: paper
      MEMORY_BEHAVIOR_INFLUENCE: "0"
      AIF_FINANCIAL_SENSES_SHADOW: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          # requests: tests/test_autonomy_watchdog.py exercises telegram_transport,
          # which imports it. Without it the transport tests error at import.
          pip install pytest pyyaml requests

      - name: Integration CI (pinned manifest)
        run: python3 scripts/run_aif_financial_senses_ci.py

      - name: Every script compiles (repo-wide)
        # Deliberately FIRST and on this workflow: it has no paths filter, so it
        # runs on every push. A compile guard behind a paths filter would have
        # missed aa21559c, which broke a script by editing a DIFFERENT concern
        # (a NO_CONSUMER_REASON declaration) and left it unrunnable for 10 hours
        # while its numbers were still quoted as current state.
        run: python3 -m pytest -q --tb=line tests/test_every_script_compiles.py

      - name: Financial Senses suite
        run: python3 -m pytest -q --tb=line tests/financial_senses

      - name: AIF critical suite
        run: python3 -m pytest -q --tb=line tests/test_agent_intelligence_adversarial.py tests/test_agent_intelligence_failure_injection.py tests/test_agent_intelligence_integration.py

      - name: Durable memory + maturity programs
        run: python3 -m pytest -q --tb=line tests/test_agent_durable_memory.py tests/test_advisory_influence.py tests/test_maturity_control_plane.py tests/test_autonomy_watchdog.py tests/test_cio_investment_product.py

      - name: Schwab write policy (source-only)
        run: python3 scripts/validate_schwab_write_policy.py --source-only

      - name: Release readiness (source-only)
        run: python3 scripts/run_release_ci_equivalent.py --source-only
