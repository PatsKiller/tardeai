name: desks-a-fixture
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/desks-a-fixture.yml'
      - 'apps/command-center-v3/e2e/desks-a.fixture.mjs'
      - 'apps/command-center-v3/e2e/fixtures/desksA.fixture.json'
      - 'apps/command-center-v3/src/pages/desks/**'
      - 'apps/command-center-v3/src/components/DeskBoard.tsx'
      - 'apps/command-center-v3/src/components/DeskPage.tsx'
      - 'apps/command-center-v3/src/components/W7DetailSheet.tsx'
      - 'apps/command-center-v3/src/pages/AgentsHub.tsx'
      - 'apps/command-center-v3/src/components/BacktestPanel.tsx'
      - 'apps/command-center-v3/src/components/ExecutionHypothesesPanel.tsx'
      - 'apps/command-center-v3/src/hooks/useApi.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desks-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desk-fixtures:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Boards 1-4 desks — taps at 412/390, sheets with Back, deep links, gaps, no mutation
        run: node e2e/desks-a.fixture.mjs "$RUNNER_TEMP/desks-a"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desks-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desks-a/
          if-no-files-found: error
