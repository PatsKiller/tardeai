name: cio-production-hardening-ci

# Phase 10 — required gates for Investment Office / Alex CIO hardening.
# READ_ONLY_ADVISORY: no broker writes, no live Telegram (pytest interdict).

on:
  # Post-merge: EVERY registered test (fast profile) on every push to main. A red
  # run opens/updates a `ci-main-red` issue (job main-red-alert) instead of
  # blocking PRs. Until 2026-09-25 push ran only on 11 CIO paths and on wt/**,
  # hardening/**, feat/** branches -- a second copy of each PR run.
  push:
    branches: ["main"]
  pull_request:
    # `cio-hardening` is a required status check on main. A path filter here
    # would let unrelated PRs skip the job and leave the check "Pending",
    # blocking merge. Run on every PR so the required check is always reported.
  workflow_dispatch:
  # Nightly isolation run of the FULL (serial) profile -- see cio-hardening-full.
  schedule:
    - cron: "17 7 * * *"

# A new push to a PR branch supersedes the run in flight; main runs never cancel.
concurrency:
  group: cio-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cio-hardening:
    # Required status check. Operator budget (2026-09-25): 5 minutes wall clock
    # including runner setup. On pull_request it runs the PR profile: smoke gates,
    # every gate of each HIGH risk tier the diff touches, changed and impacted
    # tests within budget; the rest is DEFERRED to the push-to-main run and listed
    # in the job summary (scripts/lib/test_impact.py, config/ci_risk_tiers.json).
    # On push/dispatch it runs the FAST profile: every registered gate, in a worker
    # pool. Measured before 2026-09-25: 1,077-1,127 s per job, 610-1,090 s in the
    # serial gates step.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRADE_AI_CI: "1"
      CIO_TELEGRAM_INTERDICT: "1"
      ENABLE_TELEGRAM: "0"
      ALPACA_MODE: paper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests
          # Optional render smoke deps (fail-soft if unavailable)
          pip install python-docx || true
          # agent_governance_sop requires pinned Ruff (quality + toolchain tests).
          # Never optional: missing Ruff must fail closed, not skip.
          pip install "ruff==0.16.2"
          python3 - <<'PY'
          from scripts.lib.sop_toolchain import PINNED_RUFF_VERSION, resolve_ruff_bin, ruff_version_string
          b = resolve_ruff_bin()
          assert b is not None, "ruff missing after pip install"
          raw = ruff_version_string(b)
          assert PINNED_RUFF_VERSION in raw, raw
          print("cio_hardening_ruff_ok", b, raw)
          PY

      - name: CIO hardening gates (unit + manifest)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/run_cio_hardening_ci.py --profile pr --base "origin/$BASE_REF"
          else
            python3 scripts/run_cio_hardening_ci.py --profile fast
          fi

      - name: Phase 11 adversarial suite
        run: python3 scripts/run_cio_adversarial_suite.py

      # A versioned contract with no caller is this codebase's recurring defect:
      # the artifact passes its own tests, so nothing reports a problem. Fails
      # only on a NEW one -- the 29 inherited are named in KNOWN_DARK.
      - name: Dark contract guard (no new uncalled versioned schema)
        run: python3 scripts/check_dark_contracts.py --fail-on-new

      # A "preserve CRLF" helper double-converted an already-CRLF file on
      # 2026-08-27: \r\n became \r\r\n across 783 lines. Python parsed it and
      # the tests passed; the only symptom was an implausible insertion count.
      - name: Line-ending churn guard
        run: python3 scripts/check_line_endings.py --range origin/main...HEAD

      # The hardening runner uses an explicit allowlist: 49 of 1,009 test files,
      # so every green run reported on 4.9% of the suite and said nothing about
      # the rest. Discovery cannot simply be switched on -- the unlisted suite
      # does not pass and six files cannot be imported at all. The gap is made
      # visible and bounded instead: today's unlisted set is a named baseline
      # that may shrink, and a NEW unlisted test file fails here.
      - name: Test coverage guard (no new test file outside CI)
        run: python3 scripts/check_test_coverage.py --fail-on-new

      # A test that reads /home/johnclaw/trade-ai-releases (or the dev tree) by
      # absolute path tests the host, not the code: PR #1234 went red on its own
      # head when an unrelated release was promoted (2026-09-25). New ones fail.
      - name: Test host-path guard (no new live-host paths in tests)
        run: python3 scripts/check_test_host_paths.py --fail-on-new

      - name: Report HTML export smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats
          model = build_report_v2(
              part_b_ctx={
                  "portfolio": {"total_value": 100000.0, "cash_value": 20000.0, "cash_pct": 20.0},
                  "allocation": {"Cash & Equivalents": 20000.0, "Equities": 80000.0},
                  "performance": {"ytd_return": 1.0, "port_cagr": 5.0},
              },
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 100000.0, "cash_total_usd": 20000.0,
                  "cash_reserved_usd": 20000.0, "cash_investable_usd": 0.0,
                  "net_recommended_deploy_usd": 0.0, "net_recommended_raise_usd": 0.0,
                  "post_plan_cash_usd": 20000.0, "position_decisions": [],
              }},
              source_sha="ci",
              now=datetime.now(timezone.utc),
          )
          out = Path("exports/ci_smoke")
          res = export_report_formats(model, out, basename="ci_smoke", formats=["html"])
          assert res.get("paths", {}).get("html"), res
          html = Path(res["paths"]["html"]).read_text()
          assert "578107.50%" not in html
          assert "READ_ONLY_ADVISORY" in html
          print("HTML smoke OK", res["paths"]["html"])
          PY

      - name: DOCX smoke (optional)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          try:
              import docx  # noqa: F401
          except ImportError:
              print("python-docx not installed — skip DOCX smoke")
              raise SystemExit(0)
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats
          model = build_report_v2(
              part_b_ctx={"portfolio": {"total_value": 1.0, "cash_value": 0.5},
                          "allocation": {"Cash & Equivalents": 0.5, "Equities": 0.5}},
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 1.0, "cash_total_usd": 0.5,
                  "cash_reserved_usd": 0.2, "cash_investable_usd": 0.3,
                  "net_recommended_deploy_usd": 0, "net_recommended_raise_usd": 0,
                  "post_plan_cash_usd": 0.5, "position_decisions": [],
              }},
              source_sha="ci", now=datetime.now(timezone.utc),
          )
          res = export_report_formats(model, Path("exports/ci_smoke"), basename="ci_docx", formats=["html","docx"])
          assert res.get("paths", {}).get("docx") or res.get("errors", {}).get("docx")
          print("DOCX smoke:", res.get("paths", {}).get("docx"), res.get("errors"))
          PY

      - name: PDF smoke (optional — needs chromium/weasyprint)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats, has_pdf_renderer
          if not has_pdf_renderer():
              print("No PDF renderer in CI image — skip")
              raise SystemExit(0)
          model = build_report_v2(
              part_b_ctx={"portfolio": {"total_value": 1.0, "cash_value": 0.5},
                          "allocation": {"Cash & Equivalents": 0.5, "Equities": 0.5}},
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 1.0, "cash_total_usd": 0.5,
                  "cash_reserved_usd": 0.2, "cash_investable_usd": 0.3,
                  "net_recommended_deploy_usd": 0, "net_recommended_raise_usd": 0,
                  "post_plan_cash_usd": 0.5, "position_decisions": [],
              }},
              source_sha="ci", now=datetime.now(timezone.utc),
          )
          res = export_report_formats(model, Path("exports/ci_smoke"), basename="ci_pdf", formats=["html","pdf"])
          print("PDF smoke:", res.get("paths", {}).get("pdf"), res.get("errors"))
          PY

      - name: Upload CIO CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-evidence
          path: |
            docs/investment-office/RELEASE_MANIFEST.md
            docs/investment-office/RELEASE_MANIFEST.json
            exports/ci_smoke/
          if-no-files-found: ignore

  # The historical one-gate-at-a-time run. Same gates, same tail checks, as the
  # isolation reference: a test green in one profile and red in the other has a
  # hidden dependency on ordering or shared state. Not required (it is the slow
  # one); nightly and on demand.
  cio-hardening-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRADE_AI_CI: "1"
      CIO_TELEGRAM_INTERDICT: "1"
      ENABLE_TELEGRAM: "0"
      ALPACA_MODE: paper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests
          pip install python-docx || true
          pip install "ruff==0.16.2"
      - name: CIO hardening gates (full, serial)
        run: python3 scripts/run_cio_hardening_ci.py --profile full

  # A red post-merge or nightly run must be SEEN without blocking every open PR:
  # open (or comment on) one `ci-main-red` issue. The PR check stays fast; main
  # carries the full suite and this alarm.
  main-red-alert:
    needs: [cio-hardening, cio-hardening-full]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.cio-hardening.result == 'failure' || needs.cio-hardening-full.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Open or update the ci-main-red issue
        run: |
          gh label create ci-main-red --color B60205 --description "cio-hardening red on main (post-merge/nightly)" --force
          body="cio-hardening failed on main ($EVENT_NAME) at $SHA: $RUN_URL"
          n="$(gh issue list --label ci-main-red --state open --json number --jq '.[0].number')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --label ci-main-red --title "cio-hardening red on main" --body "$body"
          fi
