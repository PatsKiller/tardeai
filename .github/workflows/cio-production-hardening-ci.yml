name: cio-production-hardening-ci

# Phase 10 — required gates for Investment Office / Alex CIO hardening.
# READ_ONLY_ADVISORY: no broker writes, no live Telegram (pytest interdict).

on:
  # Post-merge: EVERY registered test (fast profile) on every push to main. A red
  # run opens/updates a `ci-main-red` issue (job main-red-alert) instead of
  # blocking PRs. Until 2026-09-25 push ran only on 11 CIO paths and on wt/**,
  # hardening/**, feat/** branches -- a second copy of each PR run.
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # `cio-hardening` is a required status check on main. A path filter here
    # would let unrelated PRs skip the job and leave the check "Pending",
    # blocking merge. Run on every PR so the required check is always reported.
  workflow_dispatch:
  # 2026-10-21 (alignment audit H1): the nightly moved to cio-full-suite-sharded.yml (schedule
  # "17 7 * * *"). The serial `full` profile was cancelled at its 40-minute timeout on 8 of the
  # last 10 nights (e.g. run 39563068389) and nothing alerted; the sharded suite covers every
  # registered file plus the Postgres shard in a median 6 minutes. cio-hardening-full stays
  # available on workflow_dispatch as the isolation reference.

# Default token access is read-only; jobs that need a narrower write scope declare it locally.
permissions:
  contents: read

env:
  TRADE_AI_CI: "1"
  CIO_TELEGRAM_INTERDICT: "1"
  ENABLE_TELEGRAM: "0"
  ALPACA_MODE: paper
  # The shard count. The matrix lists 0..CIO_SHARDS-1; cio-hardening verifies all of them.
  CIO_SHARDS: "8"
  # Test the PR HEAD commit itself (not the synthetic refs/pull/N/merge), as before.
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# A new push to a PR branch supersedes the run in flight (group per ref, cancel-in-progress).
# Push-to-main runs get ONE GROUP PER SHA (2026-10-21, alignment audit H2). With a group per ref,
# cancel-in-progress=false only protects the RUNNING run: GitHub keeps one PENDING run per group,
# so a third merge cancelled the queued one (main runs 39617949518, 39609079036, 39608294713 were
# cancelled 1-5 min after creation) and that merged SHA never got main CI evidence. Schedule and
# dispatch keep the per-ref group.
concurrency:
  group: cio-hardening-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── cio-hardening, split into parallel jobs (2026-10-23) ─────────────────────────────────────
  # Measured before this change (gh, 2026-10-23): the single job took 27-39 min on push to main
  # (median about 37) and 28-38 min on the release-batch PRs (39968620315, 39994133076,
  # 40001978010), whose large diff made the PR profile select almost every gate. One step,
  # "CIO hardening gates", was about 97% of the job. A release waited on it twice: PR, then the
  # exact-main push. It is now the cio-full-suite-sharded pattern on EVERY event: 8
  # duration-balanced shards x 4 workers, the serial shard, the Postgres shard and the integrity
  # rails, in parallel. The required context `cio-hardening` (below) keeps its name and is the
  # aggregate: green only when every one of these jobs succeeded AND the shard manifests prove each
  # registered file ran exactly once on this tree and plan (run_cio_hardening_ci.py
  # --verify-shards). A registered file that no shard ran, or that is missing from disk, fails it.
  # Supersedes #1943 (push-only split). Draft PRs run none of these (push policy v2, #2032).
  cio-shard:
    name: hardening shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/cio-production-hardening-ci.yml
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests "ruff==0.16.2"
          # Attestation tests require the production-locked Ed25519 backend.
          pip install -c requirements.lock.txt cryptography
          pip install python-docx || true
          # agent_governance_sop requires pinned Ruff (quality + toolchain tests). Never optional:
          # missing Ruff must fail closed, not skip.
          python3 - <<'PY'
          from scripts.lib.sop_toolchain import PINNED_RUFF_VERSION, resolve_ruff_bin, ruff_version_string
          b = resolve_ruff_bin()
          assert b is not None, "ruff missing after pip install"
          raw = ruff_version_string(b)
          assert PINNED_RUFF_VERSION in raw, raw
          print("cio_hardening_ruff_ok", b, raw)
          PY
      - name: Install registered frontend test dependencies
        uses: ./.github/actions/setup-cio-frontend-tests
        with:
          shard: ${{ matrix.shard }}/${{ env.CIO_SHARDS }}
      - name: Shard ${{ matrix.shard }} of ${{ env.CIO_SHARDS }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/run_cio_hardening_ci.py --jobs 4 \
            --shard "$SHARD/$CIO_SHARDS" --shard-out "$RUNNER_TEMP/shard/cio_shard_$SHARD.json"
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore

  cio-serial:
    name: hardening shard serial
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/cio-production-hardening-ci.yml
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests "ruff==0.16.2"
          pip install -c requirements.lock.txt cryptography
          pip install python-docx || true
          # agent_governance_sop requires pinned Ruff (quality + toolchain tests). Never optional:
          # missing Ruff must fail closed, not skip.
          python3 - <<'PY'
          from scripts.lib.sop_toolchain import PINNED_RUFF_VERSION, resolve_ruff_bin, ruff_version_string
          b = resolve_ruff_bin()
          assert b is not None, "ruff missing after pip install"
          raw = ruff_version_string(b)
          assert PINNED_RUFF_VERSION in raw, raw
          print("cio_hardening_ruff_ok", b, raw)
          PY
      - name: Install registered frontend test dependencies
        uses: ./.github/actions/setup-cio-frontend-tests
        with:
          shard: serial/${{ env.CIO_SHARDS }}
      - name: Serial shard (shared-state files, one at a time)
        run: |
          python3 scripts/run_cio_hardening_ci.py \
            --shard "serial/$CIO_SHARDS" --shard-out "$RUNNER_TEMP/shard/cio_shard_serial.json"
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-shard-serial-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore

  cio-pg:
    name: hardening shard pg
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The isolated M2 test cluster the m2_conn tests expect (the same service as job `pg` in
      # cio-full-suite-sharded.yml). These are the repository's public throwaway test-cluster
      # values, not credentials of any live system.
      m2:
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: m2
          POSTGRES_PASSWORD: m2shadow
          POSTGRES_DB: m2_shadow_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U m2 -d m2_shadow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      M2_TEST_DATABASE: m2_shadow_test
      M2_TEST_DB: "1"
      ALERT_TEST_DSN: postgresql://m2:m2shadow@127.0.0.1:55432/m2_shadow_test_alerts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/cio-production-hardening-ci.yml
      - name: Install test deps (+ psycopg2)
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests "ruff==0.16.2" psycopg2-binary
          # agent_governance_sop requires pinned Ruff (quality + toolchain tests). Never optional:
          # missing Ruff must fail closed, not skip.
          python3 - <<'PY'
          from scripts.lib.sop_toolchain import PINNED_RUFF_VERSION, resolve_ruff_bin, ruff_version_string
          b = resolve_ruff_bin()
          assert b is not None, "ruff missing after pip install"
          raw = ruff_version_string(b)
          assert PINNED_RUFF_VERSION in raw, raw
          print("cio_hardening_ruff_ok", b, raw)
          PY
      - name: Create the test databases (fail closed if the service is unreachable)
        run: |
          python3 scripts/ensure_m2_test_database.py --name "$M2_TEST_DATABASE"
          python3 scripts/ensure_m2_test_database.py --name m2_shadow_test_alerts
      - name: Install registered frontend test dependencies
        uses: ./.github/actions/setup-cio-frontend-tests
        with:
          shard: pg/${{ env.CIO_SHARDS }}
      - name: Postgres shard (one pytest process + fresh alert database per file)
        run: |
          python3 scripts/run_cio_hardening_ci.py \
            --shard "pg/$CIO_SHARDS" --shard-out "$RUNNER_TEMP/shard/cio_shard_pg.json"
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-shard-pg-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore

  # The rails the single job ran after its gates (adversarial suite, dark contracts, retention,
  # line endings, test coverage, host paths), the runner's tail checks (docs index drift, committed
  # and candidate release manifest) and the report smokes -- in parallel with the shards.
  cio-integrity:
    name: hardening integrity rails
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/cio-production-hardening-ci.yml
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests "ruff==0.16.2"
          pip install -c requirements.lock.txt cryptography
          # Optional render smoke deps (fail-soft if unavailable)
          pip install python-docx || true

      - name: Phase 11 adversarial suite
        run: python3 scripts/run_cio_adversarial_suite.py

      # A versioned contract with no caller is this codebase's recurring defect:
      # the artifact passes its own tests, so nothing reports a problem. Fails
      # only on a NEW one -- the 29 inherited are named in KNOWN_DARK.
      - name: Dark contract guard (no new uncalled versioned schema)
        run: python3 scripts/check_dark_contracts.py --fail-on-new

      # 2026-10-07: retention is a governed surface. The four tax/brokerage tables sat on a
      # 180-day DELETE policy for months; the registry makes KEEP_FOREVER explicit and this
      # gate refuses a registry that deletes them, lacks a window, or carries unresolved rows.
      - name: Retention policy registry gate
        run: python3 scripts/check_retention_policy.py --fail-on-new

      # A "preserve CRLF" helper double-converted an already-CRLF file on
      # 2026-08-27: \r\n became \r\r\n across 783 lines. Python parsed it and
      # the tests passed; the only symptom was an implausible insertion count.
      - name: Line-ending churn guard
        run: python3 scripts/check_line_endings.py --range origin/main...HEAD

      # The hardening runner uses an explicit allowlist: 49 of 1,009 test files,
      # so every green run reported on 4.9% of the suite and said nothing about
      # the rest. Discovery cannot simply be switched on -- the unlisted suite
      # does not pass and six files cannot be imported at all. The gap is made
      # visible and bounded instead: today's unlisted set is a named baseline
      # that may shrink, and a NEW unlisted test file fails here.
      - name: Test coverage guard (no new test file outside CI)
        run: python3 scripts/check_test_coverage.py --fail-on-new

      # A test that reads /home/johnclaw/trade-ai-releases (or the dev tree) by
      # absolute path tests the host, not the code: PR #1234 went red on its own
      # head when an unrelated release was promoted (2026-09-25). New ones fail.
      - name: Test host-path guard (no new live-host paths in tests)
        run: python3 scripts/check_test_host_paths.py --fail-on-new

      # The runner's tail checks (run_cio_hardening_ci.py, every profile): they ran inside the
      # single job's gates step; a shard runs no tail, so they run here.
      - name: Docs index drift
        run: python3 scripts/report_docs_inventory.py --check-index
      - name: Committed release manifest integrity
        run: python3 scripts/cio_release_manifest.py check-committed
      - name: Candidate release manifest
        run: python3 scripts/cio_release_manifest.py candidate --out-dir "$RUNNER_TEMP/cio_manifest_candidate"

      - name: Report HTML export smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats
          model = build_report_v2(
              part_b_ctx={
                  "portfolio": {"total_value": 100000.0, "cash_value": 20000.0, "cash_pct": 20.0},
                  "allocation": {"Cash & Equivalents": 20000.0, "Equities": 80000.0},
                  "performance": {"ytd_return": 1.0, "port_cagr": 5.0},
              },
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 100000.0, "cash_total_usd": 20000.0,
                  "cash_reserved_usd": 20000.0, "cash_investable_usd": 0.0,
                  "net_recommended_deploy_usd": 0.0, "net_recommended_raise_usd": 0.0,
                  "post_plan_cash_usd": 20000.0, "position_decisions": [],
              }},
              source_sha="ci",
              now=datetime.now(timezone.utc),
          )
          out = Path("exports/ci_smoke")
          res = export_report_formats(model, out, basename="ci_smoke", formats=["html"])
          assert res.get("paths", {}).get("html"), res
          html = Path(res["paths"]["html"]).read_text()
          assert "578107.50%" not in html
          assert "READ_ONLY_ADVISORY" in html
          print("HTML smoke OK", res["paths"]["html"])
          PY

      - name: DOCX smoke (optional)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          try:
              import docx  # noqa: F401
          except ImportError:
              print("python-docx not installed — skip DOCX smoke")
              raise SystemExit(0)
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats
          model = build_report_v2(
              part_b_ctx={"portfolio": {"total_value": 1.0, "cash_value": 0.5},
                          "allocation": {"Cash & Equivalents": 0.5, "Equities": 0.5}},
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 1.0, "cash_total_usd": 0.5,
                  "cash_reserved_usd": 0.2, "cash_investable_usd": 0.3,
                  "net_recommended_deploy_usd": 0, "net_recommended_raise_usd": 0,
                  "post_plan_cash_usd": 0.5, "position_decisions": [],
              }},
              source_sha="ci", now=datetime.now(timezone.utc),
          )
          res = export_report_formats(model, Path("exports/ci_smoke"), basename="ci_docx", formats=["html","docx"])
          assert res.get("paths", {}).get("docx") or res.get("errors", {}).get("docx")
          print("DOCX smoke:", res.get("paths", {}).get("docx"), res.get("errors"))
          PY

      - name: PDF smoke (optional — needs chromium/weasyprint)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "scripts")
          from scripts.lib.cio_report_v2 import build_report_v2
          from scripts.lib.cio_report_render import export_report_formats, has_pdf_renderer
          if not has_pdf_renderer():
              print("No PDF renderer in CI image — skip")
              raise SystemExit(0)
          model = build_report_v2(
              part_b_ctx={"portfolio": {"total_value": 1.0, "cash_value": 0.5},
                          "allocation": {"Cash & Equivalents": 0.5, "Equities": 0.5}},
              part_a_inputs={"capital_plan": {
                  "portfolio_value_usd": 1.0, "cash_total_usd": 0.5,
                  "cash_reserved_usd": 0.2, "cash_investable_usd": 0.3,
                  "net_recommended_deploy_usd": 0, "net_recommended_raise_usd": 0,
                  "post_plan_cash_usd": 0.5, "position_decisions": [],
              }},
              source_sha="ci", now=datetime.now(timezone.utc),
          )
          res = export_report_formats(model, Path("exports/ci_smoke"), basename="ci_pdf", formats=["html","pdf"])
          print("PDF smoke:", res.get("paths", {}).get("pdf"), res.get("errors"))
          PY

      - name: Upload CIO CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-evidence-attempt-${{ github.run_attempt }}
          path: |
            docs/investment-office/RELEASE_MANIFEST.md
            docs/investment-office/RELEASE_MANIFEST.json
            exports/ci_smoke/
          if-no-files-found: ignore

  cio-hardening:
    # Required status check (the context name never changes): the AGGREGATE of the jobs above.
    # It fails unless every one of them succeeded (CI_GATE_NEEDS) and their manifests prove each
    # registered file ran exactly once on this tree and plan. A shard that fails, is cancelled or
    # hits its timeout makes this job fail, so main-red-alert (needs: cio-hardening) still fires on
    # failure, cancelled and timed_out.
    # History: one job measured 1,077-1,127 s before 2026-09-25, exceeded 20 min on 2026-10-11 (run
    # 38151425912), 26-38 min on 2026-10-22 (run 39817528884 cancelled at 35 min; raised to 50 in
    # #1934), 27-39 min on push and 28-38 min on release PRs on 2026-10-23.
    # The PR profile (run_cio_hardening_ci.py --profile pr) no longer runs in CI: on a release PR
    # it selected almost every gate in ONE job, slower than every gate in shards. It stays for
    # local use (scripts/fast_check.sh).
    needs: [cio-shard, cio-serial, cio-pg, cio-integrity]
    # Push/dispatch: always(), so a cancelled or timed-out shard gives a red aggregate (and so the
    # alert) instead of a skipped one. Pull request: !cancelled(), so a superseded PR run is
    # cancelled and never reported green; a draft PR runs nothing (push policy v2).
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'schedule' && always()) ||
      (github.event_name == 'pull_request' && !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: python3 -m pip install pyyaml
      - name: Download shard manifests
        uses: actions/download-artifact@v4
        with:
          # Keep every raw attempt in its own directory; the verifier selects the newest
          # attempt per shard, including older successful jobs not rerun by GitHub.
          # Aggregate timing artifacts must never match this pattern (they contain copies).
          pattern: cio-hardening-shard-*-attempt-*
          path: ${{ runner.temp }}/manifests
          merge-multiple: false
      - name: CIO hardening gates (every job passed; every registered file ran exactly once)
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/run_cio_hardening_ci.py --shards "$CIO_SHARDS" \
            --verify-shards "$RUNNER_TEMP/manifests" \
            --timings-out "$RUNNER_TEMP/timings/ci_shard_duration_hints.json"
      - name: Upload per-shard timings (duration-hint refresh)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cio-hardening-timings-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/timings/
            ${{ runner.temp }}/manifests/
          if-no-files-found: ignore

  # The historical one-gate-at-a-time run. Same gates, same tail checks, as the
  # isolation reference: a test green in one profile and red in the other has a
  # hidden dependency on ordering or shared state. Not required (it is the slow
  # one); on demand only since 2026-10-21 (the nightly is the sharded suite).
  cio-hardening-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRADE_AI_CI: "1"
      CIO_TELEGRAM_INTERDICT: "1"
      ENABLE_TELEGRAM: "0"
      ALPACA_MODE: paper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pyyaml requests
          pip install -c requirements.lock.txt cryptography
          pip install python-docx || true
          pip install "ruff==0.16.2"
      - name: Install registered frontend test dependencies
        uses: ./.github/actions/setup-cio-frontend-tests
      - name: CIO hardening gates (full, serial)
        run: python3 scripts/run_cio_hardening_ci.py --profile full

  # A red post-merge or nightly run must be SEEN without blocking every open PR:
  # open (or comment on) one `ci-main-red` issue. The PR check stays fast; main
  # carries the full suite and this alarm.
  # 2026-10-21 (alignment audit H1): a CANCELLED or TIMED-OUT main run is not green either. A
  # job that hits timeout-minutes reports `cancelled` to `needs`, so the old failure-only test
  # let 8 of 10 nightly timeouts pass silently. `timed_out` is listed too in case GitHub reports it.
  main-red-alert:
    needs: [cio-hardening, cio-hardening-full]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (contains(fromJSON('["failure","cancelled","timed_out"]'), needs.cio-hardening.result) ||
       contains(fromJSON('["failure","cancelled","timed_out"]'), needs.cio-hardening-full.result))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      R_FAST: ${{ needs.cio-hardening.result }}
      R_FULL: ${{ needs.cio-hardening-full.result }}
    steps:
      - name: Open or update the ci-main-red issue
        run: |
          gh label create ci-main-red --color B60205 --description "cio-hardening red on main (post-merge/nightly)" --force
          body="cio-hardening failed, timed out or was cancelled on main ($EVENT_NAME) at $SHA: $RUN_URL (cio-hardening=$R_FAST, cio-hardening-full=$R_FULL)"
          n="$(gh issue list --label ci-main-red --state open --json number --jq '.[0].number')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --label ci-main-red --title "cio-hardening red on main" --body "$body"
          fi
