name: defense-sectors-ui-ci

on:
  pull_request:
    paths:
      - 'apps/command-center-v3/src/pages/DefenseHub.tsx'
      - 'apps/command-center-v3/src/pages/SectorsHub.tsx'
      - 'apps/command-center-v3/src/components/FinvizSectorPanel.tsx'
      - 'apps/command-center-v3/src/components/rotation/**'
      - 'apps/command-center-v3/src/main.tsx'
      - 'apps/command-center-v3/src/defenseSectorsResponsive.css'
      - 'apps/command-center-v3/e2e/defense-render.spec.ts'
      - 'apps/command-center-v3/e2e/sectors-render.spec.ts'
      - 'apps/command-center-v3/package.json'
      - 'apps/command-center-v3/package-lock.json'
      - 'scripts/apply_defense_data_hardening.py'
      - 'scripts/defense_account_exposure.py'
      - 'scripts/defense_data_quality.py'
      - 'scripts/fund_lookthrough.py'
      - 'scripts/sector_momentum_engine.py'
      - 'scripts/finviz_industry_groups.py'
      - 'scripts/defense_recommendations.py'
      - 'scripts/defense_recommendations_v10.py'
      - 'config/defense_account_exposure.json'
      - 'config/industry_sector_map.json'
      - 'config/defense_recommendations.json'
      - 'config/fund_lookthrough.json'
      - 'tests/test_defense_account_exposure.py'
      - 'tests/test_defense_data_quality.py'
      - 'tests/test_defense_data_hardening_wiring.py'
      - 'tests/test_defense_recommendations_v10.py'
      - 'docs/architecture/DEFENSE_SECTORS_DATA_HARDENING_2026-07-24.md'
      - 'scripts/check_design_tokens.sh'
      - 'scripts/test_chip_scope.mjs'
      - '.github/workflows/defense-sectors-ui-ci.yml'

permissions:
  contents: read

jobs:
  test-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json

      - name: Compile and run focused backend tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q scripts/defense_account_exposure.py scripts/defense_data_quality.py scripts/sector_momentum_engine.py scripts/finviz_industry_groups.py scripts/defense_recommendations.py scripts/defense_recommendations_v10.py scripts/fund_lookthrough.py
          python -m pytest -q tests/test_defense_account_exposure.py tests/test_defense_data_quality.py tests/test_defense_data_hardening_wiring.py tests/test_defense_recommendations_v10.py

      - name: Install locked frontend dependencies
        working-directory: apps/command-center-v3
        run: npm ci

      - name: Run design-token guard
        id: design
        continue-on-error: true
        run: bash scripts/check_design_tokens.sh 2>&1 | tee /tmp/defense-design.log

      - name: Run chip-scope guard
        id: chips
        continue-on-error: true
        run: node scripts/test_chip_scope.mjs 2>&1 | tee /tmp/defense-chip.log

      - name: Run TypeScript compiler
        id: typescript
        continue-on-error: true
        working-directory: apps/command-center-v3
        run: npx tsc --pretty false 2>&1 | tee /tmp/defense-tsc.log

      - name: Run Vite production build
        id: vite
        continue-on-error: true
        working-directory: apps/command-center-v3
        run: npx vite build 2>&1 | tee /tmp/defense-vite-build.log

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defense-sectors-frontend-diagnostics
          path: |
            /tmp/defense-design.log
            /tmp/defense-chip.log
            /tmp/defense-tsc.log
            /tmp/defense-vite-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce frontend gates
        if: steps.design.outcome != 'success' || steps.chips.outcome != 'success' || steps.typescript.outcome != 'success' || steps.vite.outcome != 'success'
        run: |
          echo "design=${{ steps.design.outcome }}"
          echo "chips=${{ steps.chips.outcome }}"
          echo "typescript=${{ steps.typescript.outcome }}"
          echo "vite=${{ steps.vite.outcome }}"
          exit 1

      - name: Install Chromium
        working-directory: apps/command-center-v3
        run: npx playwright install --with-deps chromium

      - name: Render desktop and narrow gates
        working-directory: apps/command-center-v3
        run: |
          rm -rf render-artifacts test-results
          mkdir -p render-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/defense-vite.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173/v3/ >/dev/null && break
            sleep 1
          done
          export PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173
          npx playwright test e2e/defense-render.spec.ts e2e/sectors-render.spec.ts

      - name: Upload render failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: defense-sectors-render-failure
          path: |
            apps/command-center-v3/test-results/**
            apps/command-center-v3/render-artifacts/**
            /tmp/defense-vite.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify committed source is clean
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$({ git status --porcelain --untracked-files=all || true; } | grep -Ev '^\?\? apps/command-center-v3/(render-artifacts|test-results)/' || true)"
          test -z "$unexpected" || {
            printf '%s\n' "$unexpected"
            echo 'Validation mutated source or created an output outside the designated evidence directories.' >&2
            exit 1
          }

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: defense-sectors-render-gate
          path: apps/command-center-v3/render-artifacts/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: defense-data-validated-source
          path: |
            config/defense_account_exposure.json
            config/defense_recommendations.json
            config/fund_lookthrough.json
            scripts/defense_account_exposure.py
            scripts/defense_data_quality.py
            scripts/fund_lookthrough.py
            scripts/sector_momentum_engine.py
            scripts/finviz_industry_groups.py
            scripts/defense_recommendations.py
            scripts/defense_recommendations_v10.py
            tests/test_defense_account_exposure.py
            tests/test_defense_data_quality.py
            tests/test_defense_data_hardening_wiring.py
            tests/test_defense_recommendations_v10.py
            docs/architecture/DEFENSE_SECTORS_DATA_HARDENING_2026-07-24.md
          if-no-files-found: error
          retention-days: 30
