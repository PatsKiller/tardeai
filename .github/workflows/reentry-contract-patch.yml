name: reentry-contract-patch
on:
  push:
    branches: [fix/reentry-evidence-contract-watch-operator-queue]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reentry-evidence-contract-watch-operator-queue
      - name: expose active evidence contract and source field coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/command-center-v3/src/components/reentry/ReEntryCurrentIntelligence.tsx')
          text = path.read_text()
          old = "  const refresh = () => { evidence.refetch(); cards.refetch(); holdings.refetch(); alerts.refetch(); regime.refetch(); resistancePref.refetch(); analyst.refetch(); mandatesPref.refetch(); eventsPref.refetch(); dispositionsPref.refetch(); setWatchReload(value => value + 1) }\n"
          new = old + "  const shareCoverage = evidence.sources.map(source => `${source.label} shares ${evidence.sourceFieldCoverage[source.key]?.quantity ?? 0}`).join(' · ')\n"
          if old not in text:
              raise SystemExit('refresh anchor missing')
          text = text.replace(old, new, 1)
          old_header = "Regime {regimeLabel} · {evidence.rows.length} reconciled exit events · {evidence.sources.filter(source => source.available).length}/{evidence.sources.length} sources reporting · advisory only"
          new_header = "Regime {regimeLabel} · {evidence.rows.length} reconciled exit events · {evidence.sources.filter(source => source.available).length}/{evidence.sources.length} sources reporting · contract {evidence.contractVersion} · advisory only"
          if old_header not in text:
              raise SystemExit('header anchor missing')
          text = text.replace(old_header, new_header, 1)
          old_audit = "<b>Source audit:</b> {evidence.sources.map(source => `${source.label} ${source.rows}`).join(' · ')}. A missing value means no compatible event-level or ticker-aggregate fact was found; derived shares/price/proceeds are labeled in the expanded audit."
          new_audit = "<b>Source audit:</b> {evidence.sources.map(source => `${source.label} ${source.rows}`).join(' · ')}.<br /><b>Quantity-bearing rows:</b> {shareCoverage}. A remaining blank means no compatible event or aggregate supplied the field; deterministic derivations and account-alias joins are labeled in the expanded audit."
          if old_audit not in text:
              raise SystemExit('audit anchor missing')
          text = text.replace(old_audit, new_audit, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/command-center-v3/src/components/reentry/ReEntryCurrentIntelligence.tsx
          git commit -m 'fix(reentry): show active evidence contract and field coverage'
          git push origin HEAD:fix/reentry-evidence-contract-watch-operator-queue
