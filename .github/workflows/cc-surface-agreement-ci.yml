name: cc-surface-agreement-ci
# Gates the browser checks that were runnable but ungated.
#
# scripts/test_metric_strip_labels.mjs shipped one campaign runnable and invoked
# by no workflow, so a regression in the file it guards would have merged green.
# e2e/run_health_agreement.spec.ts guards the two surfaces that already drifted
# once — the run-health helpers lived unexported inside TradingHub.tsx, so the
# panel could see RUN_UNDERFILLED and the header could not. Same trap, gated this
# time.
#
# Hermetic by construction: the spec stubs every API call from one fixture, so it
# needs the preview and no backend.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/command-center-v3/src/components/MetricStrip.tsx'
      - 'apps/command-center-v3/src/index.css'
      - 'apps/command-center-v3/src/pages/TradingHub.tsx'
      - 'apps/command-center-v3/src/lib/runHealth.ts'
      - 'apps/command-center-v3/src/lib/setupRunSummary.ts'
      - 'apps/command-center-v3/e2e/run_health_agreement.spec.ts'
      - 'apps/command-center-v3/e2e/trading-portfolio-strip.spec.ts'
      - 'apps/command-center-v3/e2e/trade-ai-opportunities.spec.ts'
      - 'apps/command-center-v3/src/components/tradeai/TradeAiOpportunities.tsx'
      - 'apps/command-center-v3/src/lib/tradeAiOpportunities.ts'
      - 'apps/command-center-v3/src/lib/scanRunAge.ts'
      - 'apps/command-center-v3/e2e/scheduler-operations.spec.ts'
      - 'apps/command-center-v3/src/pages/CoordinationPage.tsx'
      - 'apps/command-center-v3/src/pages/SchedulerOperations.tsx'
      - 'apps/command-center-v3/src/lib/schedulerOperations.ts'
      - 'apps/command-center-v3/e2e/account-labels.spec.ts'
      - 'apps/command-center-v3/e2e/fixtures/accountLabels.fixture.json'
      - 'apps/command-center-v3/src/lib/accountLabels.ts'
      - 'apps/command-center-v3/src/components/AccountChip.tsx'
      - 'apps/command-center-v3/src/lib/homeDoNow.ts'
      - 'apps/command-center-v3/src/pages/HomeDoNow.tsx'
      - 'apps/command-center-v3/src/pages/RiskHub.tsx'
      - 'apps/command-center-v3/src/lib/riskMath.ts'
      - 'apps/command-center-v3/src/components/tradeinview/TradeLogTable.tsx'
      - 'apps/command-center-v3/e2e/work-pipeline.spec.ts'
      - 'apps/command-center-v3/e2e/work-pipeline-tier2.spec.ts'
      - 'apps/command-center-v3/src/lib/workPipelineTier2.ts'
      - 'apps/command-center-v3/src/pages/WorkPipelinePanel.tsx'
      - 'apps/command-center-v3/src/lib/workPipeline.ts'
      - 'apps/command-center-v3/src/lib/workPipelineActions.ts'
      - 'apps/command-center-v3/src/fixtures/workPipeline.fixture.ts'
      - '.github/workflows/cc-surface-agreement-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
# Push policy v2 (2026-10-23): a new push to a PR supersedes the run in flight; a push to main gets
# one group per SHA so a merged SHA is never left without CI evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  surface-agreement:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build UI
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cc-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/v3/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cc-preview.log
          exit 1
      - name: Header and Trading panel must state the same run
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/run_health_agreement.spec.ts e2e/scheduler-operations.spec.ts e2e/trading-portfolio-strip.spec.ts e2e/trade-ai-opportunities.spec.ts e2e/account-labels.spec.ts e2e/work-pipeline.spec.ts e2e/work-pipeline-tier2.spec.ts --project=chromium --reporter=line
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-surface-agreement-playwright
          path: apps/command-center-v3/playwright-report
          if-no-files-found: ignore
