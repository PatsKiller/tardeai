name: reentry-watch-operator-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/command-center-v3/src/hooks/useReEntryExitEvidence.ts'
      - 'apps/command-center-v3/src/components/WatchTruthAuditPanel.tsx'
      - 'apps/command-center-v3/src/components/reentry/**'
      - 'apps/command-center-v3/src/pages/ReEntryPageV4.tsx'
      - 'tests/test_reentry_watch_operator_contract.py'
      - '.github/workflows/reentry-watch-operator-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
# Push policy v2 (2026-10-23): a new push to a PR supersedes the run in flight; a push to main gets
# one group per SHA so a merged SHA is never left without CI evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend
        working-directory: apps/command-center-v3
        run: npm ci --silent
      - name: TypeScript
        working-directory: apps/command-center-v3
        run: npx tsc --pretty false
      - name: Design and chip guards
        working-directory: apps/command-center-v3
        run: |
          bash ../../scripts/check_design_tokens.sh
          node ../../scripts/test_chip_scope.mjs
      - name: Production build
        working-directory: apps/command-center-v3
        run: npm run build
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused source contracts
        run: python -m pytest -q tests/test_reentry_watch_operator_contract.py
