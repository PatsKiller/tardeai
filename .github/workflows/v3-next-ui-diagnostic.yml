name: v3-next-ui-diagnostic
on:
  pull_request:
    paths:
      - 'apps/command-center-v3-next/**'
      - '.github/workflows/v3-next-ui-diagnostic.yml'
  workflow_dispatch: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3-next/package-lock.json
      - name: install
        working-directory: apps/command-center-v3-next
        run: npm ci --silent
      - name: tests
        working-directory: apps/command-center-v3-next
        run: npm test
      - name: production build
        working-directory: apps/command-center-v3-next
        run: npm run build
