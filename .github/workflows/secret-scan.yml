name: secret-scan

# Standing secret and personal-data scan. Operator request, 2026-10-27, verbatim: "would need some validates or
# checks that I don't have any type of secrets or codes or anything identifiable in the codes and GitHub that
# should also be in the agents.md".
#
#   * gitleaks 8.21.2 (pinned, sha256-verified) with .gitleaks.toml: credentials in every NEW commit of a pull
#     request or push to main; the whole main history nightly. Reviewed historical findings are silenced one
#     commit-scoped fingerprint at a time in .gitleaksignore (never by path). Inline gitleaks allow comments
#     are never honoured (--ignore-gitleaks-allow).
#   * scripts/check_no_pii.py: personal or identifying data (emails, account numbers, chat ids, private
#     addresses, home paths, never-commit files) on ADDED lines of a pull request or push; nightly, the whole
#     tree against the ratchet config/pii_baseline.json. On a pull request, --baseline-guard also fails any
#     raised count in that baseline file.
#
# Trust: on a pull request, .gitleaks.toml, .gitleaksignore and check_no_pii.py are main's copies. The rules
# files are copied OVER the checkout before gitleaks runs, because gitleaks 8.21.2 always also loads
# ./.gitleaksignore from the scanned tree and accepts fingerprints without a commit. If main has no
# .gitleaksignore yet, an empty one is used; if main has no .gitleaks.toml yet (only the PR that adds it),
# the PR's copy is used. This workflow file itself still comes from the pull request, which is why
# .github/** is merge-held (config/merge_hold_paths.json, merge_deploy_control).
#
# Drafts skip this job like the rest of the fleet (push policy v2); draft-quick-check runs check_no_secrets.py.
# Output never contains a found value: gitleaks --redact, and check_no_pii.py prints path:line and category.
# Git author names and emails from the gitleaks report are never printed.
# READ_ONLY_ADVISORY: no broker, no Telegram, no network beyond downloading the pinned gitleaks release.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"  # nightly 07:23 UTC (03:23 ET): full main history + whole tree
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"
  # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, from the release's gitleaks_8.21.2_checksums.txt (fetched and
  # re-verified against the downloaded tarball 2026-10-27). Change both lines together, never one.
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  secret-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADE_AI_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Scope and trusted rules
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rules"
          case "$EVENT" in
            pull_request)
              echo "LOG_OPTS=origin/${BASE_REF}..HEAD" >> "$GITHUB_ENV"
              echo "PII_ARGS=--range origin/${BASE_REF}...HEAD" >> "$GITHUB_ENV"
              base="origin/${BASE_REF}"
              # main's rules OVER the checkout: gitleaks reads ./.gitleaksignore from the scanned tree regardless.
              if git cat-file -e "${base}:.gitleaksignore" 2>/dev/null; then
                git show "${base}:.gitleaksignore" > .gitleaksignore
                echo "rules: .gitleaksignore from ${base}"
              else
                : > .gitleaksignore
                echo "rules: .gitleaksignore EMPTY (${base} has none; the PR's own list is never used)"
              fi
              if git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
                git show "${base}:.gitleaks.toml" > .gitleaks.toml
                echo "rules: .gitleaks.toml from ${base}"
              else
                echo "rules: .gitleaks.toml from this checkout (${base} has none: the PR that adds it)"
              fi
              if git cat-file -e "${base}:scripts/check_no_pii.py" 2>/dev/null; then
                git show "${base}:scripts/check_no_pii.py" > "$RUNNER_TEMP/rules/check_no_pii.py"
                echo "rules: check_no_pii.py from ${base}"
              else
                cp scripts/check_no_pii.py "$RUNNER_TEMP/rules/check_no_pii.py"
                echo "rules: check_no_pii.py from this checkout (${base} has none: the PR that adds it)"
              fi ;;
            push)
              cp scripts/check_no_pii.py "$RUNNER_TEMP/rules/check_no_pii.py"
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                echo "LOG_OPTS=--full-history HEAD" >> "$GITHUB_ENV"
                echo "PII_ARGS=--tree" >> "$GITHUB_ENV"
              else
                echo "LOG_OPTS=${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_ENV"
                echo "PII_ARGS=--range ${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_ENV"
              fi ;;
            *)
              cp scripts/check_no_pii.py "$RUNNER_TEMP/rules/check_no_pii.py"
              echo "LOG_OPTS=--full-history HEAD" >> "$GITHUB_ENV"
              echo "PII_ARGS=--tree" >> "$GITHUB_ENV" ;;
          esac

      - name: Optional private deny patterns (Actions secret TRADEAI_PII_DENY_PATTERNS)
        env:
          PII_DENY: ${{ secrets.TRADEAI_PII_DENY_PATTERNS }}
        run: |
          set -euo pipefail
          if [ -n "${PII_DENY:-}" ]; then
            printf '%s\n' "$PII_DENY" > "$RUNNER_TEMP/pii_deny.txt"
            echo "TRADEAI_PII_DENY_FILE=$RUNNER_TEMP/pii_deny.txt" >> "$GITHUB_ENV"
            echo "deny patterns loaded: $(grep -cvE '^[[:space:]]*(#|$)' "$RUNNER_TEMP/pii_deny.txt" || true)"
          else
            echo "no deny-pattern secret configured; generic categories only"
          fi

      - name: gitleaks (credentials)
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          echo "gitleaks git --log-opts=\"$LOG_OPTS\""
          "$RUNNER_TEMP/bin/gitleaks" git . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow \
            --log-opts="$LOG_OPTS" \
            --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report"
          rc=$?
          python3 - "$report" <<'PY'
          import json, sys
          try:
              found = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              found = []
          for f in found:  # redacted; author and email deliberately not printed
              print(f"  {f['RuleID']}  {f['File']}:{f['StartLine']}  commit {f['Commit'][:12]}  fingerprint {f['Fingerprint']}")
          print(f"gitleaks findings: {len(found)}")
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks found a credential. Remove it from the commit (rewrite the branch) and rotate it."
            echo "::error::If it is not a credential, land its fingerprint in .gitleaksignore on main first."
          fi
          exit "$rc"

      - name: check_no_pii (personal and identifying data)
        if: success() || failure()
        run: |
          set -euo pipefail
          read -ra args <<< "$PII_ARGS"
          python3 "$RUNNER_TEMP/rules/check_no_pii.py" --repo . "${args[@]}"

      - name: check_no_pii baseline may only shrink
        if: github.event_name == 'pull_request' && (success() || failure())
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 "$RUNNER_TEMP/rules/check_no_pii.py" --repo . --baseline-guard "origin/${BASE_REF}"
