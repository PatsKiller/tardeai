name: Assemble Active Trader v3.3 documents

on:
  push:
    paths:
      - '.github/workflows/assemble-active-trader-v3-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble and verify canonical artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARCH='docs/architecture/TRADE_AI_MASTER_AGENTIC_FINANCIAL_SYSTEM_ARCHITECTURE_v3_3.md'
          CODEX='docs/prompts/CODEX_ACTIVE_TRADER_MOOMOO_SCALP_IMPLEMENTATION_v1_1.md'
          LITMUS='docs/prompts/ACTIVE_TRADER_ARCHITECT_LITMUS_REVIEW_PROMPT_v1_0.md'

          cat \
            docs/.upload/v3_3/part00.md \
            docs/.upload/v3_3/part01a.md \
            docs/.upload/v3_3/part01b.md \
            docs/.upload/v3_3/part02.md \
            docs/.upload/v3_3/part03.md \
            docs/.upload/v3_3/part04a.md \
            docs/.upload/v3_3/part04b.md \
            docs/.upload/v3_3/part05a.md \
            docs/.upload/v3_3/part05b.md \
            docs/.upload/v3_3/part06a.md \
            docs/.upload/v3_3/part06b.md \
            docs/.upload/v3_3/part07a.md \
            docs/.upload/v3_3/part07b.md \
            > "$ARCH"

          cp docs/.upload/v3_3/codex_v1_1.md "$CODEX"
          cp docs/.upload/v3_3/litmus_v1_0.md "$LITMUS"

          test "$(sha256sum "$ARCH" | awk '{print $1}')" = 'e2649ec30f531d72635e9b255ff4c4a1e57725241a50b2dfb312ea19b9609da8'
          test "$(sha256sum "$CODEX" | awk '{print $1}')" = '6293b5502ad3c6e421dcb75c2824583dc7113b3a2c9b8854696d32fcc57f8604'
          test "$(sha256sum "$LITMUS" | awk '{print $1}')" = '0c7b5d2d31a11dee3699843fd0515ff8acdec4660191540f367df45915d90eb5'

          rm -rf docs/.upload/v3_3

      - name: Commit canonical documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trade-ai-doc-assembler'
          git config user.email 'trade-ai-doc-assembler@users.noreply.github.com'
          git add \
            docs/architecture/TRADE_AI_MASTER_AGENTIC_FINANCIAL_SYSTEM_ARCHITECTURE_v3_3.md \
            docs/prompts/CODEX_ACTIVE_TRADER_MOOMOO_SCALP_IMPLEMENTATION_v1_1.md \
            docs/prompts/ACTIVE_TRADER_ARCHITECT_LITMUS_REVIEW_PROMPT_v1_0.md \
            docs/.upload/v3_3
          git commit -m 'docs(active-trader): finalize canonical v3.3 architecture and execution program'
          git push origin HEAD:main
