name: fq058-wire-clamp-ui-validation

# FQ-058 / PR #2622 review P2622-R2: the phone wire row clamps the headline and lede to two lines, and
# a clamp only clips with `overflow: hidden`. This runs the browser regression that renders the real
# compact row at 390px and proves no glyph of the long title or lede paints over the badges line.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/fq058-wire-clamp-ui-validation.yml'
      - 'apps/command-center-v3/e2e/fq058-wire-clamp.spec.ts'
      - 'apps/command-center-v3/e2e/fixtures/fq058-wire-row.mjs'
      - 'apps/command-center-v3/src/pages/W9Mobile.css'
      - 'apps/command-center-v3/src/pages/ResearchIntelligenceHub.tsx'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/fq058-wire-clamp-ui-validation.yml'
      - 'apps/command-center-v3/e2e/fq058-wire-clamp.spec.ts'
      - 'apps/command-center-v3/e2e/fixtures/fq058-wire-row.mjs'
      - 'apps/command-center-v3/src/pages/W9Mobile.css'
      - 'apps/command-center-v3/src/pages/ResearchIntelligenceHub.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fq058-wire-clamp-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fq058-wire-clamp:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/fq058-wire-clamp.spec.ts --project=chromium --reporter=line
      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fq058-wire-clamp-playwright
          path: apps/command-center-v3/test-results
          if-no-files-found: ignore
