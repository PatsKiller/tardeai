name: release-readiness

# Read-only release-gating proof. NEVER performs broker writes — every step is a
# validator or test. Mirrors scripts/run_release_ci_equivalent.py so the same proof
# exists locally and in CI.

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
  workflow_dispatch:

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      ALPACA_MODE: paper
      TRADE_AI_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml || true

      - name: Run CI-equivalent release proof (read-only, no broker writes)
        run: |
          python3 scripts/run_release_ci_equivalent.py --json | tee ci_evidence.json

      - name: Schwab write policy (must be green)
        run: python3 scripts/validate_schwab_write_policy.py

      - name: No broker write bypass (must be green)
        run: python3 tests/test_no_broker_write_bypass.py

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            ci_evidence.json
            docs/project/CI_EVIDENCE_LATEST.md
            data/runtime/ci_evidence_latest.json
