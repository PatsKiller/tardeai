name: options-lifecycle-ci
on:
  push:
    paths: &lifecycle_paths
      - 'scripts/options_*.py'
      - 'scripts/investment_costs.py'
      - 'scripts/ticker_attribution.py'
      - 'scripts/schwab_econfirm_reconcile.py'
      - 'scripts/check_docs_drive_parity.py'
      - 'tests/test_options_lifecycle*.py'
      - 'tests/test_econfirm_parser.py'
      - 'tests/test_inverse_stoplights.py'
      - 'tests/test_schwab_exec_parser.py'
      - 'tests/test_outbox_process_crash.py'
      - 'tests/test_drive_semantic_compare.py'
      - 'tests/test_friction_statement_oer.py'
      - 'tests/test_stoplights_v3_integrity.py'
      - 'scripts/research/inverse_hedge_backtest.py'
      - 'scripts/options_schwab_exec_parser.py'
      - 'scripts/drive_semantic_compare.py'
      - 'scripts/options_execution_friction.py'
      - 'scripts/statement_reconciliation.py'
      - 'scripts/oer_rate_ingest.py'
      - 'scripts/paper_canary_preflight.py'
      - 'config/drive_parity_manifest.json'
      - 'scripts/defense_inverse_stoplights.py'
      - 'scripts/research/inverse_hedge_backtest.py'
      - 'tests/fixtures/econfirm/**'
      - 'config/options_lifecycle_policy.json'
      - 'apps/command-center-v3/**'
      - '.github/workflows/options-lifecycle-ci.yml'
  pull_request:
    paths: *lifecycle_paths
  workflow_dispatch: {}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: trade_ai }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: trade_ai
      DB_USER: postgres
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      TRADE_AI_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest psycopg2-binary
      - name: pure + REAL-PG + eConfirm tests (skips are FAILURES; JUnit published)
        run: |
          pytest tests/test_options_lifecycle_policy.py tests/test_options_lifecycle_migration.py \
            tests/test_econfirm_parser.py tests/test_inverse_stoplights.py \
            tests/test_schwab_exec_parser.py tests/test_outbox_process_crash.py \
            tests/test_drive_semantic_compare.py tests/test_friction_statement_oer.py \
            tests/test_stoplights_v3_integrity.py \
            -v -rs --junitxml=/tmp/junit.xml 2>&1 | tee /tmp/pytest.out
          if grep -qE "SKIPPED|skipped" /tmp/pytest.out; then
            echo "::error::PostgreSQL-backed tests were skipped — CI must run them"; exit 1
          fi
      - name: workflow summary
        if: always()
        run: |
          {
            echo "## Options Lifecycle CI"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- postgres: $(psql --version 2>/dev/null || echo 'service postgres:17')"
            tail -3 /tmp/pytest.out | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            /tmp/junit.xml
            /tmp/pytest.out
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: typecheck + design guard + build
        working-directory: apps/command-center-v3
        run: |
          npm ci
          npm run build
