name: agentic-mvl-ci
on:
  pull_request:
    paths:
      - 'scripts/agent_runtime/**'
      - 'config/agent_runtime_mvl.json'
      - 'config/systemd/agent_runtime/**'
      - 'migrations/agentic_runtime/**'
      - 'tests/fixtures/agentic_runtime/**'
      - 'tests/test_agent_runtime_*.py'
      - 'docs/architecture/AGENTIC_*.md'
      - 'docs/architecture/AGENT_TOOL_PERMISSION_MATRIX_*.md'
      - 'docs/architecture/OPENCLAW_HERMES_*.md'
      - '.github/workflows/agentic-mvl-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lane A: rich source provenance so every evidence bundle can be tied back
      # to the exact checked-out commit (also satisfies the "echo SHA" contract).
      - name: Record source provenance
        shell: bash
        run: |
          mkdir -p ci-evidence
          {
            echo "workflow=agentic-mvl-ci"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "event=${{ github.event_name }}"
            echo "ref=${{ github.ref }}"
            echo "github_sha=${{ github.sha }}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
          } | tee ci-evidence/provenance.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lane D: psycopg2-binary is the driver the host-proof wrapper
      # (tests/test_agent_runtime_host_proof_wrapper.py) fail-closed REQUIRES to
      # reach its hermetic auth-preflight branch — "missing driver is not a skip".
      # The wrapper still contacts NO real database (LAB socket points nowhere).
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest psycopg2-binary

      - name: Compile runtime
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall scripts/agent_runtime 2>&1 | tee ci-evidence/compile.txt

      - name: Run all agentic MVL tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_agent_runtime_*.py 2>&1 | tee ci-evidence/pytest.txt

      # Lane D: RECURSIVE scan via rglob so scripts/agent_runtime/agents/*.py
      # (Lane D shadow producers) are covered too, not just the top-level package.
      - name: Recursive authority scan (incl. scripts/agent_runtime/agents)
        id: authority
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ci-evidence/authority-scan.txt
          from pathlib import Path
          files = sorted(Path('scripts/agent_runtime').rglob('*.py'))
          runtime = '\n'.join(path.read_text() for path in files)
          forbidden_imports = ['import subprocess', 'from subprocess', 'import requests', 'import psycopg2', 'from psycopg2', 'import keyring', 'import bw']
          found = [item for item in forbidden_imports if item in runtime]
          if found:
              raise SystemExit(f'forbidden runtime imports: {found}')
          migration = Path('migrations/agentic_runtime/0001_mvl.up.sql').read_text()
          for word in ['orders', 'broker_credentials', 'session_authorizations', 'approval_events']:
              if f'CREATE TABLE agentic_runtime.{word}' in migration:
                  raise SystemExit(f'financial authority table prohibited: {word}')
          print(f'recursive authority scan PASS over {len(files)} runtime files (incl agents/)')
          PY

      # Lane D: the prepare-only migration applier must refuse every path that
      # would touch a database without an explicit opt-in and an isolated
      # LAB/SHADOW DSN.
      - name: Migration apply-script refusal paths
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            bash migrations/agentic_runtime/apply.sh; echo "no-apply exit=$? expect=3"
            bash migrations/agentic_runtime/apply.sh --apply up; echo "apply-no-dsn exit=$? expect=4"
            TRADE_AI_LAB_DSN='postgres://x@host/trade_ai_prod' bash migrations/agentic_runtime/apply.sh --apply up; echo "prod-dsn exit=$? expect=5"
          } >ci-evidence/migration.txt 2>&1 || true
          cat ci-evidence/migration.txt
          grep -q 'no-apply exit=3 expect=3' ci-evidence/migration.txt
          grep -q 'apply-no-dsn exit=4 expect=4' ci-evidence/migration.txt
          grep -q 'prod-dsn exit=5 expect=5' ci-evidence/migration.txt

      # Lane D: verify the default-disabled systemd template units parse and stay gated.
      - name: systemd unit verification
        id: systemd
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            if command -v systemd-analyze >/dev/null 2>&1; then
              systemd-analyze verify --man=no config/systemd/agent_runtime/tradeai-agent-runtime@.service || true; echo "service verify exit=$?"
              systemd-analyze verify --man=no config/systemd/agent_runtime/tradeai-agent-runtime@.timer || true; echo "timer verify exit=$?"
            else
              echo "systemd-analyze unavailable on runner; asserting the units stay disabled/gated by content:"
            fi
            grep -q 'ConditionPathExists=/etc/tradeai/agent_runtime_enabled' config/systemd/agent_runtime/tradeai-agent-runtime@.service && echo "service opt-in gate present"
            grep -q 'ConditionPathExists=/etc/tradeai/agent_runtime_enabled' config/systemd/agent_runtime/tradeai-agent-runtime@.timer && echo "timer opt-in gate present"
            grep -q 'AGENT_RUNTIME_OPERATOR_AUTH=0' config/systemd/agent_runtime/tradeai-agent-runtime@.service && echo "operator-auth defaults closed"
          } 2>&1 | tee ci-evidence/systemd.txt

      - name: Preserve focused evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-mvl-test-evidence
          path: ci-evidence/
          if-no-files-found: error

      - name: Enforce focused result
        if: always()
        shell: bash
        run: |
          fail=0
          for step in compile:${{ steps.compile.outcome }} tests:${{ steps.tests.outcome }} authority:${{ steps.authority.outcome }} migration:${{ steps.migration.outcome }} systemd:${{ steps.systemd.outcome }}; do
            name="${step%%:*}"; outcome="${step##*:}"
            if [ "$outcome" != "success" ]; then
              echo "FAILED gate: $name ($outcome)"; fail=1
            else
              echo "ok: $name"
            fi
          done
          exit "$fail"
