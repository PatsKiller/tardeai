name: agentic-mvl-ci
on:
  pull_request:
    paths:
      - 'scripts/agent_runtime/**'
      - 'config/agent_runtime_mvl.json'
      - 'migrations/agentic_runtime/**'
      - 'tests/fixtures/agentic_runtime/**'
      - 'tests/test_agent_runtime_*.py'
      - 'docs/architecture/AGENTIC_*.md'
      - 'docs/architecture/AGENT_TOOL_PERMISSION_MATRIX_*.md'
      - 'docs/architecture/OPENCLAW_HERMES_*.md'
      - '.github/workflows/agentic-mvl-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile runtime
        run: python -m compileall -q scripts/agent_runtime
      - name: Run MVL governance, schema and Sentinel tests
        run: python -m pytest -q tests/test_agent_runtime_mvl.py tests/test_agent_runtime_migration_contract.py tests/test_agent_runtime_sentinel.py
      - name: Prove no forbidden import or authority string in runtime implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = '\n'.join(path.read_text() for path in Path('scripts/agent_runtime').glob('*.py'))
          forbidden_imports = ['import subprocess', 'from subprocess', 'import requests', 'import psycopg2', 'import keyring', 'import bw']
          found = [item for item in forbidden_imports if item in runtime]
          if found:
              raise SystemExit(f'forbidden runtime imports: {found}')
          migration = Path('migrations/agentic_runtime/0001_mvl.up.sql').read_text()
          for word in ['orders', 'broker_credentials', 'session_authorizations', 'approval_events']:
              if f'CREATE TABLE agentic_runtime.{word}' in migration:
                  raise SystemExit(f'financial authority table prohibited: {word}')
          print('focused authority scan PASS')
          PY
