name: w9-pages-fixture
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/w9-pages-fixture.yml'
      - 'apps/command-center-v3/e2e/w9-pages.fixture.mjs'
      - 'apps/command-center-v3/src/pages/TradingHub.tsx'
      - 'apps/command-center-v3/src/pages/ResearchIntelligenceHub.tsx'
      - 'apps/command-center-v3/src/pages/WatchHub.tsx'
      - 'apps/command-center-v3/src/pages/WatchMyList.tsx'
      - 'apps/command-center-v3/src/pages/WatchProspects.tsx'
      - 'apps/command-center-v3/src/pages/WatchIntelligenceUnified.tsx'
      - 'apps/command-center-v3/src/pages/OpportunitiesHub.tsx'
      - 'apps/command-center-v3/src/hooks/useApi.ts'
      - 'apps/command-center-v3/src/pages/W9Mobile.css'
      - 'apps/command-center-v3/src/components/ListPager.tsx'
      - 'apps/command-center-v3/src/lib/watchProspectsModel*'
      - 'apps/command-center-v3/src/components/watch/WatchRecordCard.css'
      - 'apps/command-center-v3/src/components/DetailDrawer.tsx'
      - 'apps/command-center-v3/src/components/MobileDetailSheet*'
      - 'apps/command-center-v3/src/components/conflicts/**'
      - 'apps/command-center-v3/src/lib/watchConflictPresentation*'
      - 'apps/command-center-v3/e2e/watch-conflict.fixture.mjs'
      - 'apps/command-center-v3/e2e/fixtures/conflictEngine.fixture.json'
      - 'apps/command-center-v3/e2e/fixtures/conflictSafety.fixture.json'
      - 'apps/command-center-v3/e2e/watch-resolve.fixture.mjs'
      - 'apps/command-center-v3/src/components/watch/WatchConflictPanel.tsx'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  page-fixtures:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Recorded research filters, Classic links and Trading labels
        run: node e2e/w9-pages.fixture.mjs "$RUNNER_TEMP/w9-pages"
      - name: Shared conflict UI protocol, independent of rulebook acceptance
        run: node e2e/watch-conflict.fixture.mjs "$RUNNER_TEMP/w9-pages/conflict-shared"
      - name: Actual Watch Resolve, saved review history and paging
        run: node e2e/watch-resolve.fixture.mjs "$RUNNER_TEMP/w9-pages/watch-resolve"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w9-pages/
          if-no-files-found: error
