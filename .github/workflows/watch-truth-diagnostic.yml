name: watch-truth-diagnostic
on:
  pull_request:
    paths:
      - 'apps/command-center-v3/**'
      - '.github/workflows/watch-truth-diagnostic.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: normalize Hermes color token
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/command-center-v3/src/components/WatchTruthAuditPanel.tsx')
          text = path.read_text()
          text = text.replace("'#a855f7'", 'T.extIntel.hermes').replace('"#a855f7"', 'T.extIntel.hermes')
          path.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/command-center-v3/src/components/WatchTruthAuditPanel.tsx
            git commit -m 'fix(watch): use Hermes design token'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install
        working-directory: apps/command-center-v3
        run: npm ci --silent
      - name: capture diagnostics
        continue-on-error: true
        working-directory: apps/command-center-v3
        run: |
          set +e
          npx tsc --pretty false > /tmp/watch-tsc.log 2>&1
          echo $? > /tmp/watch-tsc.exit
          bash ../../scripts/check_design_tokens.sh > /tmp/watch-design.log 2>&1
          echo $? > /tmp/watch-design.exit
          node ../../scripts/test_chip_scope.mjs > /tmp/watch-chip.log 2>&1
          echo $? > /tmp/watch-chip.exit
          npm run build > /tmp/watch-build.log 2>&1
          echo $? > /tmp/watch-build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: watch-truth-diagnostic
          path: /tmp/watch-*.log
      - name: report
        run: |
          cat /tmp/watch-tsc.log
          cat /tmp/watch-design.log
          cat /tmp/watch-chip.log
          cat /tmp/watch-build.log
          test "$(cat /tmp/watch-tsc.exit)" = 0
          test "$(cat /tmp/watch-design.exit)" = 0
          test "$(cat /tmp/watch-chip.exit)" = 0
          test "$(cat /tmp/watch-build.exit)" = 0
