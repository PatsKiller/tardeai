name: defense-data-hardening-ci

on:
  push:
    branches: [agent/defense-sectors-data-hardening]
    paths:
      - .github/workflows/defense-data-hardening-ci.yml
      - scripts/apply_defense_data_hardening.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-render-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/defense-sectors-data-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json

      - name: Apply deterministic source transformations
        run: python scripts/apply_defense_data_hardening.py

      - name: Compile and run focused backend tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q scripts/defense_data_quality.py scripts/sector_momentum_engine.py scripts/finviz_industry_groups.py scripts/defense_recommendations.py scripts/fund_lookthrough.py
          python -m pytest -q tests/test_defense_data_quality.py tests/test_defense_data_hardening_wiring.py

      - name: Install locked frontend dependencies
        working-directory: apps/command-center-v3
        run: npm ci

      - name: Build frontend
        working-directory: apps/command-center-v3
        run: npm run build

      - name: Install Chromium
        working-directory: apps/command-center-v3
        run: npx playwright install --with-deps chromium

      - name: Render desktop and narrow gates
        working-directory: apps/command-center-v3
        run: |
          rm -rf render-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/defense-vite.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173/v3/ >/dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test e2e/defense-sectors-render.spec.ts

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: defense-sectors-render-gate
          path: apps/command-center-v3/render-artifacts/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated hardening
        run: |
          git diff --check
          git config user.name 'trade-ai-ci'
          git config user.email 'trade-ai-ci@users.noreply.github.com'
          git add config/defense_recommendations.json config/fund_lookthrough.json \
                  scripts/fund_lookthrough.py scripts/sector_momentum_engine.py \
                  scripts/finviz_industry_groups.py scripts/defense_recommendations.py \
                  tests/test_defense_data_hardening_wiring.py \
                  docs/architecture/DEFENSE_SECTORS_DATA_HARDENING_2026-07-24.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'defense: harden data quality and rotation contracts'
            git push origin HEAD:agent/defense-sectors-data-hardening
          fi
