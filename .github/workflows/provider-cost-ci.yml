name: provider-cost-ci

# Read-only FinOps. No paid provider calls. No broker writes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch:

# Push policy v2 (2026-10-23): a new push to a PR supersedes the run in flight; a push to main gets
# one group per SHA so a merged SHA is never left without CI evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provider-cost:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      TRADE_AI_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --upgrade pip && pip install pytest requests
      - name: Provider cost suite
        run: python3 -m pytest -q tests/provider_cost
      - name: Historical reconcile dry-run
        run: python3 scripts/provider_cost_reconcile.py
      - name: Export-by-key fail-closed
        run: python3 scripts/provider_cost_export.py --start 2026-08-01 --end 2026-08-16 --group-by key --format json
      - name: Schwab / no-broker regressions
        run: |
          python3 -m pytest -q tests/test_no_broker_write_bypass.py
          python3 scripts/validate_schwab_write_policy.py --source-only
