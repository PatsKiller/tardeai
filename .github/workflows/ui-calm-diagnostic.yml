name: ui-calm-diagnostic
on:
  pull_request:
    paths:
      - 'apps/command-center-v3/**'
      - '.github/workflows/ui-calm-diagnostic.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: normalize design minimums and KPI label type
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('apps/command-center-v3/src/components/DecisionPacketBand.tsx'),
              Path('apps/command-center-v3/src/components/WatchTruthAuditPanel.tsx'),
              Path('apps/command-center-v3/src/components/reentry/ReEntryClassificationOverlay.tsx'),
              Path('apps/command-center-v3/src/components/reentry/ReEntryExitWorkbench.tsx'),
              Path('apps/command-center-v3/src/components/reentry/ReEntryCurrentIntelligence.tsx'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('fontSize: 9.5', 'fontSize: 10')
              if path.name == 'ReEntryCurrentIntelligence.tsx':
                  text = text.replace('>{name}</span><br /><b style={{ fontSize: 20 }}>{String(value)}</b>', '>{String(name)}</span><br /><b style={{ fontSize: 20 }}>{String(value)}</b>')
              path.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/command-center-v3/src
            git commit -m 'fix(ui): satisfy type and design minimums'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install
        working-directory: apps/command-center-v3
        run: npm ci --silent
      - name: capture diagnostics
        continue-on-error: true
        working-directory: apps/command-center-v3
        run: |
          set +e
          npx tsc --pretty false > /tmp/ui-calm-tsc.log 2>&1
          echo $? > /tmp/ui-calm-tsc.exit
          bash ../../scripts/check_design_tokens.sh > /tmp/ui-calm-design.log 2>&1
          echo $? > /tmp/ui-calm-design.exit
          node ../../scripts/test_chip_scope.mjs > /tmp/ui-calm-chip.log 2>&1
          echo $? > /tmp/ui-calm-chip.exit
          npm run build > /tmp/ui-calm-build.log 2>&1
          echo $? > /tmp/ui-calm-build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ui-calm-diagnostic
          path: /tmp/ui-calm-*.log
      - name: report
        run: |
          cat /tmp/ui-calm-tsc.log
          cat /tmp/ui-calm-design.log
          cat /tmp/ui-calm-chip.log
          cat /tmp/ui-calm-build.log
          test "$(cat /tmp/ui-calm-tsc.exit)" = 0
          test "$(cat /tmp/ui-calm-design.exit)" = 0
          test "$(cat /tmp/ui-calm-chip.exit)" = 0
          test "$(cat /tmp/ui-calm-build.exit)" = 0
