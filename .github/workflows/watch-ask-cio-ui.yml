name: watch-ask-cio-ui

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/watch-ask-cio-ui.yml'
      - 'apps/command-center-v3/src/components/watch/**'
      - 'apps/command-center-v3/src/lib/watchCioAsk.ts'
      - 'apps/command-center-v3/src/lib/watchCioAsk.test.ts'
      - 'apps/command-center-v3/src/lib/watchProspectsModel.ts'
      - 'apps/command-center-v3/src/lib/watchMarketFactsPresentation.ts'
      - 'apps/command-center-v3/src/pages/WatchProspects.tsx'
      - 'apps/command-center-v3/e2e/watch-ask-cio.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-ask-cio-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-ask-cio-playwright:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/command-center-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command-center-v3/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/watch-ask-cio-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/v3/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/watch-ask-cio-preview.log
          exit 1
      - name: Watch ask and tab taps
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: 'true'
        run: npx playwright test e2e/watch-ask-cio.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-ask-cio-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/command-center-v3/test-results/
            /tmp/watch-ask-cio-preview.log
          if-no-files-found: warn
