name: active-trader-policy-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/active_trader/t2_jit_policy.py'
      - 'scripts/active_trader/momentum_exit_policy.py'
      - 'scripts/active_trader/motion_runtime.py'
      - 'scripts/active_trader/motion_host_proof.py'
      - 'tests/test_active_trader_t2_jit_policy.py'
      - 'tests/test_active_trader_momentum_exit_policy.py'
      - 'tests/test_active_trader_policy_fail_closed.py'
      - 'tests/test_active_trader_motion_runtime.py'
      - 'tests/test_active_trader_motion_host_proof.py'
      - 'config/systemd/tradeai-active-trader-motion.service'
      - 'config/systemd/active-trader-motion.env.example'
      - 'docs/design/ACTIVE_TRADER_T2_JIT_AND_MOMENTUM_EXIT_v1.md'
      - 'docs/prompts/CLAUDE_ACTIVE_TRADER_LIVE_MOTION_UI_v1.md'
      - 'docs/_findings/ACTIVE_TRADER_MOTION_RUNTIME_v1.md'
      - '.github/workflows/active-trader-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Push policy v2 (2026-10-23): a new push to a PR supersedes the run in flight; a push to main gets
# one group per SHA so a merged SHA is never left without CI evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Diff and syntax checks
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$BASE_SHA" ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          # CRLF files are legitimate here (scripts/check_line_endings.py refuses CRLF->LF rewrites), so a CR at
          # end of line is not trailing whitespace; everything else --check catches still fails.
          git -c core.whitespace=cr-at-eol diff --check "$BASE_SHA...HEAD"
          python -m compileall -q scripts/active_trader
      - name: Policy and runtime tests
        run: |
          set -o pipefail
          pytest -q \
            tests/test_active_trader_t2_jit_policy.py \
            tests/test_active_trader_momentum_exit_policy.py \
            tests/test_active_trader_policy_fail_closed.py \
            tests/test_active_trader_motion_runtime.py \
            tests/test_active_trader_motion_host_proof.py | tee /tmp/active-trader-policy-pytest.log
      - name: Upload policy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-trader-policy-proof
          path: /tmp/active-trader-policy-pytest.log
          if-no-files-found: error
