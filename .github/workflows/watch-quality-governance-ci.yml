name: watch-quality-governance-ci

on:
  push:
    branches:
      - agent/watch-quality-governance-v1
  pull_request:
    paths:
      - 'config/watch_quality_policy.json'
      - 'scripts/watch_quality_policy.py'
      - 'scripts/watch_packet_quality.py'
      - 'scripts/watch_quality_projection.py'
      - 'scripts/watch_quality_projection_v2.py'
      - 'scripts/watch_quality_governed_builder.py'
      - 'scripts/watch_quality_gate3_sample_rebuild.py'
      - 'scripts/watch_quality_gate3_sample_rebuild_v2.py'
      - 'scripts/watch_quality_gate4_verify.py'
      - 'scripts/watch_quality_local_scheduler.py'
      - 'scripts/watch_quality_gate6_selection.py'
      - 'scripts/watch_quality_gate6_bound_scheduler.py'
      - 'scripts/run_watch_quality_gate3_from_ref.sh'
      - 'scripts/run_watch_quality_gate4_from_ref.sh'
      - 'scripts/deploy_watch_quality_ui_from_ref.sh'
      - 'scripts/run_watch_quality_local_scheduler_from_ref.sh'
      - 'scripts/install_watch_quality_local_scheduler_from_ref.sh'
      - 'scripts/run_watch_quality_rollout_gates_3_to_6_from_ref.sh'
      - 'scripts/strategy_ticket_validator.py'
      - 'scripts/strategy_ticket_review.py'
      - 'scripts/strategy_ticket_reconciler.py'
      - 'scripts/run_ticket_review_job.py'
      - 'scripts/watch_decision_scheduler.py'
      - 'scripts/watch_quality_audit.py'
      - 'scripts/validate_watch_quality_governance_from_ref.sh'
      - 'apps/command-center-v3/src/lib/watchPacketQuality.ts'
      - 'apps/command-center-v3/src/components/DecisionPacketBand.tsx'
      - 'apps/command-center-v3/src/components/ProAnalystPill.tsx'
      - 'tests/test_watch_quality_*.py'
      - 'tests/test_watch_packet_quality.py'
      - 'tests/test_strategy_ticket_*.py'
      - 'tests/test_ticket_review_worker_fail_closed.py'
      - 'tests/test_validate_watch_quality_governance_from_ref.py'
      - '.github/workflows/watch-quality-governance-ci.yml'

permissions:
  contents: read

concurrency:
  group: watch-quality-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record exact commit under test
        run: |
          echo "watch-quality-governance-ci evidence"
          echo "exact_sha=${{ github.sha }}"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile deterministic Watch review and ticket modules
        run: |
          python -m py_compile \
            scripts/watch_quality_policy.py \
            scripts/watch_packet_quality.py \
            scripts/watch_quality_projection.py \
            scripts/watch_quality_projection_v2.py \
            scripts/watch_quality_governed_builder.py \
            scripts/watch_quality_gate3_sample_rebuild.py \
            scripts/watch_quality_gate3_sample_rebuild_v2.py \
            scripts/watch_quality_gate4_verify.py \
            scripts/watch_quality_local_scheduler.py \
            scripts/watch_quality_gate6_selection.py \
            scripts/watch_quality_gate6_bound_scheduler.py \
            scripts/strategy_ticket_validator.py \
            scripts/strategy_ticket_review.py \
            scripts/strategy_ticket_reconciler.py \
            scripts/run_ticket_review_job.py \
            scripts/watch_decision_scheduler.py \
            scripts/watch_quality_audit.py

      - name: Run focused Watch quality and ticket tests
        run: |
          pytest -q \
            tests/test_watch_quality_policy.py \
            tests/test_strategy_ticket_quality_gate.py \
            tests/test_strategy_ticket_review_contract.py \
            tests/test_strategy_ticket_reconciler_v11.py \
            tests/test_watch_packet_quality.py \
            tests/test_watch_quality_scheduler_contract.py \
            tests/test_watch_quality_audit_contract.py \
            tests/test_watch_quality_projection.py \
            tests/test_watch_quality_projection_v2.py \
            tests/test_watch_quality_gate3_contract.py \
            tests/test_watch_quality_gate4_contract.py \
            tests/test_watch_quality_gate5_contract.py \
            tests/test_watch_quality_gate6_contract.py \
            tests/test_watch_quality_gate6_bound_contract.py \
            tests/test_watch_quality_rollout_orchestrator.py \
            tests/test_watch_quality_ui_contract.py \
            tests/test_ticket_review_worker_fail_closed.py \
            tests/test_validate_watch_quality_governance_from_ref.py

      - name: Install Command Center dependencies
        working-directory: apps/command-center-v3
        run: npm ci

      - name: TypeScript contract
        working-directory: apps/command-center-v3
        run: npx tsc --pretty false

      - name: Production UI build
        working-directory: apps/command-center-v3
        run: npx vite build

      - name: Confirm bounded authority
        run: |
          ! grep -R -n -E 'broker_submit|place_order|approve_order|2fa_unlock' \
            scripts/watch_quality_policy.py \
            scripts/watch_packet_quality.py \
            scripts/watch_quality_projection.py \
            scripts/watch_quality_projection_v2.py \
            scripts/watch_quality_governed_builder.py \
            scripts/watch_quality_gate3_sample_rebuild.py \
            scripts/watch_quality_gate3_sample_rebuild_v2.py \
            scripts/watch_quality_gate4_verify.py \
            scripts/watch_quality_local_scheduler.py \
            scripts/watch_quality_gate6_selection.py \
            scripts/watch_quality_gate6_bound_scheduler.py \
            scripts/strategy_ticket_validator.py \
            scripts/strategy_ticket_review.py \
            scripts/strategy_ticket_reconciler.py \
            scripts/run_ticket_review_job.py \
            scripts/watch_decision_scheduler.py \
            scripts/watch_quality_audit.py
