# Mergify — merge actor for Trade AI (AGENTS.md §25.10 / 24.0.0).
# Mergify merges to main inside ET windows; the host deploy_on_main poller promotes CURRENT.
# Agents never merge. Installing / re-permissioning the Mergify GitHub App is §17.
#
# Go signal: Telegram Approve → host adds label ``operator-merge`` (no GitHub Approve UI).
# Required checks must match GitHub check names exactly.
# Schedule uses America/New_York (DST-aware). Market-hours freeze: no merge Mon–Fri 09:30–16:15 ET.

pull_request_rules:
  - name: Hold broker / Active Trader / MBI / secrets forever
    conditions:
      - or:
          - label=broker_active_trader
          - label=held
          - label=broker
          - files~=^(scripts/active_trader/|scripts/brokers/|scripts/moomoo/)
          - files~=^(\.env|config/secret_registry\.yaml)
    actions:
      label:
        add:
          - held
      comment:
        message: >
          Held: broker / Active Trader / MBI / secrets paths are never Mergify-merged
          (AGENTS.md §0 rules 1–2, §25.10). Operator merge only.

  - name: Queue default when CI green and operator-merge (Telegram Approve)
    conditions:
      - base=main
      - -draft
      - label=operator-merge
      - check-success=cio-hardening
      - check-success=agent-governance
      - check-success=release-readiness
      - check-success=ci-gate
      - label!=held
      - label!=broker
      - label!=broker_active_trader
      - label!=solo
      - label!=shared-infra
      - or:
          - schedule=Mon-Fri 16:15-23:59[America/New_York]
          - schedule=Mon-Fri 00:00-09:30[America/New_York]
          - schedule=Sat-Sun 00:00-23:59[America/New_York]
    actions:
      queue:
        name: default

  - name: Queue solo / shared-infra one-at-a-time
    conditions:
      - base=main
      - -draft
      - label=operator-merge
      - check-success=cio-hardening
      - check-success=agent-governance
      - check-success=release-readiness
      - check-success=ci-gate
      - or:
          - label=solo
          - label=shared-infra
      - label!=held
      - label!=broker
      - label!=broker_active_trader
      - or:
          - schedule=Mon-Fri 16:15-23:59[America/New_York]
          - schedule=Mon-Fri 00:00-09:30[America/New_York]
          - schedule=Sat-Sun 00:00-23:59[America/New_York]
    actions:
      queue:
        name: solo

queue_rules:
  - name: default
    # batch_size 1 until speculative draft PRs run the four required checks (mergify/* CI).
    # Cause 2026-10-27: batch+draft skipped cio-hardening/ci-gate/release-readiness → CHECKS_FAILED bisect.
    batch_size: 1
    merge_method: squash
    merge_conditions:
      # Match branch protection: success OR skipped OR neutral (not failure).
      # Speculative Mergify drafts used to skip CI; requiring check-success dequeued every PR.
      # Entry rules above still require check-success on the real (non-draft) PR.
      - or:
          - check-success=cio-hardening
          - check-skipped=cio-hardening
          - check-neutral=cio-hardening
      - or:
          - check-success=agent-governance
          - check-skipped=agent-governance
          - check-neutral=agent-governance
      - or:
          - check-success=release-readiness
          - check-skipped=release-readiness
          - check-neutral=release-readiness
      - or:
          - check-success=ci-gate
          - check-skipped=ci-gate
          - check-neutral=ci-gate
      - label=operator-merge
      - or:
          - schedule=Mon-Fri 16:15-23:59[America/New_York]
          - schedule=Mon-Fri 00:00-09:30[America/New_York]
          - schedule=Sat-Sun 00:00-23:59[America/New_York]

  - name: solo
    batch_size: 1
    merge_method: squash
    merge_conditions:
      - or:
          - check-success=cio-hardening
          - check-skipped=cio-hardening
          - check-neutral=cio-hardening
      - or:
          - check-success=agent-governance
          - check-skipped=agent-governance
          - check-neutral=agent-governance
      - or:
          - check-success=release-readiness
          - check-skipped=release-readiness
          - check-neutral=release-readiness
      - or:
          - check-success=ci-gate
          - check-skipped=ci-gate
          - check-neutral=ci-gate
      - label=operator-merge
      - or:
          - schedule=Mon-Fri 16:15-23:59[America/New_York]
          - schedule=Mon-Fri 00:00-09:30[America/New_York]
          - schedule=Sat-Sun 00:00-23:59[America/New_York]
