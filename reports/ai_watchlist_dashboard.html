<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Watchlist Command Center</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#0a0d12;color:#e5e7eb;margin:0;padding:22px}
h1{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-0.02em}.muted{color:#586578;font-size:11px}.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
.card{background:rgba(16,20,28,0.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px}.card h2{font-size:26px;margin:6px 0 0;font-weight:800}.card .label{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#586578}
.toolbar,.agentbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(16,20,28,0.92);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin:12px 0}
input,select,button{background:#0a0d12;color:#e5e7eb;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit}
button{cursor:pointer;font-weight:600;transition:all .1s}button:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.2)}
table{width:100%;border-collapse:collapse;background:rgba(16,20,28,0.92);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.07)}
th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05);text-align:left;font-size:11px;vertical-align:top}
th{background:rgba(10,13,18,0.8);color:#8a95a8;font-size:9px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:2}
tr:hover{background:rgba(255,255,255,0.03)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:9px;font-weight:700;background:rgba(74,144,244,0.12);color:#4a90f4}
.pill.portfolio{background:rgba(14,203,129,0.1);color:#0ecb81}.pill.discovered{background:rgba(167,139,250,0.1);color:#a78bfa}
.pill.personal{background:rgba(240,185,11,0.1);color:#f0b90b}.pill.queued{background:rgba(246,70,93,0.1);color:#f6465d}
.good{color:#0ecb81}.warn{color:#f0b90b}.bad{color:#f6465d}
.bar{height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;width:60px;display:inline-block;vertical-align:middle;margin-left:4px}
.fill{height:100%;border-radius:99px}.fill.g{background:#0ecb81}.fill.w{background:#f0b90b}.fill.b{background:#f6465d}
#error{display:none;background:rgba(127,29,29,0.3);border:1px solid #f6465d;color:#fecaca;padding:12px;border-radius:12px;white-space:pre-wrap;margin:12px 0;font-size:11px}
.drawer{position:fixed;right:-560px;top:0;width:520px;height:100vh;background:#0a0d12;border-left:1px solid rgba(255,255,255,0.1);box-shadow:-8px 0 30px rgba(0,0,0,.5);transition:right .25s;z-index:50;padding:20px;overflow-y:auto}
.drawer.open{right:0}.x{float:right;font-size:20px;cursor:pointer;color:#586578;padding:4px 8px;border-radius:6px}.x:hover{background:rgba(255,255,255,0.06)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px;margin:6px 0;font-size:11px}.kv div:first-child{color:#586578}
a{color:#4a90f4;text-decoration:none}.debug{margin-top:20px;padding:12px;background:rgba(16,20,28,0.92);border:1px solid rgba(255,255,255,0.07);border-radius:10px;font-size:10px;color:#586578}
</style>
</head>
<body>
<div class="top">
  <div><h1>AI Watchlist Command Center</h1><div class="muted" id="stamp">Loading...</div></div>
  <div style="display:flex;gap:8px">
    <button onclick="load()">⟳ Refresh</button>
    <button onclick="copyVisible()">Copy Visible</button>
  </div>
</div>

<div id="error"></div>

<div class="grid">
  <div class="card"><div class="label">Total Active</div><h2 id="m_total">-</h2></div>
  <div class="card"><div class="label">Portfolio</div><h2 id="m_portfolio">-</h2></div>
  <div class="card"><div class="label">AI Discovered</div><h2 id="m_discovered">-</h2></div>
  <div class="card"><div class="label">AI Watchlist</div><h2 id="m_watchlist">-</h2></div>
  <div class="card"><div class="label">Personal</div><h2 id="m_personal">-</h2></div>
  <div class="card"><div class="label">Research Cards</div><h2 id="m_cards">-</h2></div>
</div>

<div class="agentbar">
  <b style="font-size:11px">Submit selected →</b>
  <select id="agent"><option value="maria">Maria Research</option><option value="steph">Steph Allocation</option><option value="risk_agent">Risk Review</option><option value="tax_agent">Tax Review</option><option value="full_chain">Full Chain</option></select>
  <select id="rtype"><option value="research">Research</option><option value="trade_plan">Trade Plan</option><option value="allocation">Allocation</option><option value="remove_review">Remove Review</option></select>
  <input id="note" placeholder="optional note" style="width:280px">
  <button onclick="submitSelected()" style="background:rgba(74,144,244,0.1);border-color:#4a90f4;color:#4a90f4">Submit Selected</button>
  <button onclick="processQueue()" style="background:rgba(14,203,129,0.08);border-color:#0ecb81;color:#0ecb81">Process Queue</button>
  <span class="muted" id="submitStatus" style="font-size:11px"></span>
</div>

<div class="toolbar">
  <input id="q" placeholder="Search symbol..." oninput="loadItems()" style="width:140px">
  <select id="source" onchange="loadItems()">
    <option value="">All sources</option>
    <option value="portfolio">Portfolio</option>
    <option value="ai_discovered">AI Discovered</option>
    <option value="ai_watchlist">AI Watchlist</option>
    <option value="personal_watchlist">Personal</option>
  </select>
  <select id="status" onchange="loadItems()">
    <option value="">All status</option>
    <option value="active">Active</option>
    <option value="queued">Queued</option>
    <option value="researched">Researched</option>
    <option value="review">Review</option>
    <option value="removed">Removed</option>
  </select>
  <select id="bucket" onchange="loadItems()"><option value="">All buckets</option><option value="compounder">Compounder</option><option value="research_queue">Research Queue</option></select>
  <select id="asset" onchange="loadItems()"><option value="">All types</option><option value="stock">Stock</option><option value="etf">ETF</option><option value="mutual_fund">Fund</option></select>
  <select id="sort" onchange="loadItems()"><option value="updated">Sort: Recent</option><option value="score">Sort: Score</option><option value="symbol">Sort: Symbol</option></select>
  <span class="muted" id="itemCount"></span>
</div>

<div style="max-height:60vh;overflow-y:auto">
<table>
<thead><tr><th><input type="checkbox" onclick="toggleAll(this)"></th><th>Symbol</th><th>Source</th><th>Type</th><th>Bucket</th><th>Score</th><th>Status</th><th>Research</th><th>Links</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<div id="drawer" class="drawer"><span class="x" onclick="closeDrawer()">×</span><div id="drawerContent"></div></div>

<!-- Debug/Health panel -->
<div class="debug" id="debugPanel">
  <b>System Health</b> · <span id="debugInfo">Loading...</span>
</div>

<script>
/* ═══ DB-BACKED API ONLY — No direct JSON file reads ═══ */
const API = '';  // same origin, port 7777
let ITEMS = [], SELECTED = new Set();

function showError(e) { const d = document.getElementById('error'); d.style.display = 'block'; d.textContent = String(e?.stack || e?.message || e); }
function hideError() { document.getElementById('error').style.display = 'none'; }
function finviz(s) { return `https://finviz.com/quote.ashx?t=${encodeURIComponent(s)}`; }
function scoreBar(x) { x = Number(x || 0); const c = x >= 70 ? 'g' : x >= 40 ? 'w' : 'b'; return `<span class="${x>=70?'good':x>=40?'warn':'bad'}">${x||'—'}</span><div class="bar"><div class="fill ${c}" style="width:${Math.max(0,Math.min(100,x))}%"></div></div>`; }

async function apiGet(path) {
  const r = await fetch(API + path, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  const j = await r.json();
  return j.data || j;
}

async function apiPost(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return await r.json();
}

async function load() {
  hideError();
  try {
    // Load summary from DB API
    const summary = await apiGet('/api/v2/watchlist/summary');
    document.getElementById('m_total').textContent = summary.total_active || 0;
    document.getElementById('m_portfolio').textContent = summary.by_source?.portfolio || 0;
    document.getElementById('m_discovered').textContent = summary.by_source?.ai_discovered || 0;
    document.getElementById('m_watchlist').textContent = summary.by_source?.ai_watchlist || 0;
    document.getElementById('m_personal').textContent = summary.by_source?.personal_watchlist || 0;
    document.getElementById('m_cards').textContent = summary.research_cards || 0;
    document.getElementById('stamp').textContent = `DB-backed · ${new Date().toLocaleTimeString()} · ${summary.total_active} active`;

    // Load items
    await loadItems();

    // Load debug
    const debug = await apiGet('/api/v2/watchlist/debug');
    const tables = debug.tables || {};
    const lastEvent = (debug.last_events || [])[0];
    document.getElementById('debugInfo').textContent = `Items: ${tables.watchlist_items || 0} · Jobs: ${tables.watchlist_agent_jobs || 0} · Results: ${tables.watchlist_agent_results || 0} · Cards: ${tables.watchlist_research_cards || 0} · Last event: ${lastEvent ? lastEvent.event_type + ' ' + (lastEvent.symbol || '') : 'none'}`;
  } catch (e) { showError(e); }
}

async function loadItems() {
  try {
    const params = new URLSearchParams();
    const source = document.getElementById('source').value;
    const status = document.getElementById('status').value;
    const bucket = document.getElementById('bucket').value;
    const asset = document.getElementById('asset').value;
    const sort = document.getElementById('sort').value;
    const q = document.getElementById('q').value.trim();
    if (source) params.set('source', source);
    if (status) params.set('status', status);
    if (bucket) params.set('bucket', bucket);
    if (asset) params.set('asset_type', asset);
    if (sort) params.set('sort', sort);

    const data = await apiGet('/api/v2/watchlist/items?' + params.toString());
    ITEMS = data.items || [];

    // Client-side search filter (q)
    if (q) {
      const ql = q.toLowerCase();
      ITEMS = ITEMS.filter(x => x.symbol?.toLowerCase().includes(ql) || JSON.stringify(x).toLowerCase().includes(ql));
    }

    document.getElementById('itemCount').textContent = `${ITEMS.length} items`;
    renderTable();
  } catch (e) { showError(e); }
}

function renderTable() {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  ITEMS.forEach(item => {
    const sym = item.symbol || '';
    const sourceClass = item.source === 'portfolio' ? 'portfolio' : item.source === 'ai_discovered' ? 'discovered' : item.source === 'personal_watchlist' ? 'personal' : '';
    const sourceLabel = (item.source || '').replace(/_/g, ' ');
    const score = item.score || item.backtest_score || '';
    const research = item.status === 'researched' ? '<span class="good">✓ Researched</span>' : item.status === 'queued' ? '<span class="warn">Queued</span>' : '<span class="muted">—</span>';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox" ${SELECTED.has(sym) ? 'checked' : ''} onclick="setSel('${sym}',this.checked)"></td>
      <td onclick="openDrawer('${sym}')" style="cursor:pointer"><b style="color:#4a90f4">${sym}</b></td>
      <td><span class="pill ${sourceClass}">${sourceLabel}</span></td>
      <td>${item.asset_type || '—'}</td>
      <td>${item.bucket ? `<span class="pill">${item.bucket}</span>` : '—'}</td>
      <td>${scoreBar(score)}</td>
      <td><span class="pill ${item.status === 'queued' ? 'queued' : ''}">${item.status || 'active'}</span></td>
      <td>${research}</td>
      <td><a target="_blank" href="${finviz(sym)}">Finviz</a></td>
    `;
    tbody.appendChild(tr);
  });
}

function setSel(s, on) { on ? SELECTED.add(s) : SELECTED.delete(s); }
function toggleAll(cb) { ITEMS.forEach(x => cb.checked ? SELECTED.add(x.symbol) : SELECTED.delete(x.symbol)); renderTable(); }

async function submitSelected() {
  const symbols = [...SELECTED];
  if (!symbols.length) { alert('Select symbols first'); return; }
  const status = document.getElementById('submitStatus');
  status.textContent = 'Submitting...';
  try {
    const r = await apiPost('/api/v2/watchlist/submit', {
      symbols,
      agent: document.getElementById('agent').value,
      request_type: document.getElementById('rtype').value,
      note: document.getElementById('note').value
    });
    status.textContent = r.ok ? `Queued ${r.created_jobs?.length || 0} jobs` : `Error: ${r.error}`;
    SELECTED.clear();
    setTimeout(load, 1000);
  } catch (e) { status.textContent = 'Error: ' + e.message; }
}

async function processQueue() {
  const status = document.getElementById('submitStatus');
  status.textContent = 'Processing...';
  try {
    await apiPost('/api/v2/watchlist/submit', { symbols: [], agent: 'maria', request_type: 'process' });
    status.textContent = 'Triggered processing';
    setTimeout(load, 3000);
  } catch (e) { status.textContent = 'Error'; }
}

async function openDrawer(sym) {
  try {
    const data = await apiGet(`/api/v2/watchlist/research-card/${sym}`);
    const card = data.card || {};
    const items = data.items || [];
    const results = data.results || [];
    const events = data.events || [];

    let html = `<h2 style="font-size:24px;font-weight:800;color:#4a90f4;margin:0 0 4px">${sym}</h2>`;
    html += `<div class="muted" style="margin-bottom:16px">${items.map(i => `<span class="pill ${i.source === 'portfolio' ? 'portfolio' : ''}">${i.source}</span>`).join(' ')} · ${items[0]?.asset_type || ''}</div>`;

    // Research card
    if (card.latest_summary) {
      html += `<div style="padding:12px;background:rgba(14,203,129,0.06);border:1px solid rgba(14,203,129,0.15);border-radius:8px;margin-bottom:12px">`;
      html += `<div style="font-size:9px;color:#0ecb81;text-transform:uppercase;margin-bottom:4px">Latest Research</div>`;
      html += `<div style="font-size:12px;color:#e5e7eb;line-height:1.6">${card.latest_summary}</div>`;
      html += `<div style="font-size:10px;color:#586578;margin-top:6px">Recommendation: <b>${card.latest_recommendation || '—'}</b> · Confidence: ${card.confidence ? (card.confidence * 100).toFixed(0) + '%' : '—'}</div>`;
      html += `</div>`;
    } else {
      html += `<div style="padding:12px;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:12px;color:#586578">No research card yet. Submit to an agent.</div>`;
    }

    // Agent results
    if (results.length) {
      html += `<h3 style="font-size:12px;color:#8a95a8;margin:12px 0 6px">Agent Results (${results.length})</h3>`;
      results.forEach(r => {
        html += `<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px"><b>${r.agent}</b>: ${r.summary || '—'} <span class="muted">${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</span></div>`;
      });
    }

    // Events
    if (events.length) {
      html += `<h3 style="font-size:12px;color:#8a95a8;margin:12px 0 6px">Events (${events.length})</h3>`;
      events.slice(0, 8).forEach(e => {
        html += `<div style="font-size:10px;color:#586578;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03)">${e.event_type} · ${e.status || ''} · ${e.message || ''}</div>`;
      });
    }

    // Items detail
    html += `<h3 style="font-size:12px;color:#8a95a8;margin:12px 0 6px">Source Membership</h3>`;
    items.forEach(i => {
      html += `<div class="kv"><div>${i.source}</div><div>${i.bucket || '—'} · ${i.status} · score: ${i.score || '—'}</div></div>`;
    });

    html += `<div style="margin-top:16px"><a target="_blank" href="${finviz(sym)}">Open Finviz →</a></div>`;

    document.getElementById('drawerContent').innerHTML = html;
    document.getElementById('drawer').classList.add('open');
  } catch (e) { showError(e); }
}

function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
function copyVisible() { navigator.clipboard.writeText(ITEMS.map(x => x.symbol).join('\n')); alert('Copied ' + ITEMS.length); }

// Initial load
load();
</script>
</body>
</html>
