<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Portfolio & Retirement Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{surface:'#0f1117',card:'#161822',border:'#1e2230',accent:'#3b82f6',up:'#10b981',dn:'#ef4444',warn:'#f59e0b',muted:'#6b7280',dim:'#374151'}}}}</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body{background:#0f1117;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;margin:0}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#161822}::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
  .fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo} = React;

// ═══════════════════════════════════════════════════════════════════
// DATA LAYER — Fetch live JSON from portfolio server
// ═══════════════════════════════════════════════════════════════════
const ENDPOINTS = {
  holdings:    '/data/portfolios/state/holdings.json',
  perf:        '/data/portfolios/state/performance_history.json',
  ai:          '/data/portfolios/state/ai_analysis_cache.json',
  risk:        '/data/portfolios/state/risk_management.json',
  retirement:  '/data/portfolios/state/retirement_roadmap.json',
  dividends:   '/data/portfolios/state/dividend_calendar.json',
  tax:         '/data/portfolios/state/tax_projection.json',
  stress:      '/data/portfolios/state/stress_test.json',
  signals:     '/data/portfolios/state/action_signals.json',
  correlation: '/data/portfolios/state/correlation.json',
  technical:   '/data/portfolios/state/technical_snapshot.json',
  stops:       '/data/portfolios/state/stops.json',
  enrichment:  '/data/portfolios/state/ticker_enrichment_cache.json',
  options:     '/data/portfolios/state/portfolio_options.json',
  advisory:    '/data/portfolios/state/monthly_advisory.json',
  news:        '/data/portfolios/state/portfolio_news.json',
  newsWeekly:  '/data/portfolios/state/portfolio_news_weekly.json',
  newsMonthly: '/data/portfolios/state/portfolio_news_monthly.json',
};

function usePortfolioData() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [errors, setErrors] = useState([]);
  useEffect(() => {
    Promise.all(
      Object.entries(ENDPOINTS).map(([key, url]) =>
        fetch(url).then(r => r.ok ? r.json() : null).catch(() => null).then(d => [key, d])
      )
    ).then(results => {
      const obj = {};
      const errs = [];
      results.forEach(([k, v]) => { obj[k] = v || {}; if (!v) errs.push(k); });
      setData(obj);
      setErrors(errs);
      setLoading(false);
    });
  }, []);
  return { data, loading, errors };
}

// ═══════════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════════════════
const fmt$ = (v, d=0) => v == null ? '—' : '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (v, d=1) => v == null ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(d) + '%';
const fmtNum = (v, d=0) => v == null ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});

// ═══════════════════════════════════════════════════════════════════
// REUSABLE COMPONENTS
// ═══════════════════════════════════════════════════════════════════

function KpiCard({label, value, sub, color, warn}) {
  return (
    <div className="bg-card border border-border rounded-lg p-4 relative">
      <div className="text-[10px] uppercase tracking-wider text-muted mb-1.5">{label}</div>
      <div className="text-xl font-bold" style={{color: color || '#e5e7eb'}}>{value}</div>
      {sub && <div className="text-xs text-muted mt-1">{sub}</div>}
      {warn && <div className="absolute top-2 right-2 w-2 h-2 bg-warn rounded-full" title={warn}></div>}
    </div>
  );
}

function SectionHeader({icon, title, subtitle, thesis, badge}) {
  return (
    <div className="mb-4 mt-10 first:mt-0">
      <div className="flex items-center gap-3 mb-1">
        {icon && <span className="text-lg">{icon}</span>}
        <h2 className="text-lg font-bold text-white tracking-tight">{title}</h2>
        {badge && <span className="text-[9px] px-2 py-0.5 rounded-full bg-accent/10 text-accent font-semibold uppercase tracking-wide">{badge}</span>}
      </div>
      {subtitle && <p className="text-xs text-muted ml-7">{subtitle}</p>}
      {thesis && <p className="text-[11px] text-blue-300/70 ml-7 mt-0.5 italic">{thesis}</p>}
    </div>
  );
}

function DataIntegrityBadge({issues}) {
  const [open, setOpen] = useState(false);
  if (!issues || issues.length === 0) return <span className="text-[9px] px-2 py-0.5 rounded-full bg-up/10 text-up">Data OK</span>;
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="text-[9px] px-2 py-0.5 rounded-full bg-warn/10 text-warn cursor-pointer hover:bg-warn/20">
        ⚠ {issues.length} conflict{issues.length > 1 ? 's' : ''}
      </button>
      {open && (
        <div className="absolute right-0 top-6 z-50 bg-card border border-border rounded-lg p-3 w-72 shadow-xl">
          {issues.map((iss, i) => <div key={i} className="text-[10px] text-warn/80 mb-1">• {iss}</div>)}
        </div>
      )}
    </div>
  );
}

function RecommendationCard({title, children, color}) {
  const c = color || '#3b82f6';
  return (
    <div className="rounded-lg p-4 mb-3" style={{background:`${c}08`, borderLeft:`3px solid ${c}`}}>
      {title && <div className="text-[10px] font-bold uppercase tracking-wider mb-2" style={{color:c}}>{title}</div>}
      <div className="text-sm text-gray-200 leading-relaxed">{children}</div>
    </div>
  );
}

function StatusBadge({status}) {
  const map = {done:'bg-up/15 text-up', pending:'bg-warn/15 text-warn', blocked:'bg-dn/15 text-dn', info:'bg-accent/15 text-accent'};
  const icons = {done:'✓', pending:'○', blocked:'✗', info:'→'};
  return <span className={`text-[9px] px-1.5 py-0.5 rounded font-semibold ${map[status]||map.info}`}>{icons[status]||'·'} {status.toUpperCase()}</span>;
}

function ChecklistItem({status, text, detail}) {
  const colors = {done:'border-up/40 bg-up/5', pending:'border-warn/40 bg-warn/5', blocked:'border-dn/40 bg-dn/5'};
  const icons = {done:'✓', pending:'○', blocked:'✗'};
  const ic = {done:'text-up', pending:'text-warn', blocked:'text-dn'};
  return (
    <div className={`flex items-start gap-3 p-2.5 rounded-md border-l-2 mb-1.5 ${colors[status]||colors.pending}`}>
      <span className={`text-sm font-bold mt-0.5 ${ic[status]||ic.pending}`}>{icons[status]||'·'}</span>
      <div>
        <div className="text-[12px] text-gray-200 font-medium">{text}</div>
        {detail && <div className="text-[10px] text-muted mt-0.5">{detail}</div>}
      </div>
    </div>
  );
}

function ScenarioCard({title, values, highlight, risk}) {
  return (
    <div className={`bg-card border rounded-lg p-4 ${highlight ? 'border-accent/40 ring-1 ring-accent/20' : 'border-border'}`}>
      <div className="text-xs font-bold text-gray-200 mb-2">{title}</div>
      {values && values.map(([k,v], i) => (
        <div key={i} className="flex justify-between text-[11px] py-0.5">
          <span className="text-muted">{k}</span>
          <span className="font-semibold text-gray-300">{v}</span>
        </div>
      ))}
      {highlight && <div className="text-[9px] text-accent font-bold mt-2 uppercase">← Recommended</div>}
      {risk && <div className="text-[10px] text-muted mt-2 italic">Risk: {risk}</div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SVG CHART COMPONENTS
// ═══════════════════════════════════════════════════════════════════

function DonutChart({data, size=160, thickness=24, centerLabel, centerValue}) {
  const total = data.reduce((s, d) => s + d.value, 0);
  const r = (size - thickness) / 2;
  const circ = 2 * Math.PI * r;
  let cum = 0;
  return (
    <div className="flex items-center gap-6">
      <svg width={size} height={size} className="flex-shrink-0">
        {data.map((d, i) => {
          const pct = d.value / total;
          const offset = circ * (1 - cum);
          cum += pct;
          return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
            strokeDasharray={`${circ * pct} ${circ * (1 - pct)}`}
            strokeDashoffset={offset} transform={`rotate(-90 ${size/2} ${size/2})`} />;
        })}
        {centerLabel && <>
          <text x={size/2} y={size/2-6} textAnchor="middle" fill="#e5e7eb" fontSize="18" fontWeight="800">{centerValue}</text>
          <text x={size/2} y={size/2+12} textAnchor="middle" fill="#6b7280" fontSize="9">{centerLabel}</text>
        </>}
      </svg>
      <div className="space-y-1">
        {data.map((d, i) => (
          <div key={i} className="flex items-center gap-2">
            <div className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{background:d.color}}></div>
            <span className="text-[10px] text-muted">{d.label}</span>
            <span className="text-[10px] text-gray-400 font-semibold ml-auto">{fmt$(d.value, 0)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function HBarChart({data, maxVal, height=20}) {
  const mx = maxVal || Math.max(...data.map(d => d.value));
  return (
    <div className="space-y-2">
      {data.map((d, i) => (
        <div key={i} className="flex items-center gap-3">
          <span className="text-[11px] text-gray-300 font-semibold w-16 text-right flex-shrink-0">{d.label}</span>
          <div className="flex-1 bg-dim/30 rounded-full overflow-hidden" style={{height}}>
            <div className="h-full rounded-full flex items-center pl-2 transition-all duration-500"
              style={{width:`${Math.max(2, (d.value/mx)*100)}%`, background: d.color || '#3b82f6'}}>
              <span className="text-[9px] text-white font-bold whitespace-nowrap">{d.display || fmt$(d.value,0)}</span>
            </div>
          </div>
          {d.note && <span className="text-[9px] text-muted w-20 flex-shrink-0">{d.note}</span>}
        </div>
      ))}
    </div>
  );
}

function GaugeChart({value, max=100, label, threshold, size=140}) {
  const pct = Math.min(value / max, 1);
  const thPct = threshold ? threshold / max : null;
  const angle = pct * 180;
  const r = size / 2 - 12;
  const arc = (a) => {
    const rad = (a - 180) * Math.PI / 180;
    return `${size/2 + r * Math.cos(rad)},${size/2 + r * Math.sin(rad)}`;
  };
  const color = threshold && value > threshold ? '#ef4444' : value > max * 0.7 ? '#f59e0b' : '#10b981';
  return (
    <div className="text-center">
      <svg width={size} height={size/2 + 20} className="mx-auto">
        <path d={`M ${12},${size/2} A ${r},${r} 0 0,1 ${size-12},${size/2}`} fill="none" stroke="#1e2230" strokeWidth="10" strokeLinecap="round"/>
        <path d={`M ${12},${size/2} A ${r},${r} 0 0,1 ${arc(angle)}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/>
        {thPct && <line x1={size/2 + r * Math.cos((thPct*180-180)*Math.PI/180)} y1={size/2 + r * Math.sin((thPct*180-180)*Math.PI/180)}
          x2={size/2 + (r-14) * Math.cos((thPct*180-180)*Math.PI/180)} y2={size/2 + (r-14) * Math.sin((thPct*180-180)*Math.PI/180)}
          stroke="#f59e0b" strokeWidth="2" strokeDasharray="3,2"/>}
        <text x={size/2} y={size/2-4} textAnchor="middle" fill={color} fontSize="22" fontWeight="800">{typeof value==='number'?value.toFixed(1)+'%':value}</text>
      </svg>
      {label && <div className="text-[10px] text-muted -mt-2">{label}</div>}
    </div>
  );
}

function TimelineChart({events, width='100%'}) {
  return (
    <div className="relative py-4" style={{width}}>
      <div className="absolute top-1/2 left-4 right-4 h-0.5 bg-border -translate-y-1/2"></div>
      <div className="flex justify-between px-2 relative">
        {events.map((e, i) => (
          <div key={i} className="flex flex-col items-center relative" style={{flex:1}}>
            <div className={`w-3 h-3 rounded-full border-2 ${e.active ? 'bg-accent border-accent' : e.done ? 'bg-up border-up' : 'bg-card border-dim'} z-10`}></div>
            <div className="text-[9px] font-bold text-gray-300 mt-1.5 text-center">{e.label}</div>
            <div className="text-[8px] text-muted text-center">{e.date}</div>
            {e.detail && <div className="text-[8px] text-accent text-center">{e.detail}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function ProgressBar({current, target, label, color}) {
  const pct = Math.min(current / target * 100, 100);
  return (
    <div>
      {label && <div className="flex justify-between text-[10px] mb-1">
        <span className="text-muted">{label}</span>
        <span className="text-gray-400">{fmt$(current,0)} / {fmt$(target,0)}</span>
      </div>}
      <div className="h-3 bg-dim/30 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all duration-500" style={{width:`${pct}%`, background: color || '#3b82f6'}}></div>
      </div>
      <div className="text-[9px] text-muted mt-0.5 text-right">{pct.toFixed(0)}% — gap: {fmt$(target-current,0)}</div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// MARKDOWN RENDERER (for AI-generated text sections)
// ═══════════════════════════════════════════════════════════════════
function MdBlock({text}) {
  if (!text) return <div className="text-xs text-muted italic">No data available</div>;
  const lines = String(text).split('\n');
  const elements = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const inl = (s) => {
      const parts = [];
      let last = 0;
      const regex = /\*\*(.+?)\*\*|\*([^*]+?)\*|`([^`]+)`/g;
      let m;
      while ((m = regex.exec(s)) !== null) {
        if (m.index > last) parts.push(<span key={`t${i}-${last}`}>{s.slice(last, m.index)}</span>);
        if (m[1]) parts.push(<strong key={`b${i}-${m.index}`} className="text-amber-400">{m[1]}</strong>);
        else if (m[2]) parts.push(<em key={`i${i}-${m.index}`} className="text-blue-300">{m[2]}</em>);
        else if (m[3]) parts.push(<code key={`c${i}-${m.index}`} className="bg-blue-900/30 text-teal-300 px-1 rounded text-[10px]">{m[3]}</code>);
        last = m.index + m[0].length;
      }
      if (last < s.length) parts.push(<span key={`e${i}-${last}`}>{s.slice(last)}</span>);
      return parts.length ? parts : s;
    };
    // Checklist
    if (/^[-•*]?\s*[✅❌⚠️]/.test(line)) {
      const rest = line.replace(/^[-•*]?\s*[✅❌⚠️]\s*/, '');
      const icon = line.includes('✅') ? '✓' : line.includes('❌') ? '✗' : '!';
      const bc = icon==='✓' ? 'border-up/40 bg-up/5' : icon==='✗' ? 'border-dn/40 bg-dn/5' : 'border-warn/40 bg-warn/5';
      const ic = icon==='✓' ? 'text-up' : icon==='✗' ? 'text-dn' : 'text-warn';
      elements.push(<div key={i} className={`flex items-start gap-2 p-2 rounded border-l-2 mb-1 ${bc}`}>
        <span className={`text-sm font-bold ${ic}`}>{icon}</span>
        <span className="text-[11px] text-gray-200">{inl(rest)}</span>
      </div>);
      continue;
    }
    // Headers
    if (line.startsWith('#### ')) { elements.push(<p key={i} className="text-[9px] font-bold text-muted uppercase tracking-wider mt-3 mb-1">{inl(line.slice(5))}</p>); continue; }
    if (line.startsWith('### ')) { elements.push(<div key={i} className="text-xs font-bold text-amber-400 mt-3 mb-1 pl-2 border-l-2 border-amber-400/40">{inl(line.slice(4))}</div>); continue; }
    if (line.startsWith('## ')) { elements.push(<div key={i} className="text-sm font-extrabold text-blue-300 mt-4 mb-1.5 pl-2 bg-accent/5 border-l-3 border-accent rounded-r py-1">{inl(line.slice(3))}</div>); continue; }
    if (line.startsWith('# ')) { elements.push(<div key={i} className="text-sm font-black text-white mt-4 mb-2 px-3 py-1.5 bg-accent/10 rounded border-l-4 border-accent">{inl(line.slice(2))}</div>); continue; }
    // RECOMMENDATION/ACTION
    if (/^(RECOMMENDATION|ACTION|KEY RISK|OPTIMAL|PRIORITY):/i.test(line)) {
      const ci = line.indexOf(':');
      const lbl = line.slice(0, ci);
      const rest = line.slice(ci+1).trim();
      const lc = /RISK/i.test(lbl) ? 'border-dn/60 bg-dn/5' : 'border-up/60 bg-up/5';
      const tc = /RISK/i.test(lbl) ? 'text-dn' : 'text-up';
      elements.push(<div key={i} className={`p-3 rounded border-l-3 mb-2 ${lc}`}>
        <span className={`text-[9px] font-extrabold uppercase tracking-wider ${tc}`}>{lbl}</span>
        <div className="text-[11px] text-gray-200 mt-1">{inl(rest)}</div>
      </div>);
      continue;
    }
    // Bullets
    if (/^[•\-*→▸]\s/.test(line)) {
      elements.push(<div key={i} className="flex items-start gap-2 pl-2 py-0.5">
        <span className="text-accent text-xs mt-0.5">▸</span>
        <span className="text-[11px] text-gray-300">{inl(line.replace(/^[•\-*→▸]\s+/, ''))}</span>
      </div>);
      continue;
    }
    // ALL CAPS
    if (line === line.toUpperCase() && line.length > 4 && /[A-Z]/.test(line)) {
      elements.push(<div key={i} className="text-[10px] font-extrabold text-amber-400 tracking-wider mt-3 mb-1">{line}</div>);
      continue;
    }
    // Numbered
    if (/^\d+[\.\)]\s/.test(line)) {
      elements.push(<div key={i} className="pl-2 py-1 my-0.5 border-l-2 border-accent/30 bg-accent/3 rounded-r">
        <span className="text-[11px] text-blue-300 font-bold">{inl(line)}</span>
      </div>);
      continue;
    }
    // Paragraph
    elements.push(<p key={i} className="text-[11px] text-gray-400 leading-relaxed my-1">{inl(line)}</p>);
  }
  return <div>{elements}</div>;
}

// ═══════════════════════════════════════════════════════════════════
// MAIN DASHBOARD SECTIONS
// ═══════════════════════════════════════════════════════════════════

function HeaderHero({data}) {
  const t = data.holdings?.portfolio_totals || {};
  const ret = data.retirement || {};
  const ph = data.perf?.periods || {};
  const divPayers = data.dividends?.payers || [];
  const divTotal = divPayers.reduce((s,p) => s + (p.annual_income||0), 0);
  const tv = t.total_value || 0;
  const accts = data.holdings?.account_summaries || {};
  const rothBal = accts.schwab_roth?.total_value || 0;
  const tradBal = (accts.schwab_rollover_ira?.total_value||0) + (accts.fidelity_401k?.total_value||0);
  const dc = t.day_change || 0;
  const ytd = ph.YTD?.change_pct;

  // Concentration
  const holdings = data.holdings?.holdings || [];
  const bySym = {};
  holdings.forEach(h => { bySym[h.symbol] = (bySym[h.symbol]||0) + (h.market_value||0); });
  const topConc = Object.entries(bySym).sort((a,b) => b[1]-a[1])[0] || ['—',0];

  const issues = [];
  if (Math.abs(rothBal - 42373) < 300 && Math.abs(rothBal - 42643) < 300) issues.push('Roth balance: multiple values in source — using latest');
  const aiDate = data.ai?.generated_at?.slice(0,10) || '—';
  const runType = data.ai?.run_type || 'daily';

  return (
    <div className="mb-8 fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-black text-white tracking-tight">Strategic Portfolio & Retirement Command Center</h1>
          <p className="text-xs text-muted mt-1">Tax efficiency · Income resilience · Concentration risk management</p>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-[9px] px-2 py-0.5 rounded-full bg-accent/10 text-accent font-semibold uppercase">{runType}</span>
          <span className="text-[10px] text-muted">Updated: {aiDate}</span>
          <DataIntegrityBadge issues={issues} />
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
        <KpiCard label="Total Portfolio" value={fmt$(tv,0)} sub={`Today ${dc>=0?'+':''}${fmt$(dc,0)}`} color={dc>=0?'#10b981':'#ef4444'}/>
        <KpiCard label="Roth Balance" value={fmt$(rothBal,0)} sub="Tax-free forever" color="#3b82f6" warn={issues.length?'Multiple values in source':null}/>
        <KpiCard label="Traditional / Pre-Tax" value={fmt$(tradBal,0)} sub="Conversion target pool"/>
        <KpiCard label="Annual Dividends" value={fmt$(divTotal,0)} sub={`${(divTotal/tv*100).toFixed(1)}% yield · Target: $28,000`} color="#f59e0b"/>
        <KpiCard label="2026 Conversion Room" value="$16,000" sub="Remaining 22% bracket" color="#10b981"/>
        <KpiCard label="Top Concentration" value={`${topConc[0]} ${(topConc[1]/tv*100).toFixed(1)}%`} sub={fmt$(topConc[1],0)} color={topConc[1]/tv > 0.15 ? '#ef4444' : '#10b981'}/>
      </div>
      {ytd != null && <div className="mt-3 flex gap-3 text-[10px]">
        {['1W','1M','YTD','1Y'].map(p => {
          const v = ph[p]?.change_pct;
          return v != null ? <span key={p} className={`px-2 py-0.5 rounded ${v>=0?'bg-up/10 text-up':'bg-dn/10 text-dn'}`}>{p} {fmtPct(v)}</span> : null;
        })}
      </div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// POSITION INTELLIGENCE — Decision cockpit for every holding
// ═══════════════════════════════════════════════════════════════════

function PositionIntelligence({data}) {
  const [activeFilters, setActiveFilters] = useState([]);
  const [sortKey, setSortKey] = useState('piScore');
  const [expandedTicker, setExpandedTicker] = useState(null);

  // ── data sources ────────────────────────────────────────────────
  const holdings = data.holdings?.holdings || [];
  const enrichment = data.enrichment || {};
  const newsData = data.news || {};
  const catalysts = newsData.catalysts || [];
  const stops = data.stops || {};
  const technical = data.technical?.positions || {};
  const signals = data.signals || {};
  const retirement = data.retirement || {};
  const keyDates = retirement.key_dates || {};
  const tv = data.holdings?.portfolio_totals?.total_value || 1;

  // ── skip internal / tiny positions ──────────────────────────────
  const SKIP = /^(FID-|SS-|CASH$|FCASH$|SPAXX$|FDRXX$|SWVXX$)/i;

  // ── aggregate holdings by symbol ────────────────────────────────
  const bySymbol = useMemo(() => {
    const map = {};
    holdings.forEach(h => {
      if (SKIP.test(h.symbol)) return;
      if ((h.market_value || 0) < 200) return;
      if (!map[h.symbol]) {
        map[h.symbol] = {
          symbol: h.symbol,
          market_value: 0,
          shares: 0,
          cost_basis: 0,
          gain_loss: 0,
          accounts: [],
        };
      }
      const m = map[h.symbol];
      m.market_value += (h.market_value || 0);
      m.shares += (h.shares || 0);
      m.cost_basis += (h.cost_basis || 0);
      m.gain_loss += (h.gain_loss || 0);
      if (h.account && !m.accounts.includes(h.account)) m.accounts.push(h.account);
    });
    return map;
  }, [holdings]);

  // ── earnings dates helper ───────────────────────────────────────
  const earningsDates = useMemo(() => {
    const dates = {};
    // Try to extract from retirement key_dates or enrichment
    Object.entries(enrichment).forEach(([sym, info]) => {
      if (info && info.earnings_date) {
        dates[sym] = new Date(info.earnings_date);
      }
    });
    return dates;
  }, [enrichment]);

  // ── compute PI score for each position ──────────────────────────
  const computePIScore = useCallback((sym) => {
    const e = enrichment[sym] || {};
    const stopData = stops[sym] || {};
    const price = e.price || bySymbol[sym]?.market_value / (bySymbol[sym]?.shares || 1) || 0;
    const newsForSym = catalysts.filter(c => (c.portfolio_symbol || '').toUpperCase() === sym.toUpperCase());

    // Technical (25%): RSI zone, above SMA200, above SMA50
    let techScore = 50;
    const rsi = e.rsi;
    if (rsi != null) {
      if (rsi >= 40 && rsi <= 60) techScore += 20;
      else if (rsi >= 30 && rsi <= 70) techScore += 10;
      else if (rsi < 30) techScore -= 10;
      else if (rsi > 80) techScore -= 15;
    }
    const sma200 = e.sma200_pct;
    if (sma200 != null) {
      if (sma200 > 0) techScore += 15;
      else techScore -= 10;
    }
    const sma50 = e.sma50_pct;
    if (sma50 != null) {
      if (sma50 > 0) techScore += 15;
      else techScore -= 5;
    }
    techScore = Math.max(0, Math.min(100, techScore));

    // Momentum (25%): week/month/YTD
    let momScore = 50;
    if (e.perf_week_pct != null) momScore += Math.max(-20, Math.min(20, e.perf_week_pct * 3));
    if (e.perf_month_pct != null) momScore += Math.max(-15, Math.min(15, e.perf_month_pct * 1.5));
    if (e.perf_ytd_pct != null) momScore += Math.max(-15, Math.min(15, e.perf_ytd_pct * 0.5));
    momScore = Math.max(0, Math.min(100, momScore));

    // Analyst (20%): rating quality
    let analystScore = 50;
    const rating = (e.analyst_rating || '').toLowerCase();
    if (rating.includes('buy') || rating.includes('outperform') || rating.includes('overweight')) analystScore += 25;
    else if (rating.includes('hold') || rating.includes('neutral') || rating.includes('equal')) analystScore += 5;
    else if (rating.includes('sell') || rating.includes('underperform') || rating.includes('underweight')) analystScore -= 20;
    if (e.forward_pe != null && e.forward_pe > 0 && e.forward_pe < 25) analystScore += 10;
    analystScore = Math.max(0, Math.min(100, analystScore));

    // Risk (15%): stop distance, beta, short interest
    let riskScore = 60;
    if (stopData.stop && price > 0) {
      const stopDist = ((price - stopData.stop) / price) * 100;
      if (stopDist < 3) riskScore -= 25;
      else if (stopDist < 5) riskScore -= 15;
      else if (stopDist < 10) riskScore += 5;
      else riskScore += 10;
    }
    if (e.beta != null) {
      if (e.beta > 1.8) riskScore -= 15;
      else if (e.beta > 1.3) riskScore -= 5;
      else if (e.beta < 0.7) riskScore += 10;
    }
    if (e.short_float_pct != null) {
      if (e.short_float_pct > 10) riskScore -= 15;
      else if (e.short_float_pct > 5) riskScore -= 5;
    }
    riskScore = Math.max(0, Math.min(100, riskScore));

    // Catalyst (15%): news score if available
    let catalystScore = 50;
    if (newsForSym.length > 0) {
      const avgScore = newsForSym.reduce((s, n) => s + (n.llm_score || 0), 0) / newsForSym.length;
      catalystScore = Math.max(0, Math.min(100, avgScore));
    }

    const composite = Math.round(
      techScore * 0.25 +
      momScore * 0.25 +
      analystScore * 0.20 +
      riskScore * 0.15 +
      catalystScore * 0.15
    );

    return {
      total: Math.max(0, Math.min(100, composite)),
      technical: Math.round(techScore),
      momentum: Math.round(momScore),
      analyst: Math.round(analystScore),
      risk: Math.round(riskScore),
      catalyst: Math.round(catalystScore),
    };
  }, [enrichment, stops, catalysts, bySymbol]);

  // ── build enriched position list ────────────────────────────────
  const positions = useMemo(() => {
    return Object.values(bySymbol).map(pos => {
      const sym = pos.symbol;
      const e = enrichment[sym] || {};
      const stopData = stops[sym] || {};
      const price = e.price || pos.market_value / (pos.shares || 1);
      const newsForSym = catalysts.filter(c => (c.portfolio_symbol || '').toUpperCase() === sym.toUpperCase());
      const topNews = newsForSym.sort((a, b) => (b.llm_score || 0) - (a.llm_score || 0))[0] || null;
      const piScore = computePIScore(sym);
      const portfolioPct = (pos.market_value / tv) * 100;

      // Stop distance
      let stopDist = null;
      if (stopData.stop && price > 0) {
        stopDist = ((price - stopData.stop) / price) * 100;
      }

      // Rough target price from forward_pe * eps_next_y
      let targetPrice = null;
      if (e.forward_pe && e.eps_next_y) {
        targetPrice = e.forward_pe * e.eps_next_y;
      }
      const upsideToTarget = targetPrice && price > 0 ? ((targetPrice - price) / price) * 100 : null;

      // Action bias
      let actionBias = 'Hold';
      if (stopDist != null && stopDist < 3) actionBias = 'Watch';
      else if (piScore.total >= 75 && upsideToTarget && upsideToTarget > 10) actionBias = 'Add';
      else if (piScore.total < 35) actionBias = 'Trim';
      else if (stopDist != null && stopDist < 5) actionBias = 'Watch';

      // Earnings within 30 days
      let earningsDate = null;
      let earningsDays = null;
      if (earningsDates[sym]) {
        const now = new Date();
        const diff = Math.ceil((earningsDates[sym] - now) / (1000 * 60 * 60 * 24));
        if (diff >= 0 && diff <= 30) {
          earningsDate = earningsDates[sym].toLocaleDateString('en-US', {month:'short', day:'numeric'});
          earningsDays = diff;
        }
      }

      // Analyst downgrade detection
      const isDowngrade = rating => {
        const r = (rating || '').toLowerCase();
        return r.includes('sell') || r.includes('underperform') || r.includes('underweight');
      };

      return {
        ...pos,
        price,
        enrichment: e,
        piScore,
        portfolioPct,
        stopData,
        stopDist,
        targetPrice,
        upsideToTarget,
        actionBias,
        topNews,
        newsForSym,
        earningsDate,
        earningsDays,
        isDowngrade: isDowngrade(e.analyst_rating),
        hasNegativeNews: newsForSym.some(n => (n.llm_category || '').toLowerCase().includes('negative') || (n.llm_category || '').toLowerCase().includes('risk') || (n.llm_category || '').toLowerCase().includes('bearish')),
        sector: e.sector || '',
        company: e.company || sym,
      };
    });
  }, [bySymbol, enrichment, stops, catalysts, computePIScore, tv, earningsDates]);

  // ── KPI calculations ────────────────────────────────────────────
  const kpis = useMemo(() => {
    const nearStop = positions.filter(p => p.stopDist != null && p.stopDist < 5).length;
    const nearEarnings = positions.filter(p => p.earningsDays != null && p.earningsDays <= 14).length;
    const downgrades = positions.filter(p => p.isDowngrade).length;
    const negNews = positions.filter(p => p.hasNegativeNews).length;
    const avgPI = positions.length > 0
      ? Math.round(positions.reduce((s, p) => s + p.piScore.total, 0) / positions.length)
      : 0;
    return {
      total: positions.length,
      nearStop,
      nearEarnings,
      downgrades,
      negNews,
      avgPI,
    };
  }, [positions]);

  // ── filter logic ────────────────────────────────────────────────
  const filterChips = [
    {key: 'nearStop', label: 'Near Stop', match: p => p.stopDist != null && p.stopDist < 5},
    {key: 'nearEarnings', label: 'Near Earnings', match: p => p.earningsDays != null && p.earningsDays <= 14},
    {key: 'downgrade', label: 'Analyst Downgrade', match: p => p.isDowngrade},
    {key: 'negNews', label: 'Negative News', match: p => p.hasNegativeNews},
    {key: 'techBreak', label: 'Technical Breakdown', match: p => (p.enrichment.sma200_pct != null && p.enrichment.sma200_pct < -5) || (p.enrichment.rsi != null && p.enrichment.rsi < 30)},
    {key: 'highUpside', label: 'High Upside', match: p => p.upsideToTarget != null && p.upsideToTarget > 15},
  ];
  const toggleFilter = (key) => setActiveFilters(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);

  const sortOptions = [
    {key: 'piScore', label: 'PI Score'},
    {key: 'upside', label: 'Upside to Target'},
    {key: 'stopProx', label: 'Stop Proximity'},
    {key: 'catalyst', label: 'Catalyst Score'},
  ];

  // ── filtered + sorted positions ─────────────────────────────────
  const displayed = useMemo(() => {
    let items = [...positions];
    if (activeFilters.length > 0) {
      const matchers = filterChips.filter(f => activeFilters.includes(f.key));
      items = items.filter(p => matchers.some(m => m.match(p)));
    }
    items.sort((a, b) => {
      switch (sortKey) {
        case 'piScore': return b.piScore.total - a.piScore.total;
        case 'upside': return (b.upsideToTarget || -999) - (a.upsideToTarget || -999);
        case 'stopProx': return (a.stopDist == null ? 999 : a.stopDist) - (b.stopDist == null ? 999 : b.stopDist);
        case 'catalyst': return b.piScore.catalyst - a.piScore.catalyst;
        default: return b.piScore.total - a.piScore.total;
      }
    });
    return items;
  }, [positions, activeFilters, sortKey]);

  // ── color helpers ───────────────────────────────────────────────
  const piColor = (score) => score >= 75 ? '#10b981' : score >= 55 ? '#3b82f6' : score >= 40 ? '#f59e0b' : '#ef4444';
  const piBg = (score) => `${piColor(score)}18`;
  const actionColor = (bias) => ({Add:'#10b981', Hold:'#3b82f6', Watch:'#f59e0b', Trim:'#ef4444'}[bias] || '#6b7280');
  const smaStatus = (pct) => pct == null ? '—' : pct > 0 ? 'Above' : 'Below';
  const smaColor = (pct) => pct == null ? '#6b7280' : pct > 0 ? '#10b981' : '#ef4444';

  // ── sector peers helper ─────────────────────────────────────────
  const sectorPeers = useCallback((sym) => {
    const sector = (enrichment[sym] || {}).sector;
    if (!sector) return [];
    return Object.keys(bySymbol).filter(s => s !== sym && (enrichment[s] || {}).sector === sector);
  }, [enrichment, bySymbol]);

  // ── render ──────────────────────────────────────────────────────
  return (
    <div className="fade-in">
      <SectionHeader icon="🧠" title="Position Intelligence" subtitle={`${positions.length} active positions analyzed | Composite decision scoring`} badge="LIVE"/>

      {/* ── KPI Row ──────────────────────────────────────────────── */}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">
        <KpiCard label="Total Positions" value={kpis.total} sub="Active holdings"/>
        <KpiCard label="Near Stop (<5%)" value={kpis.nearStop} sub="Positions at risk" color={kpis.nearStop > 0 ? '#ef4444' : '#10b981'} warn={kpis.nearStop > 0 ? `${kpis.nearStop} position(s) near stop` : null}/>
        <KpiCard label="Near Earnings (<14d)" value={kpis.nearEarnings} sub="Upcoming reports" color={kpis.nearEarnings > 0 ? '#f59e0b' : '#6b7280'}/>
        <KpiCard label="Analyst Downgrades" value={kpis.downgrades} sub="Sell/Underperform" color={kpis.downgrades > 0 ? '#ef4444' : '#10b981'}/>
        <KpiCard label="Negative News" value={kpis.negNews} sub="Risk catalysts" color={kpis.negNews > 0 ? '#ef4444' : '#10b981'}/>
        <KpiCard label="Average PI Score" value={kpis.avgPI} sub="Composite 0-100" color={piColor(kpis.avgPI)}/>
      </div>

      {/* ── Filter / Sort Bar ────────────────────────────────────── */}
      <div className="flex flex-wrap items-center gap-2 mb-5">
        <span className="text-[9px] uppercase tracking-wider text-muted font-bold mr-1">Filters:</span>
        {filterChips.map(f => (
          <button key={f.key} onClick={() => toggleFilter(f.key)}
            className={`text-[10px] px-2.5 py-1 rounded-full font-semibold transition-all cursor-pointer border ${
              activeFilters.includes(f.key)
                ? 'bg-accent/20 text-accent border-accent/40'
                : 'bg-card text-muted border-border hover:border-accent/30 hover:text-gray-300'
            }`}>
            {f.label}
          </button>
        ))}
        <div className="ml-auto flex items-center gap-2">
          <span className="text-[9px] uppercase tracking-wider text-muted font-bold">Sort:</span>
          <select value={sortKey} onChange={e => setSortKey(e.target.value)}
            className="text-[10px] bg-card border border-border rounded px-2 py-1 text-gray-300 cursor-pointer focus:outline-none focus:border-accent/40">
            {sortOptions.map(o => <option key={o.key} value={o.key}>{o.label}</option>)}
          </select>
        </div>
      </div>

      {/* ── Position Cards Grid ──────────────────────────────────── */}
      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-6">
        {displayed.map(pos => {
          const isExpanded = expandedTicker === pos.symbol;
          const e = pos.enrichment;

          return (
            <div key={pos.symbol} className="bg-card border border-border rounded-lg overflow-hidden hover:border-accent/30 transition-all">
              {/* ── Card Header ──────────────────────────────────── */}
              <div className="p-4 cursor-pointer" onClick={() => setExpandedTicker(isExpanded ? null : pos.symbol)}>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-black text-white">{pos.symbol}</span>
                    <span className="text-[10px] text-muted truncate max-w-[140px]">{pos.company}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold" style={{background: piBg(pos.piScore.total), color: piColor(pos.piScore.total)}}>
                      PI {pos.piScore.total}
                    </span>
                    <span className="text-[10px] px-1.5 py-0.5 rounded font-bold" style={{background: `${actionColor(pos.actionBias)}15`, color: actionColor(pos.actionBias)}}>
                      {pos.actionBias}
                    </span>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 mb-2">
                  <div>
                    <div className="text-[9px] text-muted">Price</div>
                    <div className="text-xs font-bold text-gray-200">{fmt$(pos.price, 2)}</div>
                    {e.perf_week_pct != null && (
                      <div className={`text-[9px] font-semibold ${e.perf_week_pct >= 0 ? 'text-up' : 'text-dn'}`}>{fmtPct(e.perf_week_pct)}</div>
                    )}
                  </div>
                  <div>
                    <div className="text-[9px] text-muted">Weight</div>
                    <div className="text-xs font-bold text-gray-200">{pos.portfolioPct.toFixed(1)}%</div>
                    <div className="text-[9px] text-muted">{fmt$(pos.market_value, 0)}</div>
                  </div>
                  <div>
                    <div className="text-[9px] text-muted">Stop Dist</div>
                    <div className={`text-xs font-bold ${pos.stopDist != null ? (pos.stopDist < 5 ? 'text-dn' : pos.stopDist < 10 ? 'text-warn' : 'text-up') : 'text-muted'}`}>
                      {pos.stopDist != null ? pos.stopDist.toFixed(1) + '%' : 'No stop'}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-3 text-[9px] mb-1.5">
                  <span className="text-muted">RSI</span>
                  <span className={`font-bold ${e.rsi != null ? (e.rsi > 70 ? 'text-dn' : e.rsi < 30 ? 'text-warn' : 'text-gray-300') : 'text-muted'}`}>
                    {e.rsi != null ? e.rsi.toFixed(0) : '—'}
                  </span>
                  <span className="text-muted">SMA200</span>
                  <span className="font-bold" style={{color: smaColor(e.sma200_pct)}}>{smaStatus(e.sma200_pct)}</span>
                  {e.analyst_rating && <>
                    <span className="text-muted">Analyst</span>
                    <span className="font-bold text-gray-300">{e.analyst_rating}</span>
                  </>}
                </div>

                {pos.topNews && (
                  <div className="text-[9px] text-blue-300/70 truncate mt-1" title={pos.topNews.title}>
                    ▸ {pos.topNews.title}
                  </div>
                )}

                {pos.earningsDate && (
                  <div className="text-[9px] text-warn mt-1 font-semibold">
                    Earnings in {pos.earningsDays}d ({pos.earningsDate})
                  </div>
                )}
              </div>

              {/* ── Expandable Detail Drawer ─────────────────────── */}
              {isExpanded && (
                <div className="border-t border-border bg-surface/30 px-4 py-4 space-y-4">
                  {/* Decision Header */}
                  <div className="grid grid-cols-5 gap-2">
                    {[
                      {label: 'Action Bias', value: pos.actionBias, color: actionColor(pos.actionBias)},
                      {label: 'Confidence', value: pos.piScore.total >= 70 ? 'High' : pos.piScore.total >= 50 ? 'Medium' : 'Low',
                        color: pos.piScore.total >= 70 ? '#10b981' : pos.piScore.total >= 50 ? '#f59e0b' : '#ef4444'},
                      {label: 'Analyst', value: e.analyst_rating || '—', color: '#3b82f6'},
                      {label: 'Technical', value: e.sma200_pct != null ? (e.sma200_pct > 0 ? 'Bullish' : 'Bearish') : '—',
                        color: e.sma200_pct > 0 ? '#10b981' : '#ef4444'},
                      {label: 'News Tone', value: pos.hasNegativeNews ? 'Negative' : pos.newsForSym.length > 0 ? 'Neutral/Positive' : 'No News',
                        color: pos.hasNegativeNews ? '#ef4444' : '#10b981'},
                    ].map((item, i) => (
                      <div key={i} className="text-center">
                        <div className="text-[8px] text-muted uppercase tracking-wider mb-1">{item.label}</div>
                        <div className="text-[10px] font-bold" style={{color: item.color}}>{item.value}</div>
                      </div>
                    ))}
                  </div>

                  {/* PI Score Breakdown */}
                  <div>
                    <div className="text-[9px] font-bold text-muted uppercase tracking-wider mb-2">PI Score Breakdown</div>
                    <div className="grid grid-cols-5 gap-1">
                      {[
                        {label: 'Technical', value: pos.piScore.technical, weight: '25%'},
                        {label: 'Momentum', value: pos.piScore.momentum, weight: '25%'},
                        {label: 'Analyst', value: pos.piScore.analyst, weight: '20%'},
                        {label: 'Risk', value: pos.piScore.risk, weight: '15%'},
                        {label: 'Catalyst', value: pos.piScore.catalyst, weight: '15%'},
                      ].map((item, i) => (
                        <div key={i} className="text-center">
                          <div className="text-[8px] text-muted">{item.label} ({item.weight})</div>
                          <div className="h-1.5 bg-dim/30 rounded-full overflow-hidden mt-1 mb-0.5">
                            <div className="h-full rounded-full" style={{width: `${item.value}%`, background: piColor(item.value)}}></div>
                          </div>
                          <div className="text-[10px] font-bold" style={{color: piColor(item.value)}}>{item.value}</div>
                        </div>
                      ))}
                    </div>
                  </div>

function PortfolioNews({data}) {
  const news = data.news || {};
  const weekly = data.newsWeekly || {};
  const monthly = data.newsMonthly || {};
  const catalysts = news.catalysts || [];

  // Bail if there is absolutely nothing to show
  if (!catalysts.length && !weekly.strategist_summary && !monthly.strategist_summary) return null;

  // ── state ───────────────────────────────────────────────────────
  const [timeMode, setTimeMode] = useState('daily');
  const [sortCol, setSortCol] = useState('llm_score');
  const [sortAsc, setSortAsc] = useState(false);
  const [activeFilters, setActiveFilters] = useState([]);
  const [expandedRow, setExpandedRow] = useState(null);

  // ── derived data per mode ───────────────────────────────────────
  const activeData = timeMode === 'monthly' ? monthly : timeMode === 'weekly' ? weekly : news;
  const summary = timeMode === 'monthly' ? monthly.strategist_summary
                : timeMode === 'weekly'  ? weekly.strategist_summary
                : news.strategist_summary || weekly.strategist_summary || '';
  const topCatalysts = activeData.top_catalysts || activeData.highest_scoring || catalysts;

  // ── helpers ─────────────────────────────────────────────────────
  const scoreColor = (s) => s >= 80 ? '#10b981' : s >= 60 ? '#3b82f6' : s >= 40 ? '#f59e0b' : '#6b7280';
  const scoreBg    = (s) => `${scoreColor(s)}15`;
  const urgencyBadge = (u) => {
    const map = {
      critical:'bg-red-500/20 text-red-400 border border-red-500/30',
      immediate:'bg-red-500/15 text-red-400',
      high:'bg-orange-500/15 text-orange-400',
      watch:'bg-amber-500/15 text-amber-400',
      monitor:'bg-blue-500/15 text-blue-400',
      ignore:'bg-gray-500/15 text-gray-400'
    };
    return map[(u||'').toLowerCase()] || map.monitor;
  };
  const relevanceBadge = (r) => {
    const map = {
      'company-specific':'bg-purple-500/15 text-purple-400',
      'sector':'bg-cyan-500/15 text-cyan-400',
      'macro':'bg-rose-500/15 text-rose-400',
      'peer':'bg-indigo-500/15 text-indigo-400'
    };
    return map[(r||'').toLowerCase()] || 'bg-gray-500/10 text-gray-400';
  };
  const statusBadgeFor = (c) => {
    if (!c._status) return null;
    const m = {new:'bg-emerald-500/15 text-emerald-400', ongoing:'bg-amber-500/15 text-amber-400', resolved:'bg-blue-500/15 text-blue-400'};
    return m[c._status] || null;
  };

  // ── enrich catalysts with status flags from weekly ─────────────
  const enrichedCatalysts = useMemo(() => {
    const newSet = new Set((weekly.new_this_week || []).map(s => s.toLowerCase()));
    const resolvedSet = new Set((weekly.resolved || []).map(s => s.toLowerCase()));
    const stillActiveSet = new Set((weekly.still_active || []).map(s => s.toLowerCase()));
    return topCatalysts.map(c => {
      const sym = (c.portfolio_symbol || '').toLowerCase();
      let _status = null;
      if (newSet.has(sym)) _status = 'new';
      else if (resolvedSet.has(sym)) _status = 'resolved';
      else if (stillActiveSet.has(sym)) _status = 'ongoing';
      return {...c, _status};
    });
  }, [topCatalysts, weekly]);

  // ── filter chips config ─────────────────────────────────────────
  const filterChips = [
    {key:'critical', label:'Critical', match:c=>(c.llm_urgency||'').toLowerCase()==='critical'||(c.llm_urgency||'').toLowerCase()==='immediate'},
    {key:'high',     label:'High',     match:c=>(c.llm_urgency||'').toLowerCase()==='high'},
    {key:'watch',    label:'Watch',    match:c=>(c.llm_urgency||'').toLowerCase()==='watch'},
    {key:'monitor',  label:'Monitor',  match:c=>(c.llm_urgency||'').toLowerCase()==='monitor'},
    {key:'company',  label:'Company',  match:c=>(c.relevance_type||'').toLowerCase()==='company-specific'},
    {key:'sector',   label:'Sector',   match:c=>(c.relevance_type||'').toLowerCase()==='sector'},
    {key:'macro',    label:'Macro',    match:c=>(c.relevance_type||'').toLowerCase()==='macro'},
    {key:'brave',    label:'Brave',    match:c=>!!c.brave_context},
  ];
  const toggleFilter = (key) => setActiveFilters(prev => prev.includes(key) ? prev.filter(k=>k!==key) : [...prev, key]);

  // ── sort & filter catalysts ─────────────────────────────────────
  const processed = useMemo(() => {
    let items = [...enrichedCatalysts];
    if (activeFilters.length) {
      const matchers = filterChips.filter(f => activeFilters.includes(f.key));
      items = items.filter(c => matchers.some(m => m.match(c)));
    }
    items.sort((a,b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va == null) return 1; if (vb == null) return -1;
      return sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });
    return items;
  }, [enrichedCatalysts, sortCol, sortAsc, activeFilters]);

  // ── KPI counts ──────────────────────────────────────────────────
  const kpis = useMemo(() => {
    const cats = enrichedCatalysts;
    return {
      newCount:      cats.filter(c=>c._status==='new').length || (weekly.new_this_week||[]).length,
      resolvedCount: cats.filter(c=>c._status==='resolved').length || (weekly.resolved||[]).length,
      activeCount:   cats.filter(c=>c._status==='ongoing').length || (weekly.still_active||[]).length,
      criticalCount: cats.filter(c=>{const u=(c.llm_urgency||'').toLowerCase(); return u==='critical'||u==='immediate';}).length,
      watchCount:    cats.filter(c=>(c.llm_urgency||'').toLowerCase()==='watch').length,
      telegramCount: news.telegram_alert_count || cats.filter(c=>c.telegram_sent).length,
      braveCount:    news.brave_enriched_count || cats.filter(c=>!!c.brave_context).length,
    };
  }, [enrichedCatalysts, news, weekly]);

  // ── executive strip cards ───────────────────────────────────────
  const execCards = useMemo(() => {
    const sorted = [...enrichedCatalysts].sort((a,b)=>(b.llm_score||0)-(a.llm_score||0));
    const topPositive = sorted.find(c=>(c.llm_category||'').toLowerCase().includes('positive') || (c.llm_category||'').toLowerCase().includes('bullish'));
    const topRisk = sorted.find(c=>(c.llm_category||'').toLowerCase().includes('risk') || (c.llm_category||'').toLowerCase().includes('negative') || (c.llm_category||'').toLowerCase().includes('bearish'));
    const topCatalyst = sorted[0];
    const changed = enrichedCatalysts.find(c=>c._status==='new');
    const watchItem = sorted.find(c=>(c.llm_urgency||'').toLowerCase()==='watch');
    return [
      {label:'Top Catalyst',    icon:'🎯', text: topCatalyst?.title || '—', ticker: topCatalyst?.portfolio_symbol, score: topCatalyst?.llm_score},
      {label:'Biggest Risk',    icon:'⚠️', text: topRisk?.title || 'None identified', ticker: topRisk?.portfolio_symbol, score: topRisk?.llm_score, color:'#ef4444'},
      {label:'Biggest Positive',icon:'📈', text: topPositive?.title || 'None identified', ticker: topPositive?.portfolio_symbol, score: topPositive?.llm_score, color:'#10b981'},
      {label:'What Changed',    icon:'🔄', text: changed?.title || (weekly.new_this_week?.length ? `${weekly.new_this_week.length} new items` : 'No changes'), ticker: changed?.portfolio_symbol},
      {label:'Watch Next',      icon:'👁️', text: watchItem?.title || 'Nothing flagged', ticker: watchItem?.portfolio_symbol, score: watchItem?.llm_score, color:'#f59e0b'},
    ];
  }, [enrichedCatalysts, weekly]);

  // ── score distribution mini-bar ─────────────────────────────────
  const scoreDist = useMemo(() => {
    const bands = [{label:'80+',color:'#10b981',count:0},{label:'60-79',color:'#3b82f6',count:0},{label:'40-59',color:'#f59e0b',count:0},{label:'<40',color:'#6b7280',count:0}];
    enrichedCatalysts.forEach(c => {
      const s = c.llm_score || 0;
      if (s >= 80) bands[0].count++;
      else if (s >= 60) bands[1].count++;
      else if (s >= 40) bands[2].count++;
      else bands[3].count++;
    });
    const total = enrichedCatalysts.length || 1;
    return bands.map(b => ({...b, pct: Math.round(b.count/total*100)}));
  }, [enrichedCatalysts]);

  // ── top tickers by catalyst count ───────────────────────────────
  const topTickers = useMemo(() => {
    const counts = {};
    enrichedCatalysts.forEach(c => {
      const sym = c.portfolio_symbol || '?';
      counts[sym] = (counts[sym]||0) + 1;
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  }, [enrichedCatalysts]);

  // ── column sort handler ─────────────────────────────────────────
  const handleSort = (col) => {
    if (sortCol === col) setSortAsc(!sortAsc);
    else { setSortCol(col); setSortAsc(false); }
  };
  const sortIcon = (col) => sortCol === col ? (sortAsc ? ' ▲' : ' ▼') : '';

  // ── time mode tabs ──────────────────────────────────────────────
  const modes = [{key:'daily',label:'Daily'},{key:'weekly',label:'Weekly'},{key:'monthly',label:'Monthly'}];

  return (
    <div className="fade-in">
      <SectionHeader icon="📰" title="Portfolio News & Catalyst Intelligence"
        subtitle={`${enrichedCatalysts.length} scored catalysts | ${kpis.braveCount} Brave-enriched | ${news.ticker_count || 0} tickers scanned`}
        badge={timeMode.toUpperCase()}/>

      {/* ── Time-mode selector ─────────────────────────────────── */}
      <div className="flex gap-1 mb-5 bg-card border border-border rounded-lg p-1 w-fit">
        {modes.map(m => (
          <button key={m.key} onClick={()=>{setTimeMode(m.key);setExpandedRow(null);setActiveFilters([]);}}
            className={`px-4 py-1.5 rounded text-[10px] font-bold uppercase tracking-wider transition-all ${timeMode===m.key ? 'bg-accent text-white shadow' : 'text-muted hover:text-gray-300'}`}>
            {m.label}
          </button>
        ))}
      </div>

      {/* ── Executive strip ────────────────────────────────────── */}
      <div className="grid grid-cols-5 gap-3 mb-5">
        {execCards.map((card,i) => (
          <div key={i} className="bg-card border border-border rounded-lg p-3 relative overflow-hidden">
            <div className="flex items-center gap-1.5 mb-1.5">
              <span className="text-sm">{card.icon}</span>
              <span className="text-[9px] uppercase tracking-wider text-muted font-bold">{card.label}</span>
            </div>
            <div className="text-[10px] text-gray-200 leading-snug line-clamp-2" title={card.text}>
              {card.text?.slice(0,80)}{card.text?.length>80?'...':''}
            </div>
            <div className="flex items-center gap-2 mt-1.5">
              {card.ticker && <span className="text-[9px] font-bold text-blue-400">{card.ticker}</span>}
              {card.score != null && (
                <span className="text-[9px] px-1.5 py-0.5 rounded font-bold" style={{color:scoreColor(card.score), background:scoreBg(card.score)}}>
                  {card.score}
                </span>
              )}
            </div>
            {card.color && <div className="absolute top-0 right-0 w-1 h-full" style={{background:card.color, opacity:0.5}}/>}
          </div>
        ))}
      </div>

      {/* ── Enhanced KPI row ───────────────────────────────────── */}
      <div className="grid grid-cols-7 gap-2 mb-5">
        <KpiCard label="New"             value={kpis.newCount}      color="#10b981" sub="this period"/>
        <KpiCard label="Resolved"        value={kpis.resolvedCount} color="#3b82f6" sub="cleared"/>
        <KpiCard label="Still Active"    value={kpis.activeCount}   color="#f59e0b" sub="ongoing"/>
        <KpiCard label="Critical"        value={kpis.criticalCount} color="#ef4444" sub="urgent" warn={kpis.criticalCount>0?`${kpis.criticalCount} critical`:undefined}/>
        <KpiCard label="Watch"           value={kpis.watchCount}    color="#f59e0b" sub="flagged"/>
        <KpiCard label="Telegram Alerts" value={kpis.telegramCount} color="#8b5cf6" sub="sent"/>
        <KpiCard label="Brave-Enriched"  value={kpis.braveCount}    color="#06b6d4" sub="deep context"/>
      </div>

      {/* ── Strategist Summary (markdown) ──────────────────────── */}
      {summary && (
        <RecommendationCard title="Strategist Summary" color="#3b82f6">
          <MdBlock text={summary}/>
        </RecommendationCard>
      )}

      {/* ── Compact visuals: score distribution + top tickers ──── */}
      <div className="grid grid-cols-2 gap-3 mb-5">
        {/* Score distribution mini-bar */}
        <div className="bg-card border border-border rounded-lg p-3">
          <div className="text-[9px] text-muted uppercase tracking-wider mb-2 font-bold">Score Distribution</div>
          <div className="flex h-5 rounded overflow-hidden mb-2">
            {scoreDist.map((b,i) => b.pct > 0 && (
              <div key={i} style={{width:`${b.pct}%`, background:b.color, minWidth: b.pct > 0 ? '4px' : 0}}
                title={`${b.label}: ${b.count} (${b.pct}%)`}/>
            ))}
          </div>
          <div className="flex gap-3">
            {scoreDist.map((b,i) => (
              <div key={i} className="flex items-center gap-1">
                <div className="w-2 h-2 rounded-sm" style={{background:b.color}}/>
                <span className="text-[8px] text-muted">{b.label}: {b.count}</span>
              </div>
            ))}
          </div>
        </div>
        {/* Top tickers by catalyst count */}
        <div className="bg-card border border-border rounded-lg p-3">
          <div className="text-[9px] text-muted uppercase tracking-wider mb-2 font-bold">Top Tickers by Catalyst Count</div>
          <div className="flex flex-wrap gap-2">
            {topTickers.map(([sym, count]) => (
              <div key={sym} className="flex items-center gap-1.5 bg-surface rounded px-2 py-1">
                <span className="text-[10px] font-bold text-blue-400">{sym}</span>
                <span className="text-[9px] text-muted">{count}</span>
              </div>
            ))}
            {topTickers.length === 0 && <span className="text-[10px] text-muted">—</span>}
          </div>
        </div>
      </div>

      {/* ── Monthly themes (monthly mode only) ─────────────────── */}
      {timeMode === 'monthly' && monthly.dominant_themes && Object.keys(monthly.dominant_themes).length > 0 && (
        <div className="grid grid-cols-2 gap-3 mb-5">
          <div className="bg-card border border-border rounded-lg p-3">
            <div className="text-[9px] text-muted uppercase mb-2 font-bold">Dominant Themes</div>
            {Object.entries(monthly.dominant_themes).slice(0,6).map(([theme, count]) => (
              <div key={theme} className="flex justify-between text-[10px] py-0.5">
                <span className="text-gray-300 capitalize">{theme}</span>
                <span className="text-muted">{count} articles</span>
              </div>
            ))}
          </div>
          <div className="bg-card border border-border rounded-lg p-3">
            <div className="text-[9px] text-muted uppercase mb-2 font-bold">Most Active Holdings</div>
            {Object.entries(monthly.most_active_holdings || {}).slice(0,6).map(([sym, count]) => (
              <div key={sym} className="flex justify-between text-[10px] py-0.5">
                <span className="text-gray-200 font-bold">{sym}</span>
                <span className="text-muted">{count} catalysts</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Filter chips ───────────────────────────────────────── */}
      <div className="flex flex-wrap gap-1.5 mb-3">
        {filterChips.map(f => {
          const active = activeFilters.includes(f.key);
          return (
            <button key={f.key} onClick={()=>toggleFilter(f.key)}
              className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase tracking-wider border transition-all ${active ? 'bg-accent/20 border-accent text-accent' : 'bg-card border-border text-muted hover:text-gray-300 hover:border-gray-500'}`}>
              {f.label}
            </button>
          );
        })}
        {activeFilters.length > 0 && (
          <button onClick={()=>setActiveFilters([])}
            className="px-2.5 py-1 rounded-full text-[9px] font-bold text-red-400 border border-red-500/30 hover:bg-red-500/10 transition-all">
            Clear
          </button>
        )}
      </div>

      {/* ── Catalyst triage table ──────────────────────────────── */}
      <div className="bg-card border border-border rounded-lg overflow-hidden mb-4">
        <div className="max-h-[600px] overflow-y-auto">
          <table className="w-full text-[10px]">
            <thead className="sticky top-0 z-10">
              <tr className="border-b border-border bg-surface">
                <th className="text-left px-3 py-2.5 text-muted font-semibold text-[8px] uppercase cursor-pointer hover:text-gray-300 select-none" onClick={()=>handleSort('portfolio_symbol')}>
                  Ticker{sortIcon('portfolio_symbol')}
                </th>
                <th className="text-left px-3 py-2.5 text-muted font-semibold text-[8px] uppercase">Headline</th>
                <th className="text-center px-2 py-2.5 text-muted font-semibold text-[8px] uppercase cursor-pointer hover:text-gray-300 select-none" onClick={()=>handleSort('llm_score')}>
                  Score{sortIcon('llm_score')}
                </th>
                <th className="text-left px-2 py-2.5 text-muted font-semibold text-[8px] uppercase cursor-pointer hover:text-gray-300 select-none" onClick={()=>handleSort('llm_category')}>
                  Category{sortIcon('llm_category')}
                </th>
                <th className="text-left px-2 py-2.5 text-muted font-semibold text-[8px] uppercase cursor-pointer hover:text-gray-300 select-none" onClick={()=>handleSort('llm_urgency')}>
                  Urgency{sortIcon('llm_urgency')}
                </th>
                <th className="text-left px-2 py-2.5 text-muted font-semibold text-[8px] uppercase">Type</th>
                <th className="text-left px-2 py-2.5 text-muted font-semibold text-[8px] uppercase">Status</th>
              </tr>
            </thead>
            <tbody>
              {processed.map((c, i) => {
                const isExpanded = expandedRow === i;
                return (
                  <React.Fragment key={i}>
                    <tr className={`border-b border-border/30 cursor-pointer transition-colors ${isExpanded ? 'bg-accent/5' : 'hover:bg-surface/30'}`}
                      onClick={()=>setExpandedRow(isExpanded ? null : i)}>
                      <td className="px-3 py-2 font-bold text-gray-200">{c.portfolio_symbol || '?'}</td>
                      <td className="px-3 py-2 text-gray-300 max-w-[240px]">
                        <div className="truncate">
                          {c.url ? (
                            <a href={c.url} target="_blank" rel="noopener" className="hover:text-blue-400 transition-colors"
                              onClick={e=>e.stopPropagation()}>
                              {c.title?.slice(0,70) || '—'}
                            </a>
                          ) : (c.title?.slice(0,70) || '—')}
                        </div>
                      </td>
                      <td className="px-2 py-2 text-center">
                        <span className="px-2 py-0.5 rounded text-[9px] font-bold" style={{color:scoreColor(c.llm_score||0), background:scoreBg(c.llm_score||0)}}>
                          {c.llm_score != null ? c.llm_score : '—'}
                        </span>
                      </td>
                      <td className="px-2 py-2 text-gray-400 capitalize text-[9px]">{c.llm_category || '—'}</td>
                      <td className="px-2 py-2">
                        <span className={`text-[8px] px-1.5 py-0.5 rounded font-bold ${urgencyBadge(c.llm_urgency)}`}>
                          {(c.llm_urgency || 'monitor').toUpperCase()}
                        </span>
                      </td>
                      <td className="px-2 py-2">
                        {c.relevance_type && (
                          <span className={`text-[8px] px-1.5 py-0.5 rounded font-medium ${relevanceBadge(c.relevance_type)}`}>
                            {c.relevance_type}
                          </span>
                        )}
                      </td>
                      <td className="px-2 py-2">
                        {c._status && statusBadgeFor(c) && (
                          <span className={`text-[8px] px-1.5 py-0.5 rounded font-bold ${statusBadgeFor(c)}`}>
                            {c._status.toUpperCase()}
                          </span>
                        )}
                        {c.brave_context && <span className="ml-1 text-[8px] text-cyan-400" title="Brave-enriched">B</span>}
                      </td>
                    </tr>
                    {/* ── Detail drawer ──────────────────────── */}
                    {isExpanded && (
                      <tr className="bg-surface/50">
                        <td colSpan={7} className="px-4 py-3">
                          <div className="grid grid-cols-3 gap-4 text-[10px]">
                            <div className="col-span-2 space-y-2">
                              <div className="text-xs font-bold text-gray-200 mb-1">{c.title || '—'}</div>
                              {c.llm_summary && (
                                <div>
                                  <div className="text-[8px] uppercase text-muted font-bold mb-0.5">Why It Matters</div>
                                  <div className="text-gray-300 leading-relaxed"><MdBlock text={c.llm_summary}/></div>
                                </div>
                              )}
                              {c.brave_context && (
                                <div>
                                  <div className="text-[8px] uppercase text-cyan-400 font-bold mb-0.5">Brave Context</div>
                                  <div className="text-gray-400 leading-relaxed text-[10px]"><MdBlock text={c.brave_context}/></div>
                                </div>
                              )}
                            </div>
                            <div className="space-y-1.5 border-l border-border pl-4">
                              <div><span className="text-muted text-[8px] uppercase">Ticker:</span> <span className="text-gray-200 font-bold ml-1">{c.portfolio_symbol || '—'}</span></div>
                              <div><span className="text-muted text-[8px] uppercase">Weight:</span> <span className="text-gray-300 ml-1">{c.portfolio_weight != null ? fmtPct(c.portfolio_weight) : '—'}</span></div>
                              <div><span className="text-muted text-[8px] uppercase">Market Value:</span> <span className="text-gray-300 ml-1">{c.market_value != null ? fmt$(c.market_value) : '—'}</span></div>
                              <div><span className="text-muted text-[8px] uppercase">Provider:</span> <span className="text-gray-300 ml-1">{c.provider || '—'}</span></div>
                              <div><span className="text-muted text-[8px] uppercase">Published:</span> <span className="text-gray-300 ml-1">{c.published?.slice(0,16) || '—'}</span></div>
                              <div><span className="text-muted text-[8px] uppercase">Source URL:</span>{' '}
                                {c.url ? <a href={c.url} target="_blank" rel="noopener" className="text-blue-400 hover:underline ml-1 break-all">{c.url.slice(0,50)}...</a> : <span className="text-gray-400 ml-1">—</span>}
                              </div>
                              <div><span className="text-muted text-[8px] uppercase">Relevance:</span> <span className="text-gray-300 ml-1 capitalize">{c.relevance_type || '—'}</span></div>
                            </div>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {processed.length === 0 && (
                <tr><td colSpan={7} className="text-center py-6 text-muted text-[11px]">No catalysts match the current filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <div className="text-[8px] text-dim text-center">
        Sources: Finnhub · NewsAPI · Polygon · FMP · Finviz · Yahoo Finance · Brave Search | Scored by Ollama qwen3:1.7b | {news.generated_at?.slice(0,10) || '—'}
      </div>
    </div>
  );
}

function DualAdvisory({data}) {
  const adv = data.advisory || {};
  const opus = adv.opus;
  const gpt4o = adv.gpt4o;
  const opusModel = adv.opus_model || 'Claude Opus';
  const gptModel = adv.gpt4o_model || 'GPT-4o';
  const genDate = adv.generated_at?.slice(0,10) || '';

  if (!opus && !gpt4o) return null;

  const [activeTab, setActiveTab] = useState('both');

  return (
    <div className="fade-in">
      <SectionHeader icon="🎯" title="Monthly Advisory — Dual AI Analysis" subtitle="Two different AI systems analyzing the same portfolio data" badge="MONTHLY ONLY"/>
      <div className="flex gap-2 mb-4">
        <button onClick={() => setActiveTab('both')}
          className={`px-3 py-1.5 rounded-lg text-[10px] font-bold cursor-pointer transition-all ${activeTab==='both' ? 'bg-gray-600 text-white' : 'bg-card border border-border text-muted hover:text-white'}`}>
          Side by Side
        </button>
        <button onClick={() => setActiveTab('opus')}
          className={`px-3 py-1.5 rounded-lg text-[10px] font-bold cursor-pointer transition-all ${activeTab==='opus' ? 'bg-blue-600 text-white' : 'bg-card border border-border text-muted hover:text-white'}`}>
          🛡 {opusModel}
        </button>
        <button onClick={() => setActiveTab('gpt4o')}
          className={`px-3 py-1.5 rounded-lg text-[10px] font-bold cursor-pointer transition-all ${activeTab==='gpt4o' ? 'bg-emerald-600 text-white' : 'bg-card border border-border text-muted hover:text-white'}`}>
          ⚡ {gptModel}
        </button>
        {genDate && <span className="text-[9px] text-muted self-center ml-auto">Generated: {genDate}</span>}
      </div>
      <div className={`grid gap-4 ${activeTab==='both' ? 'grid-cols-1 lg:grid-cols-2' : 'grid-cols-1 max-w-4xl'}`}>
        {/* Opus Card */}
        {(activeTab==='both' || activeTab==='opus') && (
        <div className="bg-card border border-blue-500/30 rounded-lg overflow-hidden">
          <div className="px-4 py-3 bg-blue-900/20 border-b border-blue-500/20 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-sm">🛡</span>
              <span className="text-sm font-bold text-blue-300">Conservative Fiduciary View</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-300 font-bold border border-blue-500/30">{opusModel}</span>
              <span className="text-[8px] text-blue-400/60">Anthropic</span>
            </div>
          </div>
          <div className="p-4 max-h-[700px] overflow-y-auto">
            {opus ? <MdBlock text={opus}/> : <span className="text-xs text-muted italic">Run monthly pipeline to generate</span>}
          </div>
        </div>
        )}
        {/* GPT-4o Card */}
        {(activeTab==='both' || activeTab==='gpt4o') && (
        <div className="bg-card border border-emerald-500/30 rounded-lg overflow-hidden">
          <div className="px-4 py-3 bg-emerald-900/20 border-b border-emerald-500/20 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-sm">⚡</span>
              <span className="text-sm font-bold text-emerald-300">Opportunity-Focused View</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">{gptModel}</span>
              <span className="text-[8px] text-emerald-400/60">OpenAI</span>
            </div>
          </div>
          <div className="p-4 max-h-[700px] overflow-y-auto">
            {gpt4o ? <MdBlock text={gpt4o}/> : <span className="text-xs text-muted italic">Run monthly pipeline to generate</span>}
          </div>
        </div>
        )}
      </div>
      <div className="mt-3 text-[9px] text-dim text-center">
        Two different AI systems ({opusModel} + {gptModel}) analyzing the same portfolio data with different investment philosophies. Compare perspectives before acting.
      </div>
    </div>
  );
}

function App() {
  const {data, loading, errors} = usePortfolioData();

  if (loading) return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="text-center">
        <div className="text-2xl mb-2">⚡</div>
        <div className="text-sm text-muted">Loading portfolio data...</div>
      </div>
    </div>
  );

  if (!data) return <div className="p-8 text-dn">Failed to load portfolio data</div>;

  return (
    <div className="max-w-7xl mx-auto px-4 md:px-8 py-6">
      <HeaderHero data={data}/>
      <PrioritiesPanel data={data}/>
      <PositionIntelligence data={data}/>
      <RothStrategy data={data}/>
      <IncomeArchitecture data={data}/>
      <BondStrategy data={data}/>
      <ConcentrationRisk data={data}/>
      <IraOpportunities data={data}/>
      <TacticalSleeve data={data}/>
      <PortfolioNews data={data}/>
      <ActionCenter data={data}/>
      <DualAdvisory data={data}/>
      <AiDeepSections data={data}/>
      <AssumptionsDrawer/>
      <div className="mt-12 mb-8 text-center text-[10px] text-dim border-t border-border pt-4">
        For informational planning use only. Not investment, legal, or tax advice. Verify all figures before execution.
        <br/>Trade AI v12 · Strategic Portfolio & Retirement Command Center
      </div>
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
