# Agent SEC Interaction Configuration
# Defines how each agent uses SEC data (Form 4, 13F, XBRL)
# This is the single source of truth — agents load this at startup.

version: "1.0"

triggers:
  form4:
    - name: large_insider_buy
      condition: "transaction_type = 'P-Purchase' AND total_value > 500000"
      agents: [Maria, Risk, Aegis]
      severity: high
      action: "Flag as bullish catalyst + inject into next analysis"

    - name: large_insider_sell
      condition: "transaction_type = 'S-Sale' AND total_value > 1000000"
      agents: [Maria, Risk, Aegis, Alex]
      severity: high
      action: "Flag as bearish signal + check if income asset"

    - name: ceo_cfo_transaction
      condition: "filer_relation IN ('CEO', 'CFO', 'Director')"
      agents: [Maria, Steph]
      severity: medium
      action: "Include in fundamental analysis"

  form_13f:
    - name: large_ownership_change
      condition: "abs(change_pct) > 5"
      agents: [Maria, Steph, Risk]
      severity: high
      action: "Flag institutional rotation signal"

    - name: new_position
      condition: "change_pct IS NULL OR change_shares = shares"
      agents: [Maria]
      severity: medium
      action: "New institutional interest — research catalyst"

  xbrl:
    - name: earnings_surprise
      condition: "metric_name = 'EarningsPerShareBasic' AND abs(metric_value - consensus) > 10%"
      agents: [Maria, Risk, Aegis]
      severity: high
      action: "Flag earnings surprise + check stop levels"

    - name: revenue_growth
      condition: "metric_name = 'Revenues' AND growth_pct > 15"
      agents: [Maria, Steph]
      severity: medium
      action: "Flag high growth for allocation review"

agents:
  Alex:
    sec_focus:
      - "Tax implications of insider transactions"
      - "Ownership changes affecting Roth/Medicaid planning"
      - "Large insider buys as conversion timing signal"
    auto_inject: true
    sources: [form4, form_13f]

  Maria:
    sec_focus:
      - "XBRL fundamentals for valuation"
      - "13F institutional interest changes"
      - "Form 4 insider patterns as catalysts"
    auto_inject: true
    sources: [form4, form_13f, xbrl]

  Steph:
    sec_focus:
      - "13F for allocation signals (institutional crowding)"
      - "Form 4 for ownership concentration"
      - "Use institutional flows for rebalancing timing"
    auto_inject: true
    sources: [form4, form_13f]

  Risk:
    sec_focus:
      - "Form 4 insider selling as risk signal"
      - "13F large position changes"
      - "Cluster sells = elevated risk"
    auto_inject: true
    sources: [form4, form_13f]

  Aegis:
    sec_focus:
      - "Overnight Form 4 filings for alert"
      - "Large insider buys/sells after hours"
    auto_inject: false
    sources: [form4]

schedule:
  form4: "daily 8 PM"
  form_13f: "quarterly (45 days after quarter end)"
  xbrl: "after 10-K/10-Q filing detected"
