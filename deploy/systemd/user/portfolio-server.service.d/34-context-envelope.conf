# Maturity Production Ready — ContextEnvelope@v1 + token budgets (C8).
# Advisory-context only. MEMORY_BEHAVIOR_INFLUENCE stays 0.
[Service]
Environment=AGENT_CONTEXT_ENVELOPE=1
Environment=AGENT_CONTEXT_TOKEN_BUDGET=4000
Environment=AGENT_PROMPT_TOKEN_BUDGET=8000
Environment=AGENT_EMPTY_RAG_MODE=record
Environment=AGENT_NUMBER_GROUNDING_MODE=enforce
Environment=AGENT_NUMBER_GROUNDING_MIN_UNSUPPORTED=2
Environment=AGENT_NUMBER_GROUNDING_MAX_SHARE=0.20
