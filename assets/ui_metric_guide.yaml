# Metric guide (PR3, 2026-09-27) — THE source of every metric tooltip in the Command Center.
# Served at GET /api/v2/ui/metric-guide; keys are generated into
# apps/command-center-v3/src/lib/metricGuide.keys.generated.ts (scripts/gen_metric_guide_keys.mjs).
# Fields: label, short, definition, why_it_matters, interpretation, benchmark, watch, warning, unit, sources.
# {placeholders} are filled by the frontend from values already in the payload (AGENTS §13).
version: 1
as_of: "2026-09-28"
entries:
  cio.conviction:
    label: "Conviction"
    short: "How strongly the house thesis takes a position."
    definition: "Thesis confidence and stance from the symbol thesis on file."
    why_it_matters: "Low conviction with strong fundamentals means the evidence is thin, not that the name is bad."
    interpretation: "Pair with the research count; THIN theses are marked."
    sources: ["symbol_thesis"]
  cio.decision:
    label: "CIO decision"
    short: "The latest recorded CIO review outcome for this idea."
    definition: "APPROVE, MONITOR_ONLY, MORE_RESEARCH or REJECT, with confidence, from the options lifecycle review."
    why_it_matters: "An order needs APPROVE; MONITOR_ONLY is not approval."
    interpretation: "Read the reasoning and concerns on the card; a decision older than the recheck window is re-reviewed."
    sources: ["options_thesis_lifecycle"]
  freshness.as_of:
    label: "As of"
    short: "When this number was last computed, in ET."
    definition: "Every operator-facing field carries its own as_of and provenance (AGENTS §13)."
    why_it_matters: "A stale number can look current."
    interpretation: "Chips turn to watch when older than the surface's freshness rule."
    sources: ["surface freshness"]
  position.unrealized_pnl:
    label: "Unrealized P/L"
    short: "Open profit or loss on this option leg at the current mark."
    definition: "Mark minus average entry, times quantity and the contract multiplier, in dollars; PNL_UNKNOWN when the broker gave no usable mark."
    why_it_matters: "It is the number the harvest and defend rules act on."
    interpretation: "Read it with the profit-captured percentage: a large dollar gain that is a small share of the maximum is still maturing."
    sources: ["options_positions_monitor"]
  options.mark:
    label: "Mark"
    short: "The broker's current mark price for the contract."
    definition: "Broker mark (usually the bid/ask midpoint) per contract, as of the monitoring snapshot."
    why_it_matters: "Every P/L, moneyness and greek figure on the card is priced from it."
    interpretation: "A stale or one-sided mark makes the whole card stale; check the quote time."
    watch: "Marks outside market hours can be the last trade, not a live quote."
    sources: ["schwab_positions"]
  options.theta:
    label: "Theta"
    short: "Daily time decay of the contract value, in dollars per contract."
    definition: "Model estimate of how much the option loses (or, for a short position, earns) per calendar day if nothing else moves."
    why_it_matters: "Short premium strategies earn theta; long options pay it."
    interpretation: "Compare theta to the remaining premium: decay accelerates in the last three weeks."
    sources: ["options_positions_monitor"]
  options.vega:
    label: "Vega"
    short: "Contract value change per one-point move in implied volatility."
    definition: "Model sensitivity of the option price to a 1-point change in implied volatility, in dollars per contract."
    why_it_matters: "A short-premium trade loses if IV rises after entry even when the stock is unchanged."
    interpretation: "High vega with an earnings event ahead means the IV crush, not the move, decides the trade."
    sources: ["options_positions_monitor"]
  options.profit_captured_pct:
    label: "Profit captured"
    short: "Share of the maximum possible profit already earned."
    definition: "Unrealized P/L divided by the maximum profit available at open, as a percentage."
    why_it_matters: "The harvest rule closes winners once most of the premium is captured rather than holding for the last dollars."
    interpretation: "Above the desk's harvest threshold the card says HARVEST; below it, time in trade is the cost."
    benchmark: "Short-premium desks commonly take profits between 50% and 75% of maximum."
    sources: ["options_positions_monitor"]
  options.margin_usd:
    label: "Margin"
    short: "Buying power the broker holds against this position."
    definition: "Broker maintenance requirement for the leg in dollars, with the status the monitor reports."
    why_it_matters: "It is the capital the trade ties up; the return on it is the real yield."
    interpretation: "UNKNOWN means the broker did not report a figure, not that it is zero."
    sources: ["schwab_positions"]
  options.moneyness:
    label: "Moneyness"
    short: "Whether the strike is in, at or out of the money against the current stock price."
    definition: "ITM when exercise would have intrinsic value, OTM when it would not, ATM when the strike is near the price."
    why_it_matters: "Short options that move ITM carry assignment risk; long options OTM near expiry expire worthless."
    interpretation: "Read with the distance to the strike; a short put 2% OTM with 3 DTE is a different trade from one 15% OTM."
    sources: ["options_positions_monitor"]
  options.lifecycle_phase:
    label: "Lifecycle"
    short: "Where this position is in the desk's hold-harvest-defend cycle."
    definition: "LET MATURE (still earning), HARVEST (take the profit), DEFEND (risk rules triggered) or MONITOR, set by the position monitor."
    why_it_matters: "It is the desk's recommended posture; the action buttons follow it."
    interpretation: "DEFEND names the rule that fired in the rationale; HARVEST is a profit rule, not a risk rule."
    sources: ["options_positions_monitor"]
  options.collateral:
    label: "Collateral"
    short: "Cash or buying power the trade requires to open."
    definition: "Cash secured for a put, the spread width times contracts for a credit spread, or the shares held for a covered call."
    why_it_matters: "The yield on the trade is the credit divided by this figure, not by the stock price."
    interpretation: "Compare to account cash on the combined-exposure line; several ideas on one name commit collateral together."
    sources: ["options_engine"]
  options.insured_shares:
    label: "Insured shares"
    short: "How many of the shares held this put actually protects."
    definition: "Contracts times 100, capped at the shares held; the remainder is uninsured."
    why_it_matters: "A hedge on 100 of 130 shares leaves 30 shares fully exposed below the floor."
    interpretation: "Read the floor value as the protected value only; the uninsured note states the rest."
    sources: ["options_engine"]
  options.spread_width:
    label: "Width"
    short: "Distance between the short and long strikes of a spread."
    definition: "Short strike minus long strike, in dollars per share; times 100 per contract it is the most the spread can lose before credit."
    why_it_matters: "Max loss is the width less the credit received; a wider spread is a bigger bet for a slightly bigger credit."
    interpretation: "Credit as a share of width is the trade's risk price; the desk shows the ratio as loss-to-credit."
    sources: ["options_engine"]
  options.net_cost_if_assigned:
    label: "Net cost if assigned"
    short: "What you would pay per share if the put is assigned, after the premium."
    definition: "Strike minus the premium collected per share, the effective purchase price on assignment."
    why_it_matters: "A cash-secured put is a limit order to buy that pays you to wait; this is the price you are agreeing to."
    interpretation: "Compare to today's price: the discount to spot is the cushion before the trade loses."
    sources: ["options_engine"]
  options.called_away_price:
    label: "If called away"
    short: "Effective sale price per share if the covered call is assigned."
    definition: "Strike plus the premium collected per share."
    why_it_matters: "It is the most you make on the shares while the call is open; upside above it is given up."
    interpretation: "Compare to your cost basis and to the analyst targets: a strike below basis locks in a loss on assignment."
    sources: ["options_engine"]
  options.alpaca_paper_only:
    label: "Alpaca Paper Only"
    short: "This route uses Alpaca simulated paper orders only."
    definition: "Alpaca paper sends a simulated limit order — no live broker execution. Outcomes feed the validation ledger after fill, close, and reconciliation."
    why_it_matters: "Alpaca paper sends a simulated limit order — no live broker execution."
    interpretation: "Confirm paper fill status before treating results as validated."
    watch: "Confirm paper fill status before treating results as validated."
    sources: ["options_engine"]
  options.annualized_yield_on_strike_pct:
    label: "Annualized yield on strike"
    short: "Credit ÷ short strike, annualized by days to expiry."
    definition: "credit / short strike × 365 / dte. One of several yield denominators; not an expected return."
    why_it_matters: "The denominator changes the answer: on width or on max loss the same trade reads very differently."
    interpretation: "Compare like with like; the expected P/L in the economics block is the model estimate."
    sources: ["options_cio_review.build_facts"]
  options.breakeven:
    label: "Breakeven"
    short: "Breakeven is the stock price needed at expiration to break even."
    definition: "For a long option, breakeven is the strike plus the premium paid; for a short put it is the strike minus the credit. {symbol} needs to be beyond the breakeven at expiration for the trade to make money."
    why_it_matters: "For a long call, breakeven is strike plus premium paid."
    interpretation: "Compare breakeven to current price, earnings risk, time left, and your thesis."
    watch: "Compare breakeven to current price, earnings risk, time left, and your thesis."
    sources: ["options_engine"]
  options.breakeven_move_pct:
    label: "Breakeven Move Pct"
    short: "Percent move the stock needs by expiration to reach breakeven."
    definition: "The distance from today's price to the breakeven, as a percentage of today's price. It answers: how far does the stock still have to move by expiration just to get back to even on the trade?"
    why_it_matters: "It compares the breakeven to the reference spot price; a large required move is the trade's headwind."
    interpretation: "Compare this move to typical volatility, earnings gaps, and your thesis timeline."
    watch: "Compare this move to typical volatility, earnings gaps, and your thesis timeline."
    sources: ["options_engine"]
  options.conviction:
    label: "Conviction"
    short: "Desk conviction score for the underlying idea."
    definition: "Conviction summarizes how strongly research or watchlist signals support the symbol. Higher conviction can lift edge ranking — it is advisory input, not order permission."
    why_it_matters: "Conviction summarizes how strongly research or watchlist signals support the symbol."
    interpretation: "Conviction can change when new research or price action arrives."
    watch: "Conviction can change when new research or price action arrives."
    sources: ["options_engine"]
  options.credit_basis:
    label: "Credit basis"
    short: "Whether the credit shown is executable (sell the short leg at its bid, buy the long leg at its ask) or a leg midpoint."
    definition: "A credit spread has two quotes. The executable credit is short bid minus long ask, the credit a marketable limit at the displayed quotes would receive. The midpoint credit averages each leg and is not a fill."
    why_it_matters: "The desk once advertised the midpoint ($8.10 on DELL) while crossing the quotes paid $6.35; on ETON the midpoint was a credit and the executable price a debit."
    interpretation: "Use the executable figure for max profit, max loss and breakeven; treat the midpoint as an upper bound."
    benchmark: "Haircut from mid to executable under 15% of the mid on liquid names; over 25% means the quote is not tradeable."
    watch: "A closed-market quote inflates the haircut; revalidate at the open."
    sources: ["options_economics.spread_quote"]
  options.delta:
    label: "Delta"
    short: "Delta estimates how stock-like the option is."
    definition: "A delta of 0.30 means the option may move about $0.30 for each $1 move in the stock, before other factors change. Higher delta usually means the option behaves more like owning shares. Deep in-the-money calls often have higher delta."
    why_it_matters: "A delta of 0.30 means the option may move about $0.30 for each $1 move in the stock, before other factors change."
    interpretation: "If delta drops, the option may become less stock-like and more speculative."
    watch: "If delta drops, the option may become less stock-like and more speculative."
    sources: ["options_engine"]
  options.delta_proxy:
    label: "Delta Proxy"
    short: "Delta is estimated from moneyness because the chain had no greeks."
    definition: "When the option chain does not carry live greeks, the desk uses a proxy based on how far in- or out-of-the-money the strike is. Treat this as a rough stock-likeness estimate — confirm on the chain before sizing."
    why_it_matters: "When the option chain does not carry live greeks, the desk uses a proxy based on how far in- or out-of-the-money the strike is."
    interpretation: "Open the chain for a live delta quote before paper or manual review."
    watch: "Open the chain for a live delta quote before paper or manual review."
    sources: ["options_engine"]
  options.dte:
    label: "Dte"
    short: "Days to expiration — time left before the contract expires."
    definition: "{dte} days remain until expiration. Theta (time decay) often accelerates in the final two weeks, which matters for long calls and debits."
    why_it_matters: "{dte} days remain until expiration."
    interpretation: "Watch theta, earnings dates, and whether your thesis needs more time."
    watch: "Watch theta, earnings dates, and whether your thesis needs more time."
    sources: ["options_engine"]
  options.dte_bucket:
    label: "Dte Bucket"
    short: "This option expires in the longer-term bucket, around {dte} days."
    definition: "The scanner groups expirations into buckets like 60d, 90d, and 180d so you can compare short-term vs longer-term versions of the same idea. A {dte}d option gives the trade more time to work, but it may cost more and still loses value as time passes."
    why_it_matters: "The scanner groups expirations into buckets like 60d, 90d, and 180d so you can compare short-term vs longer-term versions of the same idea."
    interpretation: "Watch DTE, theta decay, liquidity, and whether the original thesis is still valid."
    watch: "Watch DTE, theta decay, liquidity, and whether the original thesis is still valid."
    sources: ["options_engine"]
  options.earnings_before_expiry:
    label: "Earnings Before Expiry"
    short: "An earnings report is scheduled before this option expires."
    definition: "Earnings can cause large overnight gaps that bypass breakeven math. The desk flags this so you can review event risk explicitly — it is disclosed, not hidden."
    why_it_matters: "Earnings can cause large overnight gaps that bypass breakeven math."
    interpretation: "Compare implied move, historical gaps, and whether you want event exposure."
    watch: "Compare implied move, historical gaps, and whether you want event exposure."
    warning: "Earnings gaps can exceed modeled breakeven moves."
    sources: ["options_engine"]
  options.edge:
    label: "Edge"
    short: "Composite quality score from POP, IV, R:R, and conviction."
    definition: "Edge ranks proposals on the desk. Standard gate is about 62; income sleeve names may use a lower floor. Higher edge means the idea passed more quality checks — still review before action."
    why_it_matters: "Edge ranks proposals on the desk."
    interpretation: "Edge does not replace chain review, thesis check, or risk limits."
    watch: "Edge does not replace chain review, thesis check, or risk limits."
    sources: ["options_engine"]
  options.ev:
    label: "Ev"
    short: "Model expected P/L at expiration — wins AND losses, not credit × POP."
    definition: "Integrated over a lognormal price range at the same implied volatility the desk used for POP, with zero drift. For a fairly priced option it is close to zero: collecting premium is not free money. Until 2026-09-27 this chip showed credit × POP, which ignored the losing outcomes."
    why_it_matters: "Integrated over a lognormal price range at the same implied volatility the desk used for POP, with zero drift."
    interpretation: "Model estimate only. Use it with max loss, net cost if assigned, and a live Schwab validation."
    watch: "Model estimate only. Use it with max loss, net cost if assigned, and a live Schwab validation."
    sources: ["options_engine"]
  options.event_confidence:
    label: "Event Confidence"
    short: "Confidence in the earnings date and event metadata."
    definition: "Event confidence reflects how reliable the earnings calendar and stored history are. Low confidence means treat event lines as review-only."
    why_it_matters: "Event confidence reflects how reliable the earnings calendar and stored history are."
    interpretation: "Verify earnings date on an external calendar before event trades."
    watch: "Verify earnings date on an external calendar before event trades."
    sources: ["options_engine"]
  options.floor_value:
    label: "Floor after premium"
    short: "Value the insured shares cannot fall below, net of the premium paid."
    definition: "(strike − premium) × insured shares."
    why_it_matters: "It is the number the insurance actually guarantees."
    interpretation: "Read it against your cost basis, not only the mark."
    sources: ["options_economics"]
  options.hedged_max_loss_from_mark:
    label: "Max loss (hedged shares)"
    short: "What the insured shares can lose from today's mark, premium included, before the put floor holds."
    definition: "(mark − (strike − premium)) × insured shares."
    why_it_matters: "A protective put card is insurance on held stock; the put's own premium is not the position's max loss."
    interpretation: "Compare with the loss to the floor from your cost basis, which is usually larger."
    watch: "Shares beyond the insured count are unhedged."
    sources: ["options_economics"]
  options.historical_move:
    label: "Historical Move"
    short: "Average absolute post-earnings move from stored history."
    definition: "Historical move averages past earnings reactions on record. Thin sample counts mean less confidence — the desk reports sample size honestly."
    why_it_matters: "Historical move averages past earnings reactions on record."
    interpretation: "Few samples or stale events deserve extra caution."
    watch: "Few samples or stale events deserve extra caution."
    sources: ["options_engine"]
  options.implied_move:
    label: "Implied Move"
    short: "Market-implied expected move into the event (from ATM straddle)."
    definition: "Implied move comes from the ATM straddle mid at the event expiration when available. It is what options are pricing for earnings — not a forecast."
    why_it_matters: "Implied move comes from the ATM straddle mid at the event expiration when available."
    interpretation: "Compare implied move to historical earnings gaps and breakeven."
    watch: "Compare implied move to historical earnings gaps and breakeven."
    sources: ["options_engine"]
  options.iv:
    label: "Iv"
    short: "Implied volatility (IV) is the market’s estimate of future price swings."
    definition: "Higher IV usually means options cost more. IV on the card may come from the chain mid or a desk snapshot — compare to historical range when IV rank is available."
    why_it_matters: "Higher IV usually means options cost more."
    interpretation: "Watch IV into earnings and whether you are paying up for event risk."
    watch: "Watch IV into earnings and whether you are paying up for event risk."
    sources: ["options_engine"]
  options.iv_history_building:
    label: "Iv History Building"
    short: "IV rank is not ready yet — history is still accumulating."
    definition: "IV rank needs a history of daily at-the-money IV snapshots before it can say where today's IV sits in its range. Until enough days are stored the desk reports the gap honestly instead of guessing."
    why_it_matters: "An IV rank without enough history is a guess, and premium richness is judged from it."
    interpretation: "Treat IV context as unavailable until history completes — rely on chain quotes."
    watch: "Treat IV context as unavailable until history completes — rely on chain quotes."
    sources: ["options_engine"]
  options.iv_rank:
    label: "Iv Rank"
    short: "IV rank shows where current implied volatility sits vs its 52-week range."
    definition: "IV rank 50% means ATM implied vol is higher than 50% of the past year's readings. Higher rank often means richer option prices (you pay more for calls / collect more for credits)."
    why_it_matters: "IV rank 50% means ATM implied vol is higher than 50% of the past year's readings."
    interpretation: "Rich IV can mean pay-up risk; cheap IV can mean less premium cushion."
    watch: "Rich IV can mean pay-up risk; cheap IV can mean less premium cushion."
    sources: ["options_engine"]
  options.live_eligible_false:
    label: "Live Eligible False"
    short: "This row is not eligible for live broker execution."
    definition: "Live Path B requires enterprise.live_eligible (spread, open interest, volume, not BS-estimate-only) plus per-order 2FA. Educational paper-model rows never go live. Paper validation n/30 does not unlock Schwab."
    why_it_matters: "Live Path B requires enterprise.live_eligible (spread, open interest, volume, not BS-estimate-only) plus per-order 2FA."
    interpretation: "Read the block reasons on the card — usually spread, OI, volume, or educational paper."
    watch: "Read the block reasons on the card — usually spread, OI, volume, or educational paper."
    sources: ["options_engine"]
  options.loss_to_credit_ratio:
    label: "Loss : credit"
    short: "Max loss divided by the credit received."
    definition: "For a defined-risk credit spread, (width − credit) ÷ credit."
    why_it_matters: "It is the number of winning trades one full loss erases."
    interpretation: "Above 3 needs a probability of profit well over 75% to break even over many trades."
    benchmark: "Desk floor: return on risk ≥ 25% (ratio ≤ 4)."
    sources: ["options_cio_review.build_facts"]
  options.max_gain:
    label: "Max Gain"
    short: "Best-case profit if the trade works as modeled."
    definition: "Max profit is the ceiling under the desk model — spreads cap gains at the long leg; short premium keeps credit if options expire worthless. Actual fills and early closes can differ."
    why_it_matters: "Max profit is the ceiling under the desk model — spreads cap gains at the long leg; short premium keeps credit if options expire worthless."
    interpretation: "Do not assume max profit is likely — review POP and breakeven instead."
    watch: "Do not assume max profit is likely — review POP and breakeven instead."
    sources: ["options_engine"]
  options.max_loss:
    label: "Max Loss"
    short: "Worst-case loss if the trade goes against you."
    definition: "For defined-risk spreads, max loss is usually the net debit or spread width minus credit. For long options, max loss is often the premium paid. For covered calls, stock downside can exceed the credit collected."
    why_it_matters: "For defined-risk spreads, max loss is usually the net debit or spread width minus credit."
    interpretation: "Compare max loss to portfolio risk limits and thesis conviction."
    watch: "Compare max loss to portfolio risk limits and thesis conviction."
    sources: ["options_engine"]
  options.max_profit:
    label: "Max Profit"
    short: "Best-case profit if the trade works as modeled."
    definition: "Max profit is the ceiling under the desk model — spreads cap gains at the long leg; short premium keeps credit if options expire worthless. Actual fills and early closes can differ."
    why_it_matters: "Max profit is the ceiling under the desk model — spreads cap gains at the long leg; short premium keeps credit if options expire worthless."
    interpretation: "Do not assume max profit is likely — review POP and breakeven instead."
    watch: "Do not assume max profit is likely — review POP and breakeven instead."
    sources: ["options_engine"]
  options.net_credit:
    label: "Net Credit"
    short: "Net cash collected to open the spread package."
    definition: "Net credit is short-leg premium minus long-leg cost. You keep it if the spread expires worthless, but assignment or defense can change outcomes."
    why_it_matters: "Net credit is short-leg premium minus long-leg cost."
    interpretation: "Watch short-strike distance, margin, and event gap risk."
    watch: "Watch short-strike distance, margin, and event gap risk."
    sources: ["options_engine"]
  options.net_debit:
    label: "Net Debit"
    short: "Net cash paid to open the spread package."
    definition: "Net debit is long-leg cost minus short-leg credit for multi-leg trades. It is usually close to max loss on defined-risk debit spreads."
    why_it_matters: "Net debit is long-leg cost minus short-leg credit for multi-leg trades."
    interpretation: "Confirm package mid, slippage, and leg liquidity on the chain."
    watch: "Confirm package mid, slippage, and leg liquidity on the chain."
    sources: ["options_engine"]
  options.no_live_path:
    label: "No Live Path"
    short: "No live broker execution path exists for this row."
    definition: "Blocked from live broker execution. Desk Path B needs enterprise liquidity gates + per-order 2FA — paper validation does not unlock live."
    why_it_matters: "Blocked from live broker execution."
    interpretation: "Use paper lab or manual review for educational rows; Path B stays 2FA-only when live_eligible clears."
    watch: "Use paper lab or manual review for educational rows; Path B stays 2FA-only when live_eligible clears."
    sources: ["options_engine"]
  options.oi:
    label: "Oi"
    short: "Open interest counts outstanding contracts at this strike."
    definition: "Higher open interest often means more liquidity and tighter markets. Very low OI can mean wider bid/ask spreads and harder fills — especially important before paper or manual tickets."
    why_it_matters: "Higher open interest often means more liquidity and tighter markets."
    interpretation: "Pair OI with volume to see if the strike is actively traded."
    watch: "Pair OI with volume to see if the strike is actively traded."
    sources: ["options_engine"]
  options.paper_validation:
    label: "Paper Validation"
    short: "Paper-lab outcome ledger (advisory only)."
    definition: "{validation_message}"
    why_it_matters: "{validation_message}."
    interpretation: "Lab credit applies only after fill, close, and outcome reconciliation. Desk Path B strategies ignore this as a live gate."
    watch: "Lab credit applies only after fill, close, and outcome reconciliation. Desk Path B strategies ignore this as a live gate."
    sources: ["options_engine"]
  options.pkg_slippage:
    label: "Pkg Slippage"
    short: "Estimated slippage if each leg fills at the ask/bid instead of mid."
    definition: "Package slippage models worse-than-mid fills on every leg. Real fills may be better or worse — use it as a conservative liquidity warning."
    why_it_matters: "Package slippage models worse-than-mid fills on every leg."
    interpretation: "Wide leg spreads increase slippage — review live quotes."
    watch: "Wide leg spreads increase slippage — review live quotes."
    sources: ["options_engine"]
  options.pop:
    label: "Pop"
    short: "Probability of profit at expiration under the desk model."
    definition: "POP estimates how often the trade finishes profitable if held to expiration. It is a model output, not a guarantee — thesis, earnings, and early management can change outcomes."
    why_it_matters: "POP estimates how often the trade finishes profitable if held to expiration."
    interpretation: "Compare POP to breakeven distance, max loss, and your hold plan."
    watch: "Compare POP to breakeven distance, max loss, and your hold plan."
    sources: ["options_engine"]
  options.premium:
    label: "Premium"
    short: "Premium is the quoted price for one option contract."
    definition: "Premium is usually shown per share; one contract covers 100 shares, so multiply by 100 for total cash. For debits you pay premium; for credits you collect it. Confirm the live bid/ask on the chain before sizing."
    why_it_matters: "Premium is usually shown per share; one contract covers 100 shares, so multiply by 100 for total cash."
    interpretation: "Watch bid/ask width, mid vs last, and whether the quote is stale."
    watch: "Watch bid/ask width, mid vs last, and whether the quote is stale."
    sources: ["options_engine"]
  options.rr:
    label: "Rr"
    short: "Reward-to-risk ratio: max gain divided by max loss."
    definition: "R:R compares upside to downside on defined-risk trades. Higher is generally better, but a high R:R with low POP may still be a low-quality idea. Spreads and credits use package economics."
    why_it_matters: "R:R compares upside to downside on defined-risk trades."
    interpretation: "Read R:R together with POP, breakeven, and liquidity."
    watch: "Read R:R together with POP, breakeven, and liquidity."
    sources: ["options_engine"]
  options.share_capital_pct:
    label: "Share Capital Pct"
    short: "This compares option cost to buying 100 shares."
    definition: "Buying 100 shares of {symbol} outright would take far more cash. This option controls roughly 100 shares for a fraction of that; the percentage is the option's cost as a share of the 100-share cost."
    why_it_matters: "Capital efficiency is the reason to use an option instead of shares; the same percentage is also the share of capital that can go to zero."
    interpretation: "Lower capital use does not mean lower risk. The option can still lose 100% of the debit paid."
    watch: "Lower capital use does not mean lower risk. The option can still lose 100% of the debit paid."
    sources: ["options_engine"]
  options.spread_pct:
    label: "Spread Pct"
    short: "Bid/ask spread as a percent of the mid price."
    definition: "A wide spread means the quoted mid may not be what you actually fill at. The desk flags wide spreads because slippage can eat edge on entry and exit."
    why_it_matters: "A wide spread means the quoted mid may not be what you actually fill at."
    interpretation: "Review live quotes before sizing — wide spreads deserve smaller size or limits."
    watch: "Review live quotes before sizing — wide spreads deserve smaller size or limits."
    sources: ["options_engine"]
  options.strike:
    label: "Strike"
    short: "The strike is the price where the option contract is anchored."
    definition: "For a call option, the strike is the price where the contract gives you the right to buy 100 shares at expiration. Compare the strike to the current stock price to see how far in- or out-of-the-money the contract is."
    why_it_matters: "For a call option, the strike is the price where the contract gives you the right to buy 100 shares at expiration."
    interpretation: "Compare the strike to spot price, breakeven, delta, and liquidity."
    watch: "Compare the strike to spot price, breakeven, delta, and liquidity."
    sources: ["options_engine"]
  options.thesis:
    label: "Thesis"
    short: "Where the underlying idea came from on the desk."
    definition: "Thesis source links the option idea to watchlist conviction, holdings, or scanner context. It explains why this symbol surfaced — not whether the trade is guaranteed to work."
    why_it_matters: "Thesis source links the option idea to watchlist conviction, holdings, or scanner context."
    interpretation: "Re-check thesis if price action, news, or earnings change the story."
    watch: "Re-check thesis if price action, news, or earnings change the story."
    sources: ["options_engine"]
  options.total_credit:
    label: "Total Credit"
    short: "Total cash you would collect if the trade fills."
    definition: "Total credit = premium per share × 100 × number of contracts. Credit strategies keep this if the trade works, but assignment or defense can change the outcome. Review max loss and margin requirements."
    why_it_matters: "Total credit = premium per share × 100 × number of contracts."
    interpretation: "Watch assignment risk, margin, and whether credit matches your risk budget."
    watch: "Watch assignment risk, margin, and whether credit matches your risk budget."
    sources: ["options_engine"]
  options.total_debit:
    label: "Total Debit"
    short: "Total cash you would pay if the trade fills."
    definition: "Total debit = premium per share × 100 × number of contracts. This is the maximum you can lose on many long-option trades (excluding fees). Review before any paper or manual ticket."
    why_it_matters: "Total debit = premium per share × 100 × number of contracts."
    interpretation: "Confirm contracts, limit price, and account cash available."
