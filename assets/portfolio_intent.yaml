# portfolio_intent.yaml — Position Intent Map
# Controls stop logic, covered call eligibility, and technical analysis depth
# Edit via Risk Manager tab → ⚙️ Config, or directly in this file
# Re-run scripts/run_portfolio.bat to apply changes

# ── Intent Categories ─────────────────────────────────────────────────────────
# covered_call_candidate : SMA200 hard stop + monthly calls, V-type strategy
# long_term_hold         : SMA200 - 1xATR stop, core portfolio positions
# growth_speculative     : SMA50 - 0.5xATR stop, higher growth/risk
# income                 : SMA50 - 1xATR stop, protect yield stream
# etf_broad              : SMA200 wide stop, low-turnover index exposure
# day_trade              : SMA20 or 8% trail, short-term only
# unclassified           : SMA50 default (conservative fallback)

covered_call_candidate:
  - V        # Visa — DOJ overhang, 631 shares post-rebalance, sell monthly calls 5-8% OTM
  - LMT      # Lockheed — F-35 backlog, 15 shares, sell quarterly calls if position grows
  - SCHD     # Schwab Dividend ETF — large position, covered call income layer

long_term_hold:
  - NOC      # Northrop — B-21 bomber pure play
  - RTX      # Raytheon — defense/aerospace diversifier
  - CSWC     # Capital Southwest — BDC, 10.5% yield
  - PFLT     # PennantPark — BDC, 11.2% yield
  - BND      # Vanguard Bond ETF — core bond
  - FCNTX    # Fidelity Contrafund — active growth fund
  - BAH      # Booz Allen Hamilton
  - LDOS     # Leidos — government IT
  - LHX      # L3Harris
  - NEE      # NextEra Energy
  - AVAV     # AeroVironment

growth_speculative:
  - KTOS     # Kratos Defense — autonomous systems, volatile
  - RKLB     # Rocket Lab — space, speculative
  - ARKQ     # ARK Autonomous Tech ETF — high beta
  - ARKG     # ARK Genomics — speculative
  - IRDM     # Iridium — satellite, volatile

income:
  - DIV      # Global X Super Dividend ETF
  - CSWC     # Also income — BDC
  - PFLT     # Also income — BDC

etf_broad:
  - SCHG     # Schwab US Large Cap Growth ETF
  - VTI      # Vanguard Total Stock Market
  - SCHB     # Schwab Broad Market ETF
  - VXUS     # Vanguard Total International
  - SGOV     # iShares 0-3 Month Treasury
  - SHV      # Short-term Treasury
  - AGG      # iShares Core US Aggregate Bond
  - VCIT     # Vanguard Intermediate Corporate Bond
  - JEPI     # JPMorgan Equity Premium Income
  - JEPQ     # JPMorgan Nasdaq Equity Premium
  - PFF      # iShares Preferred Stock

# Fidelity 401k fund codes
fidelity_funds:
  - FID-CONTRA-F
  - SP500-D
  - VANG-FTSE-SOC
  - TRP-LVAL
  - JPM-LGCG
  - SS-SMMD
  - WM-BLAIR
  - AB-DISC-Z
  - FID-DIVINTL
  - SS-GACEQ
  - AMANX

# Covered call settings
covered_call_settings:
  default_dte_days: 30          # Days to expiration
  default_otm_pct: 0.06         # 6% out of the money default strike
  min_otm_pct: 0.04             # Never less than 4% OTM (too close)
  max_otm_pct: 0.10             # Never more than 10% OTM (too far, low premium)
  earnings_blackout_days: 14    # Days before earnings — no new calls
  min_shares_for_call: 100      # Minimum lot size to write 1 contract
  iv_rank_minimum: 25           # Don't write calls when IV rank < 25 (cheap premium)

# Enterprise options desk controls (options_desk_enterprise.py)
options_desk_settings:
  earnings_blackout_days: 14    # Block new short-premium through earnings window
  min_open_interest: 50         # Min OI per leg for live-eligible proposals
  min_volume: 5                 # Min daily volume (relaxed when OI is deep)
  max_bid_ask_spread_pct: 12.0  # Max bid-ask as % of mid
  require_chain_for_live: true  # BS estimates advisory-only until chain confirms
  max_net_delta_pct: 35.0       # Portfolio net-delta exposure warning threshold
  max_symbol_notional_pct: 25.0 # Single-name options notional concentration cap
  approval_required: true       # Operator must approve in desk queue before live submit
  desk_tier_edge_a: 72          # Tier A — priority desk routing
  desk_tier_edge_b: 62          # Tier B — standard desk
  # Income idea screen (2026-09-26): build a card only from a contract the
  # liquidity gate above can pass. Read by scripts/lib/options_income_quality.py.
  min_underlying_price: 5.0            # No income ideas on sub-$5 names
  min_premium_per_share: 0.10          # Below this the idea is noise
  min_annualized_roc_pct: 6.0          # Premium / capital at risk, annualized
  picker_strike_slack_pct: 8.0         # How far from the target strike a liquid contract may be
  csp_target_abs_delta: 0.25           # Cash-secured put strike by |delta| when the chain has deltas
  cc_target_delta: 0.25                # Covered call strike by delta when the chain has deltas
  edge_roc_full_credit_ann_pct: 25.0   # Wheel edge gives full ROC credit only at this annualized yield
  funnel_dust_max_market_value: 250.0  # Holdings below this (and under 100 sh) are fractional leftovers, not CC candidates
  price_max_age_hours: 96              # Refuse a spot older than this (covers a weekend); chain underlying wins when present
  iv_history_min_samples: 60           # IV rank from history needs at least this many readings
  iv_history_min_span_days: 90         # ...spanning at least this many days; else the chain/Finviz proxy
  # Advisory exit plan shown on each options card (operator 2026-09-26). Text, not orders.
  # Options thesis lifecycle (operator 2026-09-26): research -> CIO review -> decision,
  # or archived as abandoned. Read by scripts/lib/options_thesis_lifecycle.py.
  options_thesis_lifecycle:
    abandon_after_hours: 48        # operator choice 2026-09-26
    research_rerequest_hours: 24
    cio_review_mode: live          # operator choice 2026-09-26: LLM CIO review, operator confirms
    max_reviews_per_run: 6
    research_priority: high
    research_drain_per_tick: 2     # hermes CIO worker --max 2
    research_tick_minutes: 15      # tradeai-hermes-cio-worker.timer OnCalendar=*:0/15
    review_max_tokens: 2500        # CIO review output limit; 1200 truncated the first live reviews
    followup_due_hours: 24         # MORE_RESEARCH follow-up must be delivered within this
    max_followup_rounds: 2         # more MORE_RESEARCH decisions than this archive the idea
    monitor_recheck_hours: 24      # MONITOR_ONLY re-reviews after this
    max_deliverables: 5            # follow-up questions taken from the CIO's unknowns/concerns
    memory_reads: true             # operator 2026-09-26: CIO review reads prior options facts from M2 memory
    memory_reads_limit: 8          # prior decisions/theses/follow-ups supplied to one review
    memory_reads_lookback_days: 180
    # Operator 2026-09-26: "if web unsure use chatgpt grok deepseek". Web-backed follow-up
    # answers still weak -> Hermes external researcher, lanes in order, first answer wins.
    escalation_enabled: true
    escalation_lanes: [chatgpt, grok, deepseek]
    escalation_min_answered_ratio: 0.6   # share of deliverables fully answered
    escalation_min_cited_urls: 2         # web sources cited across the answers
    escalation_timeout_s: 300            # per lane
    escalation_max_per_run: 1
  # Web retrieval for Hermes CIO research on an options thesis gap (operator 2026-09-26:
  # "why not using hermes brave etc research ... same research lanes"). SearXNG first
  # (free), Brave router only when SearXNG finds nothing (paid; caller cap in
  # search_budget.CALLER_DAILY_CAPS). Read by scripts/lib/hermes_web_research.py.
  # Symbol-news curation + SLA (operator 2026-09-27: "wire a process that monitors and
  # fixes this ... we need SLAs"). topic_curator reviews topic_* news only; company news
  # was never curated, so the thesis gate's "no approved primary or news" never cleared.
  # Read by scripts/lib/symbol_news_curation.py and scripts/symbol_news_curation_monitor.py.
  symbol_news_curation:
    max_age_days: 30               # only recent articles are approved as evidence
    max_per_symbol: 5              # approvals per symbol per pass
    max_symbols_per_run: 40        # priority symbols the monitor curates per run
    blocked_sources: []            # publishers never auto-approved
    primary_source_prefixes: [sec_edgar]   # counted as primary filings
    sla_hours_priority: 24         # evidence-needing symbol with no approved news past this = breach
    sla_hours_default: 72
    acquire_per_run: 2             # open priority requests re-acquired per monitor run
    acquire_max_llm: 2             # model calls per monitor run for those acquisitions
  web_research:
    # 2026-09-27 due diligence W0-4: every Hermes CIO research request (~17/day) is
    # web-grounded, not only options gaps; its answer reaches the symbol thesis via
    # accept_research_result. Book-level requests with no symbol search nothing.
    enabled_reasons: ["*"]
    research_objects_path: ~/trade-ai-state/persistent_wake/research_objects.jsonl   # governed producer feed
    reuse_research_objects_hours: 72
    max_reused_objects: 4
    caller: hermes_cio_research
    max_queries: 6                 # searches per research request (4 thesis intents + CIO concerns)
    results_per_query: 3
    max_results: 10                # web results supplied to the model
    snippet_chars: 500
    brave_fallback: true
  # Symbol-thesis ENRICHES rule (operator 2026-09-26): grade-A research that is not
  # INSUFFICIENT_DATA may FILL EMPTY invalidation_conditions / catalysts on an existing
  # symbol thesis. It never changes stance or an authored summary. Also caps the
  # merged lists every research acceptance writes. Read by scripts/lib/research_thesis_delta.py.
  symbol_thesis_enrich:
    scope: options_horizon         # write_provenance.scope on an ENRICHES version
    cooldown_hours: 24             # min hours between ENRICHES versions for one symbol
    invalidation_cap: 8            # max invalidation_conditions kept (prior conditions first)
    catalyst_cap: 8                # max catalysts kept after past-dated ones are pruned
    evidence_cap: 60               # max evidence_for / counter_evidence ids kept (newest)
    item_max_chars: 2000           # longest single invalidation/catalyst/evidence text stored
    # Writers whose summary is machine text, so research may replace it. Any other
    # writer's summary is treated as authored and inherited. A mint record (mint_state
    # set, no write_provenance) is machine text too.
    machine_writers:
      - research_thesis_delta
      - thesis_mint_from_research
      - thesis_mint_dryrun
      - symbol_thesis_canary
      - symbol_thesis_freshness
  # Live Schwab validation (operator 2026-09-26): approve only on a fresh re-quote.
  validation:
    max_premium_change_pct: 15.0   # premium move vs the proposal that counts as material
    max_spot_change_pct: 3.0       # underlying move vs the proposal that counts as material
    fresh_minutes: 30              # a VALIDATED result older than this does not allow approval
    strike_count: 40               # strikes requested around the money when re-quoting
  options_exit_rules:
    cash_secured_put:
      take_profit: "Buy back when 50% of the credit is earned"
      cut_loss: "Close if the put costs 2x the credit collected, or the thesis breaks"
      time_exit: "At 21 days left, close or roll rather than hold into expiry"
    covered_call:
      take_profit: "Buy back when 50% of the credit is earned"
      cut_loss: "Roll up and out if the stock runs through the strike and you want to keep the shares"
      time_exit: "At 21 days left, decide: let it expire, roll, or accept assignment"
    credit_spread:
      take_profit: "Close at 50% of max profit"
      cut_loss: "Close if the loss reaches 2x the credit, or the short strike is breached"
      time_exit: "At 21 days left, close rather than hold into expiry"
    protective_put:
      take_profit: "If the stock falls and the put gains, decide whether to sell the put or keep the floor"
      cut_loss: "The cost is capped at the premium paid"
      time_exit: "Remove or roll the hedge at 21 days left, or when the risk it covers has passed"
    long_call:
      take_profit: "Take profit at +100% on the premium"
      cut_loss: "Cut at -50% of the premium, or when the thesis breaks"
      time_exit: "Exit by 21 days left; time decay accelerates"
  hard_risk_limits:
    max_contracts_per_order: 5
    max_daily_orders: 10
    max_daily_notional: 50000
    max_daily_loss: 5000
    max_per_strategy_notional: 30000
    max_per_account_notional: 75000
    min_buying_power: 5000
    quote_max_age_seconds: 120
    chain_max_age_seconds: 300
    quote_move_tolerance_pct: 2.0

# Stop suggestion settings
stop_settings:
  covered_call_candidate_multiplier: 1.0   # SMA200 - 1.0xATR
  long_term_hold_multiplier: 1.0            # SMA200 - 1.0xATR
  growth_speculative_multiplier: 0.5        # SMA50 - 0.5xATR
  income_multiplier: 1.0                    # SMA50 - 1.0xATR
  etf_broad_multiplier: 1.0                 # SMA200 - 1.0xATR
  trail_pct_speculative: 8.0               # % trailing for speculative

# Benchmark for performance attribution
benchmark:
  spy_weight: 0.55
  ita_weight: 0.20    # iShares US Aerospace & Defense
  agg_weight: 0.25    # iShares Core US Aggregate Bond

# Symbol-thesis evidence (operator 2026-09-27): the house's own conclusions are not
# evidence for a thesis about the same symbol. DELL's v1 thesis was synthesized from
# 16 cio_decision rows ("DELL CIO: MORE_RESEARCH"). Read by symbol_thesis_evidence.
thesis_evidence:
  exclude_source_types: [cio_decision, agent_result, agent_synthesis, fused_signal]
