# Covered call settings
covered_call_settings:
  default_dte_days: 30          # Days to expiration
  default_otm_pct: 0.06         # 6% out of the money default strike
  min_otm_pct: 0.04             # Never less than 4% OTM (too close)
  max_otm_pct: 0.10             # Never more than 10% OTM (too far, low premium)
  earnings_blackout_days: 14    # Days before earnings — no new calls
  min_shares_for_call: 100      # Minimum lot size to write 1 contract
  iv_rank_minimum: 25           # Don't write calls when IV rank < 25 (cheap premium)

# Enterprise options desk controls (options_desk_enterprise.py)
options_desk_settings:
  earnings_blackout_days: 14    # Block new short-premium through earnings window
  min_open_interest: 50         # Min OI per leg for live-eligible proposals
  min_volume: 5                 # Min daily volume (relaxed when OI is deep)
  max_bid_ask_spread_pct: 12.0  # Max bid-ask as % of mid
  require_chain_for_live: true  # BS estimates advisory-only until chain confirms
  max_net_delta_pct: 35.0       # Portfolio net-delta exposure warning threshold
  max_symbol_notional_pct: 25.0 # Single-name options notional concentration cap
  approval_required: true       # Operator must approve in desk queue before live submit
  desk_tier_edge_a: 72          # Tier A — priority desk routing
  desk_tier_edge_b: 62          # Tier B — standard desk
  hard_risk_limits:
    max_contracts_per_order: 5
    max_daily_orders: 10
    max_daily_notional: 50000
    max_daily_loss: 5000
    max_per_strategy_notional: 30000
    max_per_account_notional: 75000
    min_buying_power: 5000
    quote_max_age_seconds: 120
    chain_max_age_seconds: 300
    quote_move_tolerance_pct: 2.0

# Stop suggestion settings
stop_settings:
  covered_call_candidate_multiplier: 1.0   # SMA200 - 1.0xATR
  long_term_hold_multiplier: 1.0            # SMA200 - 1.0xATR
  growth_speculative_multiplier: 0.5        # SMA50 - 0.5xATR
  income_multiplier: 1.0                    # SMA50 - 1.0xATR
  etf_broad_multiplier: 1.0                 # SMA200 - 1.0xATR
  trail_pct_speculative: 8.0               # % trailing for speculative

# Benchmark for performance attribution
benchmark:
  spy_weight: 0.55
  ita_weight: 0.20    # iShares US Aerospace & Defense
  agg_weight: 0.25    # iShares Core US Aggregate Bond
