# portfolio_intent.yaml — Position Intent Map
# Controls stop logic, covered call eligibility, and technical analysis depth
# Edit via Risk Manager tab → ⚙️ Config, or directly in this file
# Re-run scripts/run_portfolio.bat to apply changes

# ── Intent Categories ─────────────────────────────────────────────────────────
# covered_call_candidate : SMA200 hard stop + monthly calls, V-type strategy
# long_term_hold         : SMA200 - 1xATR stop, core portfolio positions
# growth_speculative     : SMA50 - 0.5xATR stop, higher growth/risk
# income                 : SMA50 - 1xATR stop, protect yield stream
# etf_broad              : SMA200 wide stop, low-turnover index exposure
# day_trade              : SMA20 or 8% trail, short-term only
# unclassified           : SMA50 default (conservative fallback)

covered_call_candidate:
  - V        # Visa — DOJ overhang, 631 shares post-rebalance, sell monthly calls 5-8% OTM
  - LMT      # Lockheed — F-35 backlog, 15 shares, sell quarterly calls if position grows
  - SCHD     # Schwab Dividend ETF — large position, covered call income layer

long_term_hold:
  - NOC      # Northrop — B-21 bomber pure play
  - RTX      # Raytheon — defense/aerospace diversifier
  - CSWC     # Capital Southwest — BDC, 10.5% yield
  - PFLT     # PennantPark — BDC, 11.2% yield
  - BND      # Vanguard Bond ETF — core bond
  - FCNTX    # Fidelity Contrafund — active growth fund
  - BAH      # Booz Allen Hamilton
  - LDOS     # Leidos — government IT
  - LHX      # L3Harris
  - NEE      # NextEra Energy
  - AVAV     # AeroVironment

growth_speculative:
  - KTOS     # Kratos Defense — autonomous systems, volatile
  - RKLB     # Rocket Lab — space, speculative
  - ARKQ     # ARK Autonomous Tech ETF — high beta
  - ARKG     # ARK Genomics — speculative
  - IRDM     # Iridium — satellite, volatile

income:
  - DIV      # Global X Super Dividend ETF
  - CSWC     # Also income — BDC
  - PFLT     # Also income — BDC

etf_broad:
