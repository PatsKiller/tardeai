# ⚠️  NOT THE EXECUTOR OF RECORD (verified 2026-07-20 Phase 0 reconciliation).
#
# The production screener runner reads the `finviz_screeners` DATABASE TABLE,
# not this file (scripts/finviz_screener_runner.py:196-198). This file's only
# production reader is scripts/finviz_ingestion.py, which is on NO cron.
# Consequence: ALL 18 definitions below are ORPHANED — zero rows in
# screener_symbol_membership, ever. The 29 screens that actually run are DB rows.
#
# ADDING A SCREEN HERE DOES NOT MAKE IT RUN. Register it in finviz_screeners.
# Run scripts/finviz_registry_reconcile.py for the current three-way state.
#
# ⚠️  CRITICAL: finviz_url MUST use v=152 (custom view), NOT v=111 (overview).
# v=111 ignores &c= columns and silently returns only default fields (no RVOL, Gap, Float).
# Column IDs: 25=Float, 61=Gap, 63=AvgVol, 64=RelVol, 65=Price, 66=Change, 67=Volume
#
# Quality overhaul 2026-05-15:
# - Tightened prime/watchlist: price $5+, avgvol 500K+, cap $500M+ (smallover)
# - Wired quality screeners into run_windows so they actually execute
# - Added PM-specific screeners for breakout confirmation + volume continuation
# - Removed junk penny stock / micro-cap screener settings
version: '12.3'
name: trade-ai-v12-screeners
timezone: America/New_York

storage:
  local_mode: csv_on_disk
  raw_dir: data/raw/finviz
  merged_dir: data/merged
  logs_dir: data/logs
  source_tracking_columns:
    - primary_source_list
    - source_lists
    - source_count
    - screener_name
    - screener_group
    - run_window
    - finviz_url_used
    - ingestion_timestamp
    - strategy_class
    - day_scalping_flag

# ── Run Windows ──────────────────────────────────────────────────────
# AM: momentum + quality pullback + earnings
# PM: breakout confirmation + volume continuation + dividend/recovery
run_windows:
  '0400':
    label: pre_market_initial
    active_screeners: [prime_setups, watchlist_setups]
  '0700':
    label: pre_market_update
    active_screeners: [prime_setups, watchlist_setups]
  '0900':
    label: open_prep_final
    active_screeners: [prime_setups, watchlist_setups, oversold_quality, post_earnings_gappers, earnings_catalyst_pre]
  '1000':
    label: first_hour_read
    active_screeners: [prime_setups, watchlist_setups, quality_pullback, speculative_growth_breakouts, dividend_value_pullback, sector_leadership_rs, defense_aerospace, core_growth_compounders]
  '1200':
    label: midday_refresh
    active_screeners: [pm_breakout_confirmation, pm_volume_continuation, quality_pullback, high_yield_bdc_income, bond_income_defensive]
  '1400':
    label: afternoon_check
    active_screeners: [pm_breakout_confirmation, pm_volume_continuation, speculative_growth_breakouts, dividend_value_pullback, earnings_catalyst_pre]
  '1600':
    label: close_read
    active_screeners: [pm_volume_continuation, quality_pullback, defensive_quality, oversold_quality, core_index_etfs]
  '1730':
    label: post_close
    active_screeners: [prime_setups, watchlist_setups]
  'test-fix':
    label: test_run
    active_screeners: [prime_setups, watchlist_setups]

# ── Screeners ────────────────────────────────────────────────────────
screeners:

  # ── Tier 1: Momentum / Scalp (AM — UNCHANGED per operator instruction) ──
  prime_setups:
    display_name: Prime Setups (Tier 1)
    group: core
    status: active
    strategy_class: day_scalp
    description: RVOL>5x + gap>10% + price $2-$20 + float<50M. All markets.
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_smallunder,sh_avgvol_o100,sh_float_u50,sh_price_2to20,sh_relvol_o5,ta_gap_u10&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  watchlist_setups:
    display_name: Watchlist Setups (Tier 2)
    group: core
    status: active
    strategy_class: day_scalp
    description: RVOL>3x + gap>5% + price $1-$30 + float<100M. All markets.
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_smallunder,sh_avgvol_o100,sh_float_u100,sh_price_1to30,sh_relvol_o3,ta_gap_u5&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  # ── Tier 2: Quality / Income / Dividend (AM + PM) ──
  quality_pullback:
    display_name: Quality Pullback (Fib / Income)
    group: quality
    status: active
    strategy_class: swing_trade
    description: "Mid+ cap quality names pulling back to support. Feeds swing_trade, fib_retracement, income."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,fa_div_high,fa_payoutratio_u80,sh_avgvol_o500,ta_sma50_pa,ta_sma200_pa,ta_rsi_30to50&ft=3&o=relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  dividend_value_pullback:
    display_name: Dividend Value Pullback
    group: quality
    status: active
    strategy_class: dividend_growth_compounder
    description: "Dividend growers on pullback. 5y+ div growth, payout<85%, RSI 30-50."
    finviz_url: "https://elite.finviz.com/export?v=152&f=fa_div_pos,fa_payoutratio_u85,fa_divgrowth5y_o5,ta_rsi_30to50,sh_avgvol_o500&ft=3&o=relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  oversold_quality:
    display_name: Oversold Quality (Recovery Watch)
    group: quality
    status: active
    strategy_class: recovery_watch
    description: "Mid+ cap with positive ROE, RSI oversold, above 200-day. Feeds recovery_watch."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,fa_roe_pos,ta_rsi_os30,ta_sma200_pa,sh_avgvol_o500&ft=3&o=relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  defensive_quality:
    display_name: Defensive Quality (REIT / Bond / Dividend)
    group: quality
    status: active
    strategy_class: reit_income
    description: "Low-beta dividend payers. REIT, utilities, consumer defensive. Payout<85%."
    finviz_url: "https://elite.finviz.com/export?v=152&f=fa_div_high,fa_payoutratio_u85,ta_beta_u1,sh_avgvol_o500&ft=3&sec_realestate,sec_utilities,sec_consumerdefensive&o=dividend&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  # ── Tier 3: Event-Driven (AM) ──
  post_earnings_gappers:
    display_name: Post-Earnings Gappers
    group: event
    status: active
    strategy_class: earnings_post_momentum
    description: "Stocks gapping up post-earnings with volume. Feeds earnings_post_momentum."
    finviz_url: "https://elite.finviz.com/export?v=152&f=earningsdate_yesterday,sh_avgvol_o500,sh_curvol_o2000,ta_gap_u5&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  speculative_growth_breakouts:
    display_name: Speculative Growth Breakouts
    group: growth
    status: active
    strategy_class: speculative_growth
    description: "Small/mid-cap revenue growers with momentum. Sales QoQ>20%, RVOL>2x, 4-week perf>20%."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_smallover,fa_salesqoq_o20,sh_relvol_o2,ta_perf_4w20o,ta_rsi_50to70&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  sector_leadership_rs:
    display_name: Sector Leadership (Relative Strength)
    group: sector
    status: active
    strategy_class: sector_rotation
    description: "Sector ETFs ranked by relative strength — feeds sector_rotation."
    finviz_url: "https://elite.finviz.com/export?v=152&t=XLF,XLE,XLK,XLV,XLI,XLU,XLP,XLB,XLRE,XLC,XLY&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  # ── Tier 4: PM-Specific (afternoon diversity) ──
  pm_breakout_confirmation:
    display_name: PM Breakout Confirmation
    group: pm_diversity
    status: active
    strategy_class: swing_breakout
    description: "Mid+ cap stocks breaking out of consolidation on volume. Above 20-day high, RVOL>2x. PM confirmation of AM setups."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,sh_avgvol_o500,sh_relvol_o2,ta_highlow20d_nh,ta_sma50_pa&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  pm_volume_continuation:
    display_name: PM Volume Continuation
    group: pm_diversity
    status: active
    strategy_class: swing_trade
    description: "Stocks with sustained above-average volume into afternoon. Price $5+, RVOL>1.5x, positive change. Confirms morning momentum is holding."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_smallover,sh_avgvol_o500,sh_price_o5,sh_relvol_o1.5,ta_change_u&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  # ── Tier 5: Gap-fill screeners (covering previously unserved strategies) ──
  earnings_catalyst_pre:
    display_name: Pre-Earnings Catalyst
    group: event
    status: active
    strategy_class: earnings_catalyst
    description: "Upcoming earnings within 7 days, mid+ cap, avg vol 500K+, RSI 40-65 (not overbought). Feeds earnings_catalyst pre-event positioning."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,earningsdate_thisweek,sh_avgvol_o500,ta_rsi_nob40to65&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  high_yield_bdc_income:
    display_name: High Yield BDC / CEF Income
    group: income
    status: active
    strategy_class: high_yield_income_bdc
    description: "BDC, CEF, and high-yield vehicles. Yield >5%, avg vol 200K+, mid+ cap. Income/defensive allocation — not swing-trade."
    finviz_url: "https://elite.finviz.com/export?v=152&f=fa_div_o5,cap_midover,sh_avgvol_o200,ind_assetmanagement&ft=3&o=-dividend&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  bond_income_defensive:
    display_name: Bond / Fixed Income (Defensive)
    group: income
    status: active
    strategy_class: bond_income
    description: "Bond ETFs and fixed income funds. Low beta, yield-focused, avg vol 200K+. Income/defensive allocation bucket — NOT swing-trade."
    finviz_url: "https://elite.finviz.com/export?v=152&f=fa_div_o2,ta_beta_u0.5,sh_avgvol_o200,ind_exchangetradedfund&ft=3&o=-dividend&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  defense_aerospace:
    display_name: Defense / Aerospace Thesis
    group: sector
    status: active
    strategy_class: defense_thesis
    description: "Aerospace and defense sector, mid+ cap, avg vol 500K+, above SMA200. Government revenue exposure thesis."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,ind_aerospacedefense,sh_avgvol_o500,ta_sma200_pa&ft=3&o=-marketcap&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  core_growth_compounders:
    display_name: Core Growth Compounders
    group: growth
    status: active
    strategy_class: core_growth_compounder
    description: "Large-cap quality compounders. EPS growth >10%, ROE >15%, mid+ cap, avg vol 500K+. Long-term position strategy."
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,fa_eps5years_o10,fa_roe_o15,sh_avgvol_o500,ta_sma200_pa&ft=3&o=-marketcap&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  core_index_etfs:
    display_name: Core Index ETFs
    group: index
    status: active
    strategy_class: core_index
    description: "Major index ETFs for core allocation. SPY, QQQ, IWM, DIA, VTI, VXUS, AGG, BND, TLT, GLD, RSP."
    finviz_url: "https://elite.finviz.com/export?v=152&t=SPY,QQQ,IWM,DIA,VTI,VXUS,AGG,BND,TLT,GLD,RSP&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  # ── Not wired (requires existing position) ──
  covered_call_candidates:
    display_name: Covered Call Candidates
    group: options
    status: active
    strategy_class: covered_call_income
    description: >-
      Mid-cap-and-larger optionable names with avg volume >1M — feeds
      covered_call_income. CORRECTED 2026-07-20: previously claimed "elevated IV
      rank", which this screen does not and cannot filter — the Finviz STOCK
      screener has no IV-rank field, and the actual filters are only
      cap_midover, sh_opt_optionshort, sh_avgvol_o1000. True IV rank requires an
      option-IV history series; options_iv_history currently holds 230 rows /
      68 symbols / 12 days, which is insufficient, so IV rank must be reported
      UNAVAILABLE rather than proxied from ATR, beta or realized volatility.
    finviz_url: "https://elite.finviz.com/export?v=152&f=cap_midover,sh_opt_optionshort,sh_avgvol_o1000&ft=3&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"
    requires_existing_position: true
