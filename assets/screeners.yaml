# ⚠️  CRITICAL: finviz_url MUST use v=152 (custom view), NOT v=111 (overview).
# v=111 ignores &c= columns and silently returns only default fields (no RVOL, Gap, Float).
# Column IDs: 25=Float, 61=Gap, 63=AvgVol, 64=RelVol, 65=Price, 66=Change, 67=Volume
version: '12.1d'
name: trade-ai-v12-screeners
timezone: America/New_York

storage:
  local_mode: csv_on_disk
  raw_dir: data/raw/finviz
  merged_dir: data/merged
  logs_dir: data/logs
  source_tracking_columns:
    - primary_source_list
    - source_lists
    - source_count
    - screener_name
    - screener_group
    - run_window
    - finviz_url_used
    - ingestion_timestamp
    - strategy_class
    - day_scalping_flag

run_windows:
  '0400':
    label: pre_market_initial
    active_screeners: [prime_setups, watchlist_setups]
  '0700':
    label: pre_market_update
    active_screeners: [prime_setups, watchlist_setups]
  '0900':
    label: open_prep_final
    active_screeners: [prime_setups, watchlist_setups]
  '1000':
    label: first_hour_read
    active_screeners: [prime_setups, watchlist_setups]

screeners:

  prime_setups:
    display_name: Prime Setups (Tier 1)
    group: core
    status: active
    strategy_class: day_scalp
    description: RVOL>5x + gap>10% + price $2-$20 + float<50M. All markets.
    finviz_url: "https://elite.finviz.com/export.ashx?v=152&f=cap_smallunder,sh_avgvol_o100,sh_float_u50,sh_price_2to20,sh_relvol_o5,ta_gap_u10&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"

  watchlist_setups:
    display_name: Watchlist Setups (Tier 2)
    group: core
    status: active
    strategy_class: day_scalp
    description: RVOL>3x + gap>5% + price $1-$30 + float<100M. All markets.
    finviz_url: "https://elite.finviz.com/export.ashx?v=152&f=cap_smallunder,sh_avgvol_o100,sh_float_u100,sh_price_1to30,sh_relvol_o3,ta_gap_u5&ft=3&o=-relativevolume&c=0,1,2,3,4,5,6,7,25,61,63,64,65,66,67"
